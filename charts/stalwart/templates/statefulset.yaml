apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stalwart.fullname" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The RocksDB datastore is single-writer: a surge pod cannot open it and
  # crashloops on the LOCK file, so the rolling update never converges.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stalwart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stalwart.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        secret.reloader.stakater.com/reload: {{ .Values.tls.certificateSecret | quote }}
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: stalwart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/stalwart/config.json"
          env:
            {{- if .Values.recoveryMode.enabled }}
            - name: STALWART_RECOVERY_MODE
              value: "true"
            - name: STALWART_RECOVERY_MODE_PORT
              value: {{ .Values.recoveryMode.port | quote }}
            - name: STALWART_RECOVERY_MODE_LOG_LEVEL
              value: {{ .Values.recoveryMode.logLevel | quote }}
            {{- end }}
            - name: STALWART_PUBLIC_URL
              value: "https://{{ .Values.hostname }}"
            - name: SES_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ses-smtp
                  key: SES_SMTP_USER
                  optional: true
            - name: SES_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ses-smtp
                  key: SES_SMTP_PASS
                  optional: true
          envFrom:
            - secretRef:
                name: {{ include "stalwart.fullname" . }}-env
                optional: true
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: https
              containerPort: 443
            - name: mgmt
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: mgmt
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/stalwart
            {{- end }}
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "stalwart.fullname" . }}-config
        - name: tls
          secret:
            secretName: {{ .Values.tls.certificateSecret }}
            defaultMode: 0400
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: data-{{ include "stalwart.fullname" . }}-0
        {{- end }}
