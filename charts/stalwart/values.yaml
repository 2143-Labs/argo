# Stalwart Mail Server — values

replicaCount: 1

image:
  repository: stalwartlabs/stalwart
  # Pinned: Application.oauthClientId (needed to send the Pocket ID client id
  # during SSO) exists only from 0.16.19; the floating v0.16 tag had left the
  # cluster on 0.16.17.
  tag: "v0.16.22"
  pullPolicy: IfNotPresent

# Web UI host, used only to build STALWART_PUBLIC_URL (templates/statefulset.yaml).
# It drives every JMAP URL the server hands to clients — apiUrl, downloadUrl,
# uploadUrl, eventSourceUrl and the WebSocket URL — so it must be the origin the
# browser actually reaches. It is NOT the mail domain: mail identities keep
# usernameDomain m.2143.me in RocksDB.
hostname: stalwart.ts.2143.me

# Recovery admin — bootstrap credential for first sign-in.
# Set via external secret (stalwart-env) in the stalwart namespace.
# Remove recoveryAdmin from the secret after permanent account is created.
recoveryAdmin:
  enabled: false
  username: admin

# Recovery mode — starts Stalwart in bootstrap mode (web UI only) for initial config.
# Disable after first successful configuration.
recoveryMode:
  enabled: false
  port: "8080"
  logLevel: info
  livenessDelay: 120

# config.json — only the DataStore. Everything else is configured via web UI.
config:
  "@type": RocksDb
  path: /var/lib/stalwart

# Only `enabled` is read by the chart (templates/statefulset.yaml). accessMode,
# storageClass and size are inert: the claim already exists, is bound to a
# specific 20Gi longhorn-3 volume, and is declared in workloads/stalwart/pvc.yaml
# so that a rebuilt namespace reproduces it instead of binding a fresh empty one.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: longhorn-3
  size: 20Gi

service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.13,fd00:6::13"
  ports:
    smtp: 25
    submission: 587
    imaps: 993

tls:
  certificateSecret: 2143-me-wildcard-tls

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podSecurityContext:
  fsGroup: 2000
  runAsUser: 2000
  runAsGroup: 2000

extraSecretEnv: {}
