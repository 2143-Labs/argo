# Secret/booking-db from OpenBao consumers/data/john2143-com/<namespace>/booking-db
# (MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD; hex, seeded once by hand). Never switch it
# to a generator: the MariaDB volume keeps the password it was initialised with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-db
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: booking-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/{{ .Values.namespace }}/booking-db
---
# Secret/tem-smtp from OpenBao consumers/data/john2143-com/stalwart/scaleway-tem-smtp.
# The same vault entry is also rendered in namespaces default and stalwart
# (workloads/secrets/*-tem-smtp.yaml) and in every booking namespace: a Secret
# cannot be referenced across namespaces, so it is extracted once per consumer.
# Rotating the vault entry reaches all of them.
#
# Scaleway's SMTP credential mapping is opaque: TEM_USERNAME is the SMTP
# username and API_SECRET_KEY is the SMTP password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tem-smtp
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tem-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/scaleway-tem-smtp
