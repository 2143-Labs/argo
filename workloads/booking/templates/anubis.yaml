{{- if .Values.anubis }}
# Anubis in front of the public booking rule (workloads/anubis-aross-files is the
# pattern). It challenges every request, so the cookie a browser earns covers
# every later booking request. Anubis serves its own challenge assets under
# /.within.website/ before policy evaluation; the route publishes that prefix.
#
# The one exception is /assets/img/social-card.png, the og:image of EA's booking
# page (booking_layout.php): a link unfurler fetches it with the same user agent
# it uses for the page, so without the allowance a preview loses its picture.
# openGraph passthrough reads the booking page's tags anonymously and cached.
#
# Persistent HS512 signing key, generated once in-cluster. CreatedOnce = never
# rotated; deleting the Secret makes ESO generate a new one (every visitor
# re-solves the challenge once).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: anubis-signing-key
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  length: 128
  digits: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anubis-signing-key
  namespace: {{ .Values.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: anubis-signing-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: anubis-signing-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-policy
  namespace: {{ .Values.namespace }}
data:
  policy.yaml: |
    bots:
      - name: social-card-image
        path_regex: ^/assets/img/social-card\.png$
        action: ALLOW
      - name: challenge-every-request
        path_regex: .*
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 4
    dnsbl: false

    openGraph:
      enabled: true
      considerHost: true
      ttl: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: {{ .Values.namespace }}
  labels:
    app: anubis
spec:
  # One replica: the default in-memory store keeps issued challenges per pod,
  # so a second replica would fail roughly half of all challenge submissions.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: anubis
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: anubis
    spec:
      enableServiceLinks: false
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://booking.{{ .Values.namespace }}.svc:80"
            - name: REDIRECT_DOMAINS
              value: {{ required "host is required" .Values.host | quote }}
            - name: POLICY_FNAME
              value: "/etc/anubis/policy.yaml"
            - name: HS512_SECRET
              valueFrom:
                secretKeyRef:
                  name: anubis-signing-key
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: policy
              mountPath: /etc/anubis
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: anubis-policy
---
apiVersion: v1
kind: Service
metadata:
  name: anubis
  namespace: {{ .Values.namespace }}
  labels:
    app: anubis
spec:
  selector:
    app: anubis
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
{{- end }}
