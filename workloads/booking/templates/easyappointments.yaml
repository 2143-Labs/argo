apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-overrides
  namespace: {{ required "namespace is required" .Values.namespace }}
data:
  zz-booking.ini: |
    ; The image enables xdebug in debug mode (99-overrides.ini); zz- loads after it.
    xdebug.mode = off
    expose_php = Off
  zz-booking.conf: |
    # CodeIgniter routes a request whose path is empty and whose query string starts
    # with "/" to the controller named in the query (system/core/URI.php:259), so
    # /?/login would reach the admin through the public Exact "/" rule. EA itself
    # never generates such URLs.
    <If "%{QUERY_STRING} =~ m#^/#">
        Require all denied
    </If>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: {{ .Values.namespace }}
  labels:
    app: booking
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: booking
    spec:
      enableServiceLinks: false
      containers:
        - name: easyappointments
          image: docker.io/alextselegidis/easyappointments:1.6.1@sha256:6d3a927dc16db11827018bcbc708e6ee7d4be7f577e5d0967e90a1b08b71e2e0
          env:
            {{- include "booking.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: overrides
              mountPath: /usr/local/etc/php/conf.d/zz-booking.ini
              subPath: zz-booking.ini
              readOnly: true
            - name: overrides
              mountPath: /etc/apache2/conf-enabled/zz-booking.conf
              subPath: zz-booking.conf
              readOnly: true
          # Apache only, not PHP or the database. Before the web installer runs,
          # every EA page except /index.php/installation answers 503 ("Database
          # Migration Required"); probing / would pull the only replica out of
          # the Service and make the installer itself unreachable.
          readinessProbe:
            httpGet:
              path: /assets/img/favicon.ico
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # Apache starts as root and drops to www-data, and the entrypoint
          # rewrites www-data-owned config files: default capabilities stay,
          # no runAsNonRoot (PSS baseline allows this).
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: overrides
          configMap:
            name: booking-overrides
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: {{ .Values.namespace }}
  labels:
    app: booking
spec:
  selector:
    app: booking
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
