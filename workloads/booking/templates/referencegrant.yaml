# Lets the HTTPRoutes in default (templates/httproute.yaml) reach this
# namespace's booking{{ if .Values.anubis }} and anubis{{ end }} Service, and nothing else here.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-default-httproutes
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: booking
    {{- if .Values.anubis }}
    - group: ""
      kind: Service
      name: anubis
    {{- end }}
    {{- if .Values.sso }}
    - group: ""
      kind: Service
      name: booking-oauth2-proxy
    {{- end }}
