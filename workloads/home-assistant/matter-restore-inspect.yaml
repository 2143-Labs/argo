apiVersion: v1
kind: Pod
metadata:
  name: matter-restore-inspect
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: big
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: inspect
      image: ghcr.io/home-assistant-libs/python-matter-server@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
      command:
        - python
        - -c
        - |
          import os, sys, json, shutil
          import chip.native
          from chip.ChipStack import ChipStack
          from chip.CertificateAuthority import CertificateAuthorityManager

          # Work on a copy so the restored volume is never written to.
          os.makedirs("/tmp/kvs", exist_ok=True)
          shutil.copy("/restore/chip.json", "/tmp/kvs/chip.json")
          chip.native.Init(999)
          stack = ChipStack(persistentStoragePath="/tmp/kvs/chip.json",
                            enableServerInteractions=False)
          mgr = CertificateAuthorityManager(chipStack=stack)
          mgr.LoadAuthoritiesFromStorage()
          print("cas:", len(mgr.activeCaList), flush=True)
          admin = mgr.activeCaList[0].adminList[0]
          ctrl = admin.NewController(paaTrustStorePath="/restore/credentials")
          fid = ctrl.GetCompressedFabricId()
          print("compressed_fabric_id:", fid, flush=True)

          counts = {}
          for p in sorted(os.listdir("/restore")):
              if p.endswith(".json") and p != "chip.json":
                  d = json.load(open(os.path.join("/restore", p)))
                  counts[p] = len(d.get("nodes") or {})
                  print("nodefile", p, "nodes=", counts[p], flush=True)

          target = f"{fid}.json"
          other = max([v for k, v in counts.items() if k != target] or [0])
          print("target_file:", target, "target_nodes:", counts.get(target), flush=True)
          print("other_max_nodes:", other, flush=True)
          if counts.get(target, 0) > 0:
              print("GATE: PASS - fabric matches a node file with devices", flush=True)
          elif other > 0:
              print("GATE: FAIL - fabric is not the one that owns the populated node file",
                    flush=True)
          else:
              print("GATE: FAIL - no populated node file on this volume", flush=True)
          sys.stdout.flush()
          os._exit(0)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      env:
        - name: HOME
          value: /tmp
      volumeMounts:
        - name: restore
          mountPath: /restore
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: restore
      persistentVolumeClaim:
        claimName: matter-server-data-oct17
        readOnly: true
    - name: tmp
      emptyDir: {}
