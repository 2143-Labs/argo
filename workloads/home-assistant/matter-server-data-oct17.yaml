apiVersion: v1
kind: PersistentVolume
metadata:
  name: matter-server-data-oct17
spec:
  capacity:
    storage: "5001707520"
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: matter-server-data-oct17
    volumeAttributes:
      dataLocality: best-effort
      fsType: ext4
      numberOfReplicas: "3"
      staleReplicaTimeout: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server-data-oct17
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: "5001707520"
  storageClassName: longhorn-static
  volumeName: matter-server-data-oct17
