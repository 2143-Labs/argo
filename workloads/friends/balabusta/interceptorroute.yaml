apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: balabusta
  namespace: default
spec:
  target:
    service: balabusta
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 5s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "5"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>balabusta is starting</title>
          <meta name="theme-color" content="#fbf9f3">
          <meta http-equiv="refresh" content="5">
          <style>
          html,body{margin:0;height:100%;background:#fbf9f3;color-scheme:light}
          body{display:grid;place-items:center;text-align:center;
               font:16px/1.65 Inter,Arial,sans-serif;color:#303c2b}
          .box{background:#fffdf8;border:1px solid #d9ddce;border-radius:6px;padding:24px 32px}
          .top{margin:0 0 14px;font-size:.72rem;font-weight:500;letter-spacing:.12em;
               text-transform:uppercase;color:#686e60}
          h1{margin:0 0 .5rem;font-family:"Playfair Display",Georgia,serif;
             font-size:1.7rem;font-weight:500;color:#3e5036}
          p{margin:0;font-size:.9rem;color:#686e60}
          </style>
          </head>
          <body>
          <div class="box">
          <p class="top">Thoughtful home care &middot; Montgomery County, Maryland</p>
          <h1>balabusta is starting...</h1>
          <p>The server is waking up. This page refreshes every 5 seconds.</p>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - balabusta.homes
  scalingMetric:
    concurrency:
      targetValue: 10
