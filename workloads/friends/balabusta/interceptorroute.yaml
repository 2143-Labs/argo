apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: balabusta
  namespace: default
spec:
  target:
    service: balabusta
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>balabusta is starting</title>
          <meta name="theme-color" content="#fbf9f3">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#fbf9f3;color-scheme:light}
          body{display:grid;place-items:center;text-align:center;
               font:16px/1.65 Inter,Arial,sans-serif;color:#303c2b}
          .box{background:#fffdf8;border:1px solid #d9ddce;border-radius:6px;padding:24px 32px}
          .top{margin:0 0 14px;font-size:.72rem;font-weight:500;letter-spacing:.12em;
               text-transform:uppercase;color:#686e60}
          h1{margin:0 0 .5rem;font-family:"Playfair Display",Georgia,serif;
             font-size:1.7rem;font-weight:500;color:#3e5036}
          p{margin:0;font-size:.9rem;color:#686e60}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:0 auto 12px;
                border:2px solid #d9ddce;border-top-color:#3e5036;
                animation:spin .7s linear infinite}
          .bar{height:2px;margin:14px 0 0;background:#d9ddce;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#3e5036;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div class="box">
          <p class="top">Thoughtful home care &middot; Montgomery County, Maryland</p>
          <h1>balabusta is starting...</h1>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - balabusta.homes
  scalingMetric:
    concurrency:
      targetValue: 10
