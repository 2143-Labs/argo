apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balabusta
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: balabusta-homes-https
  hostnames:
    - balabusta.homes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
---
# http:// -> https://balabusta.homes for the apex and www (one hop). Separate from
# gateway/john2143-http-to-https, which is at the Gateway API cap of 16 hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balabusta-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - balabusta.homes
    - www.balabusta.homes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: balabusta.homes
            statusCode: 301
---
# https://www.balabusta.homes -> https://balabusta.homes. No backend, so it never
# wakes the scale-to-zero pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balabusta-www-redirect
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: www-balabusta-homes-https
  hostnames:
    - www.balabusta.homes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: balabusta.homes
            statusCode: 301
