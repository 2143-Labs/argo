apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balabusta
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: balabusta-homes-https
  hostnames:
    - balabusta.homes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
---
# http:// -> https:// for balabusta.homes. Same as gateway/john2143-http-to-https,
# which is already at the Gateway API cap of 16 hostnames per HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balabusta-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - balabusta.homes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
