apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: anni
  namespace: default
spec:
  target:
    service: anni
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Anni is starting</title>
          <meta name="theme-color" content="#fafaf7">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#fafaf7;color-scheme:light}
          body{display:grid;place-items:center;text-align:center;
               font:16px/1.7 "Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;color:#1a1a1a}
          .rule{width:56px;height:2px;background:#b5532b;margin:0 auto 18px}
          h1{margin:0 0 .5rem;font-family:"Fraunces","Noto Serif SC",Georgia,serif;
             font-size:1.6rem;font-weight:600}
          p{margin:0;font-size:.95rem;color:#6b6b66}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:18px auto 12px;
                border:2px solid #e6e2da;border-top-color:#b5532b;
                animation:spin .7s linear infinite}
          .bar{height:2px;width:180px;margin:14px auto 0;background:#e6e2da;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#b5532b;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div>
          <div class="rule"></div>
          <h1>Anni is starting...</h1>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - anni.2143.me
  scalingMetric:
    concurrency:
      targetValue: 10
    # The placeholder is answered in ~1ms, so a page view never appears in the
    # instantaneous concurrency count the scaler samples: without this the app would
    # never wake and the page above would reload for ever. Request rate buckets a
    # request across its window (1m), so one page load keeps the route above zero.
    requestRate:
      targetValue: 1
