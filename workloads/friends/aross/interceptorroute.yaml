apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: aross-studio
  namespace: default
spec:
  target:
    service: aross-studio
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>aross.studio is starting</title>
          <meta name="theme-color" content="#2f2f2f">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#2f2f2f;color-scheme:light}
          body{display:grid;place-items:center;text-align:center;font-family:Georgia,serif;color:#000}
          .page{background:#f5f5f5;border:2px solid #000;padding:30px 38px}
          h1{margin:0 0 .5rem;font-size:24px;font-weight:bold}
          p{margin:0;font-size:15px;color:#333}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:0 auto 12px;
                border:2px solid #c8c8c8;border-top-color:#2f2f2f;
                animation:spin .7s linear infinite}
          .bar{height:2px;margin:14px 0 0;background:#c8c8c8;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#2f2f2f;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div class="page">
          <h1>aross.studio is starting...</h1>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - aross.studio
  scalingMetric:
    concurrency:
      targetValue: 10
    # The placeholder is answered in ~1ms, so a page view never appears in the
    # instantaneous concurrency count the scaler samples: without this the app would
    # never wake and the page above would reload for ever. Request rate buckets a
    # request across its window (1m), so one page load keeps the route above zero.
    requestRate:
      targetValue: 1
