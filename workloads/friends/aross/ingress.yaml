apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aross-studio
  namespace: default
spec:
  # www.aross.studio rides the *.aross.studio listener (a route hostname must match
  # its listener); nginx in the image answers www with a 301 to the apex.
  parentRefs:
    - name: shared-gateway
      sectionName: aross-studio-https
    - name: shared-gateway
      sectionName: aross-studio-wildcard-https
  hostnames:
    - aross.studio
    - www.aross.studio
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
