apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aross-studio
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: aross-studio-https
    - name: shared-gateway
      sectionName: design-aross-studio-https
    - name: shared-gateway
      sectionName: portfolio-aross-studio-https
  hostnames:
    - aross.studio
    - design.aross.studio
    - portfolio.aross.studio
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
