# Both routes (three with a booking host) live in namespace default: the wildcard
# listeners admit only default, and Traefik Middlewares are namespace-local.
# templates/referencegrant.yaml lets them reach the odoo Service. Keep
# `kind: HTTPRoute` at column 0 in this file: scripts/lib/inventory.sh renders a
# chart for CI only when a template has it.
#
# These are ordinary public sites: shared rate limits on every public rule, and
# CrowdSec bans only malicious traffic (John, 2026-11-08). docs/public-edge.md.
#   Rule 1 (LAN and John's tailnet only): the database manager (also disabled by
#     list_db = False) and the external XML-RPC/JSON-RPC APIs.
#   Rule 2 (public, arbitrary bodies): paths that carry every back-office write
#     (HTML fields, website-builder saves), chatter and portal messages, live
#     chat, attachment and photo uploads. AppSec body inspection misreads those
#     and would ban the sender ("Class B, not A, for machine traffic").
#     Prefixes read on Odoo 18.0 in addons/web/controllers/{dataset,action,binary}.py,
#     addons/mail/controllers/{thread,attachment}.py, mail/controllers/discuss/channel.py,
#     im_livechat/controllers/main.py, html_editor/controllers/main.py,
#     web_editor/controllers/main.py and bus/controllers/websocket.py.
#   Rule 3 (public): everything else.
# Traefik ranks longer PathPrefixes above "/", so rules 1 and 2 win over rule 3.
#
# The back office host bans by reputation (crowdsec-bouncer on rules 2 and 3,
# the latter with AppSec too). The booking host does not: it exists to serve
# customers filling in a form, so every rule there uses
# crowdsec-bouncer-appsec-only, which 403s the one request that trips an AppSec
# rule and never consults the ban list, the CAPI blocklist or bans earned on
# other hosts (scripts/validations/booking-never-ban.sh enforces it). That is
# why the booking host gets its own HTTPRoute: Gateway API filters cannot vary
# by hostname within one rule.
# The Odoo hosts are also in the CrowdSec agent's heuristic exemption
# (workloads/crowdsec-agent/agent-booking-hosts.yaml): normal use looks like
# crawling (/web/image thumbnails, /web/dataset calls) and must not ban.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odoo-{{ required "id is required" .Values.id }}
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: {{ required "sectionName is required" .Values.sectionName }}
  hostnames:
    - {{ required "host is required" .Values.host }}
  {{- include "odoo.routeRules" (dict "bouncer" "crowdsec-bouncer" "ns" .Values.namespace) | nindent 2 }}
{{- if .Values.bookingHost }}
---
# The public booking page: no IP bans, ever (see the header).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odoo-{{ .Values.id }}-booking
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: {{ .Values.sectionName }}
  hostnames:
    - {{ .Values.bookingHost }}
  {{- include "odoo.routeRules" (dict "bouncer" "crowdsec-bouncer-appsec-only" "ns" .Values.namespace) | nindent 2 }}
{{- end }}
---
# http:// -> https:// for this host, separate from john2143-http-to-https, which
# is at the Gateway API cap of 16 hostnames per HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odoo-{{ .Values.id }}-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - {{ .Values.host }}
    {{- if .Values.bookingHost }}
    - {{ .Values.bookingHost }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
