# Secret/odoo-admin from OpenBao consumers/data/john2143-com/<namespace>/odoo-admin
# (ODOO_ADMIN_PASSWORD; hex, seeded once by hand). Used only on first init
# (files/company.py); after that the password lives in Odoo. docs/odoo.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-admin
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: odoo-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/{{ .Values.namespace }}/odoo-admin
---
# Secret/tem-smtp from OpenBao consumers/data/john2143-com/stalwart/scaleway-tem-smtp,
# extracted once per consumer namespace like workloads/secrets/*-tem-smtp.yaml.
# Scaleway's SMTP credential mapping is opaque: TEM_USERNAME is the SMTP
# username and API_SECRET_KEY is the SMTP password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tem-smtp
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tem-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/scaleway-tem-smtp
{{- if .Values.oidc }}
---
# Secret/odoo-oidc from OpenBao consumers/data/john2143-com/<namespace>/oidc
# (OIDC_CLIENT_ID, OIDC_CLIENT_SECRET): this company's Pocket ID client
# (callback https://<host>/auth_oauth/signin). files/setup.py writes it into
# Odoo's "Pocket ID" OAuth provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-oidc
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: odoo-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/{{ .Values.namespace }}/oidc
{{- end }}
