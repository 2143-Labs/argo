# This company's Odoo database. CNPG renders Secret odoo-db-app (username,
# password), which odoo.dbEnv reads. docs/adding-a-cnpg-database.md.
# Offsite backups: offsite-backup.yaml (Barman Cloud plugin -> Backblaze B2, docs/db-backups.md).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: odoo-db
  namespace: {{ required "namespace is required" .Values.namespace }}
  annotations:
    # Company books: an Argo prune must never delete them. Remove only by hand.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: {{ .Values.db.instances }}
  # Promote a replica before touching the primary; `restart` deletes it in place
  # and forces a Longhorn detach/attach.
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    # Required: the copies must never share a node, or the second copy is no
    # protection at all.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      # Kept off: arch (its Longhorn disk is below the 25% floor and cannot
      # provision a volume), nas (its RAM is reserved for ZFS/NFS and the
      # storage pods that cannot run anywhere else), pite (arm64 and tiny),
      # office (wifi taint; the validating policy denies storage-backed pods).
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [arch, nas, pite, office]
      # Preferred only: a required rule would stop the operator from recreating
      # a lost instance on the remaining node.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [big, closet]
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: {{ .Values.db.size }}
    storageClass: longhorn-cnpg
  walStorage:
    size: {{ .Values.db.walSize }}
    storageClass: longhorn-cnpg
  bootstrap:
    initdb:
      database: odoo
      owner: odoo
      # Odoo builds trigram search indexes only when pg_trgm exists
      # (odoo/modules/registry.py:202).
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
  # Continuous WAL archiving + base backups offsite via ObjectStore odoo-db-offsite
  # (offsite-backup.yaml). docs/db-backups.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: odoo-db-offsite
