# Per-instance values come from helm.parameters in apps/odoo-*.yaml.
# Comma-bearing values must live here, never in apps/: Argo and the CI inventory
# pass helm.parameters as --set, which splits on commas.
namespace: ""      # odoo-aross | odoo-labs
id: ""             # route names odoo-<id>, odoo-<id>-http-to-https (namespace default)
host: ""           # public hostname; also Odoo's web.base.url
sectionName: ""    # shared-gateway listener whose wildcard certificate covers host
mailFrom: ""       # sender; must be @m.2143.me, the only TEM-verified domain
companyName: ""    # written on first init only; edit later in Odoo
companyState: ""   # US state code of the company, first init only
filestoreSize: ""  # odoo-filestore PVC size
oidc: false        # true once OpenBao john2143-com/<namespace>/oidc exists (docs/odoo.md)

# Built by .github/workflows/odoo-image.yml from workloads/odoo/image.
image: ghcr.io/2143-labs/odoo:sha-8c303da25fbcc771dbe6d617684689a8013d0d95
db:
  instances: 2
  size: 10Gi
  walSize: 4Gi
# Installed with -i on every init (already-installed modules are skipped); Odoo
