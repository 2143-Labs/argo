apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: steam-lobby
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: pvp-john2143-https
  hostnames:
    - pvp.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: steam-lobby
          namespace: steam-lobby
          port: 80
