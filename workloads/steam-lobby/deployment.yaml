apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-lobby
  namespace: steam-lobby
  labels:
    app: steam-lobby
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: steam-lobby
  template:
    metadata:
      labels:
        app: steam-lobby
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
      - name: steam-lobby
        image: ghcr.io/2143-labs/steam-lobby:0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: &port 8080
        envFrom:
        - secretRef:
            name: steam-lobby-secret
        env:
        - name: LOBBY_TURN_SECRET
          valueFrom:
            secretKeyRef:
              name: steam-lobby-turn
              key: turn_secret
        - name: STEAM_APP_ID
          value: "480"
        - name: AUTH_DEV_MODE
          value: "false"
        - name: PUBLIC_URL
          value: "https://pvp.john2143.com"
        - name: CORS_ORIGINS
          value: "https://pvp.john2143.com"
        - name: JWT_TTL_S
          value: "86400"
        - name: LOBBY_HOST
          value: "0.0.0.0"
        - name: LOBBY_PORT
          value: "8080"
        - name: RUST_LOG
          value: "info,lobby_server=debug"
        - name: GAME_MODES
          value: "ranked_1v1:p2p"
        resources:
          requests:
            memory: "128Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: *port
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: *port
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
