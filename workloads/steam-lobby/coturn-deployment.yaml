apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: steam-lobby
  labels:
    app: coturn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
      annotations:
        # coturn reads turnserver.conf once at startup, so a ConfigMap edit is
        # inert without a rollout. Matches workloads/steam-lobby/deployment.yaml.
        reloader.stakater.com/auto: "true"
    spec:
      # coturn resolves external-ip at startup and silently drops the option if
      # the lookup fails — which is what happened: kube-dns hands out both
      # ClusterIPs, and the IPv6 one (fd42:42:43::a) never answers, so musl's
      # resolver returns EAI_AGAIN. dnsPolicy: None drops both of kube-dns's
      # addresses, so the ClusterFirst search domains/ndots are restated here.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.10
        searches:
          - steam-lobby.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      initContainers:
        - name: render-auth
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/coturn/turnserver.conf.base /cfg/turnserver.conf
              printf 'static-auth-secret=%s\n' "$(cat /etc/coturn/secrets/turn_secret)" >> /cfg/turnserver.conf
          volumeMounts:
            - name: config
              mountPath: /etc/coturn/turnserver.conf.base
              subPath: turnserver.conf
            - name: turn-secret
              mountPath: /etc/coturn/secrets
            - name: cfg
              mountPath: /cfg
      containers:
        - name: coturn
          image: coturn/coturn:4.18.0-alpine3.24
          args: ["-c", "/etc/coturn/turnserver.conf"]
          ports:
            - name: stun-turn
              containerPort: 3478
              protocol: UDP
            - name: stun-turn-tcp
              containerPort: 3478
              protocol: TCP
          volumeMounts:
            - name: cfg
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: coturn
        - name: turn-secret
          secret:
            secretName: steam-lobby-turn
        - name: cfg
          emptyDir: {}
