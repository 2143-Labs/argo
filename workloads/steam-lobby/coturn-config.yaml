apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn
  namespace: steam-lobby
data:
  turnserver.conf: |
    listening-port=3478
    realm=turns-steam-lobby.john2143.com
    use-auth-secret
    # static-auth-secret is injected by the render-auth init container from the
    # mounted steam-lobby-turn Secret (static-auth-secret takes a literal value,
    # Literal IP, not a hostname: the pod's resolver hangs on the IPv6
    # nameserver (fd42:42:43::a) and coturn aborted with
    # "error resolving 'turn.john2143.com' hostname: Try again" ->
    # "-X : Wrong address format", leaving external-ip unset entirely.
    # WAN IP is DHCP from the ISP; if it changes, update this and the DNS A record.
    external-ip=108.56.153.222
    no-multicast-peers
    min-port=45000
    max-port=45063
    verbose
