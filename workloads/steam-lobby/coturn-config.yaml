apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn
  namespace: steam-lobby
data:
  turnserver.conf: |
    listening-port=3478
    realm=turns-steam-lobby.john2143.com
    use-auth-secret
    # static-auth-secret is injected by the render-auth init container from the
    # mounted steam-lobby-turn Secret (static-auth-secret takes a literal value,
    # external-ip tracks the DNS record, never a literal: the WAN IP is DHCP,
    # and turn.john2143.com is a CNAME to john2143.com, which home-pi refreshes
    # with the current public IP (dotfiles/nixos/cluster/hosts/home-pi.nix).
    # coturn resolves this ONCE at startup; on failure it logs "-X : Wrong
    # address format" and silently drops the option (mainrelay.c), leaving it
    # advertising the pod address. Hence the resolver pin in coturn-deployment.yaml.
    external-ip=turn.john2143.com
    no-multicast-peers
    min-port=45000
    max-port=45063
    verbose
