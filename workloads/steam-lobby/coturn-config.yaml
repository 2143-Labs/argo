apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn
  namespace: steam-lobby
data:
  turnserver.conf: |
    listening-port=3478
    realm=turns-steam-lobby.john2143.com
    use-auth-secret
    # static-auth-secret is injected by the render-auth init container from the
    # mounted steam-lobby-turn Secret (static-auth-secret takes a literal value,
    external-ip=turn.john2143.com
    no-cli
    no-multicast-peers
    min-port=45000
    max-port=45063
    verbose
