apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn
  namespace: steam-lobby
data:
  turnserver.conf: |
    listening-port=3478
    realm=turns-steam-lobby.john2143.com
    use-auth-secret
    # static-auth-secret is injected by the render-auth init container from the
    # mounted steam-lobby-turn Secret (static-auth-secret takes a literal value,
    # external-ip tracks the DNS record, never a literal: the WAN IP is DHCP,
    # and turn.john2143.com is a CNAME to john2143.com, which home-pi refreshes
    # with the current public IP (dotfiles/nixos/cluster/hosts/home-pi.nix).
    # coturn resolves this ONCE at startup; on failure it logs "-X : Wrong
    # address format" and silently drops the option (mainrelay.c), leaving it
    # advertising the pod address. Hence the resolver pin in coturn-deployment.yaml.
    external-ip=turn.john2143.com
    no-multicast-peers
    # Public relay for Odoo bookings (and Matrix). coturn blocks loopback itself but
    # not these, so without them the credential served to anonymous booking guests
    # is a pivot into the LAN, the pod/service CIDRs and link-local metadata.
    denied-peer-ip=0.0.0.0-0.255.255.255
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=100.64.0.0-100.127.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.0.0.0-192.0.0.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=198.18.0.0-198.19.255.255
    denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    user-quota=12
    total-quota=240
    min-port=45000
    max-port=45063
    verbose
