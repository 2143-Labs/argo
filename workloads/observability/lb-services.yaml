apiVersion: v1
kind: Service
metadata:
  name: mimir-lb
  namespace: observability
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.23"
spec:
  type: LoadBalancer
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30674
---
apiVersion: v1
kind: Service
metadata:
  name: loki-push-lb
  namespace: observability
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.24"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 8080
      nodePort: 30108
