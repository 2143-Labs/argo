# Longhorn per-volume state, health, latency and capacity. One target per
# longhorn-manager pod, so every volume's owner reports it. No alerts: the
# dashboard is the deliverable. Provisioned by the Grafana sidecar's dashboard
# folder (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  longhorn.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 1,
          "title": "Managers reporting (5 expected)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "count(up{job=\"longhorn\"} == 1)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "description": "One target per longhorn-manager pod. Below 5 means a node's volumes, replicas and disks are missing."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 2,
          "title": "Attached volumes",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "count(longhorn_volume_state{state=\"attached\"} == 1)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 3,
          "title": "Volumes by robustness",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "count by (state) (longhorn_volume_robustness == 1)",
              "refId": "A",
              "legendFormat": "{{state}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "description": "Detached volumes report state=\"unknown\"; healthy, degraded and faulted are the states that matter."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 4,
          "title": "Degraded or faulted volumes",
          "type": "table",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (pvc_namespace, pvc, volume, node, state) (longhorn_volume_robustness{state=~\"degraded|faulted\"} == 1)",
              "refId": "A",
              "instant": true,
              "format": "table",
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 5,
          "title": "Volume attached, by node",
          "description": "One row per volume; green while the volume is attached. Gaps are detached periods.",
          "type": "state-timeline",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (pvc_namespace, pvc, node) (longhorn_volume_state{state=\"attached\", pvc_namespace=~\"$ns\", pvc=~\"$pvc\"}) == 1",
              "refId": "A",
              "legendFormat": "{{pvc_namespace}}/{{pvc}} @ {{node}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "attached",
                      "color": "green"
                    }
                  }
                }
              ],
              "custom": {
                "fillOpacity": 70,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "rowHeight": 0.9,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 6,
          "title": "Pods on attached Longhorn volumes",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (pvc_namespace, pvc, pod) (label_replace(label_replace(kube_pod_spec_volumes_persistentvolumeclaims_info, \"pvc_namespace\", \"$1\", \"namespace\", \"(.+)\"), \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.+)\")) * on (pvc_namespace, pvc) group_left (node) max by (pvc_namespace, pvc, node) (longhorn_volume_state{state=\"attached\"} == 1)",
              "refId": "A",
              "instant": true,
              "format": "table",
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "description": "A volume reported by two managers during an ownership hand-over can briefly raise a many-to-many matching error; it clears on the next scrape."
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "id": 7,
          "title": "Attach, detach and rebuild events",
          "description": "Kubernetes events for volumes and PVCs. The timestamp is the event's own time, so this is exact where the 30 s scrape is coarse.",
          "type": "logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "{job=\"kube-events\", cluster=\"home\"} | json | reason=~\"Attached|Detached|DetachedUnexpectedly|SuccessfulAttachVolume|FailedAttachVolume|FailedMount|Rebuilding|Rebuilt|Degraded|Faulted|Healthy\" | line_format \"{{.type}} {{.kind}}/{{.name}} {{.reason}}: {{.msg}}\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 8,
          "title": "Write latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (pvc_namespace, pvc) (longhorn_volume_write_latency{pvc_namespace=~\"$ns\", pvc=~\"$pvc\"})",
              "refId": "A",
              "legendFormat": "{{pvc_namespace}}/{{pvc}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ns",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": true,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
