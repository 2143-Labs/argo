# Games fleet alerts: ROTS and Dino-Dash server telemetry. Same provisioning shape as
# alert-rules.yaml (label grafana_alert: "1"), one contact point away from firing.
#
# Deliberately absent: an "instances == 0" alert. Both charts scale to zero when nobody is
# playing, so zero instances is the healthy state most evenings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: games-alerts
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  games-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: games
        folder: Alerts
        interval: 1m
        rules:
          # The tick *interval* is not the tick *cost*: a healthy 60 Hz fixed step already pauses
          # ~16.7 ms between runs, so a latency rule at 20 ms fires forever. What matters is whether
          # the sim still runs 60 ticks a second (`rots_tick_duration_count` counts observations).
          #
          # Only while the loop is busy: `tick_cadence` records nothing when the main loop is idle
          # (nobody connected and no join in flight), so an idle pod's counter is flat and an
          # ungated rule would call a healthy pre-game instance a stalled one. `rots_loop_idle`
          # is that state, exported by the server for exactly this comparison.
          - uid: rots-tick-rate
            title: ROTS tick rate below 55/s
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: rate(rots_tick_duration_count[5m]) and on(instance) (rots_loop_idle == 0)
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 55
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A game server is ticking below 55 Hz
              description: >-
                One instance's tick counter has advanced fewer than 55 times a second for ten
                minutes, against a 60 Hz fixed step. The alert carries the `instance` label; look
                for a `game.frame_overrun` span on it in Tempo.

          # Frames long enough to trip ROTS_FRAME_TRACE_MS. The counter increments once per overrun
          # and is exported per instance, so a rate above 0.5/s is a continuously stalling sim.
          - uid: rots-frame-overruns
            title: ROTS frames over the trace threshold
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: rate(rots_frame_overruns[10m])
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A game server is dropping frames
              description: >-
                More than half a frame per second exceeds ROTS_FRAME_TRACE_MS on one instance for
                ten minutes. Compare its player and entity counts before blaming the host.

          # A join that never reaches a world is a player who cannot play. The denominator is
          # the span metric for game.join, so it counts attempts, not just accepted joins.
          - uid: game-join-failure-rate
            title: Game join failure rate
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: >-
                    sum(rate(rots_join_rejected[10m])) / clamp_min(sum(rate(traces_spanmetrics_calls_total{span_name="game.join", service=~"rots-.*"}[10m])), 0.001)
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.05
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: More than 5% of game joins are being refused
              description: >-
                Over the last ten minutes more than one join in twenty was rejected. The
                reason label on rots_join_rejected_total says which stage refused it: ticket
                means the client's ticket was bad, coordinator means the authserver did not
                answer in time, world_timeout means the instance never built its world.

          # A restart is a lost world for everyone on that instance (managed instances keep
          # their volume, static ones do not). kube-state-metrics is already scraped into
          # Mimir, so this needs no new pipeline.
          - uid: game-server-restarts
            title: Game server restarted
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: >-
                    increase(kube_pod_container_status_restarts_total{namespace="rots-prod", container="rots-gameserver"}[15m])
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: A ROTS game server container restarted
              description: >-
                kube_pod_container_status_restarts_total for namespace rots-prod increased in the
                last 15 minutes. Check the previous container's exit code and the logs in Loki
                (namespace rots-prod) before assuming it was a rollout.
