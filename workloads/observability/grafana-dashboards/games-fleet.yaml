# The games fleet: ROTS and Dino-Dash server telemetry (traces via Tempo span metrics,
# metrics straight from the OTel SDKs over OTLP/HTTP -> Alloy -> Mimir). Provisioned by the
# Grafana sidecar's dashboard folder (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: games-fleet-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  games-fleet.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 1,
          "title": "ROTS players online",
          "description": "Sum of the rots.players gauge across every reporting instance.",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(rots_players)",
              "legendFormat": "ROTS players online",
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 2,
          "title": "ROTS instances reporting",
          "description": "Instances whose gauge reached Mimir in the last export interval. A drop here with players still online is an exporter problem, not a game problem.",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "count(count by (service_instance_id) (rots_players))",
              "legendFormat": "ROTS instances reporting",
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 3,
          "title": "Dino players online",
          "description": "Sum of the Dino server's player gauge.",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(dino_players)",
              "legendFormat": "Dino players online",
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 4,
          "title": "Tick duration p95",
          "description": "Wall-clock cadence of the fixed tick, not the simulation's own timer. ROTS budgets 16.6 ms (60 Hz), Dino 50 ms (20 Hz).",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(rots_tick_duration_bucket[5m])))",
              "legendFormat": "{{service_name}} p95",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(dino_tick_duration_bucket[5m])))",
              "legendFormat": "dino p95",
              "range": true,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 5,
          "title": "Frame overruns per second",
          "description": "Frames slower than ROTS_FRAME_TRACE_MS / PRIMAL_FRAME_TRACE_MS. Each overrun also emits a game.frame_overrun span in Tempo.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (service_name) (rate(rots_frame_overruns_total[5m]))",
              "legendFormat": "{{service_name}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(rate(dino_frame_overruns_total[5m]))",
              "legendFormat": "dino",
              "range": true,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 6,
          "title": "Joins per second",
          "description": "Tempo span metrics for the game.join span, so this counts joins including the rejected ones, per service.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_name=\"game.join\"}[5m]))",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 7,
          "title": "Join rejects by reason",
          "description": "App counters. Reasons are a fixed small set on purpose (ticket, duplicate, coordinator, world_timeout, version, full, malformed, rate_limit, other).",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (service_name, reason) (rate(rots_join_rejected_total[5m]))",
              "legendFormat": "{{service_name}} {{reason}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (reason) (rate(dino_join_rejected_total[5m]))",
              "legendFormat": "dino {{reason}}",
              "range": true,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 8,
          "title": "Provision latency p95",
          "description": "Time from the authserver's provision activity to a created StatefulSet; the slow part of a /play that has to start an instance.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{span_name=\"k8s.provision\"}[10m])))",
              "legendFormat": "k8s.provision p95",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 9,
          "title": "Dino world",
          "description": "Population gauges. A dormant-heavy world means the director is asleep or the active cap was hit.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(dino_fauna{dino_active=\"true\"})",
              "legendFormat": "fauna active",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(dino_fauna{dino_active=\"false\"})",
              "legendFormat": "fauna dormant",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum(dino_npcs)",
              "legendFormat": "artificial players",
              "range": true,
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "games"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Games fleet",
      "uid": "games-fleet",
      "version": 1
    }
