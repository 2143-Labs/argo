apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-mail-alerts
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  stalwart-mail-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: stalwart-mail
        folder: Alerts
        interval: 1m
        rules:
          # A restart of the mail server is a mail outage: replicaCount is 1 and the
          # deployment uses strategy Recreate. kube-state-metrics is already scraped
          # into Mimir by Alloy, so this needs no new pipeline.
          - uid: stalwart-pod-restarts
            title: Stalwart restarted
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: increase(kube_pod_container_status_restarts_total{namespace="stalwart"}[15m])
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: Stalwart restarted
              description: >-
                kube_pod_container_status_restarts_total for namespace stalwart increased in the
                last 15 minutes. At replicaCount 1 with strategy Recreate that is a mail outage.
                Check the previous container state and events before assuming it was benign.

          # The signal that went unnoticed for months: Stalwart logs security.ip-blocked
          # every time it refuses a connection from a banned address. Alloy ships all pod
          # stdout to Loki, so this is the same counter a human would grep for, watched
          # continuously. Historically the blocked addresses were the cluster's own pod
          # IPs, so a single event is worth looking at rather than waiting for volume.
          - uid: stalwart-ip-blocked
            title: Stalwart blocked an address
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki
                model:
                  editorMode: code
                  expr: sum(count_over_time({namespace="stalwart"} |= "security.ip-blocked" [15m]))
                  queryType: range
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: Stalwart is blocking addresses again
              description: >-
                security.ip-blocked events appeared in the stalwart namespace in the last 15
                minutes. Read x:BlockedIp/get and x:AllowedIp/get: a permanent record covering a
                cluster address is the failure that crashlooped this server before.
