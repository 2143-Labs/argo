apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-mail-alerts
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  stalwart-mail-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: stalwart-mail
        folder: Alerts
        interval: 1m
        rules:
          # A restart of the mail server is a mail outage: replicaCount is 1 and the
          # deployment uses strategy Recreate. kube-state-metrics is already scraped
          # into Mimir by Alloy, so this needs no new pipeline.
          - uid: stalwart-pod-restarts
            title: Stalwart restarted
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: mimir
                model:
                  editorMode: code
                  expr: increase(kube_pod_container_status_restarts_total{cluster="", namespace="stalwart"}[15m])
                  instant: true
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: Stalwart restarted
              description: >-
                kube_pod_container_status_restarts_total for namespace stalwart increased in the
                last 15 minutes. At replicaCount 1 with strategy Recreate that is a mail outage.
                Check the previous container state and events before assuming it was benign.

          # Stalwart auto-bans any client that sends an invalid SMTP command
          # (security.scan-ban), then logs security.ip-blocked for every retry from that
          # address. Internet scanners reach 25/587 daily, so the unfiltered counter is
          # background noise: 37 distinct addresses in the 30 days to 2026-11-17, one
          # notification batch each, for connections the server had already refused.
          # The event worth waking up for is the block list covering one of our own
          # addresses -- the failure that crashlooped this server before -- so only
          # private sources (RFC1918 and IPv6 ULA/link-local) are counted here. Those are
          # pods 10.42/16 + fd42:42:42::/48, services 10.43/16 + fd00:6::/64 and the LAN
          # 192.168.5-7/24 + fd00:1::/64, plus anything else internal that appears later.
          - uid: stalwart-ip-blocked
            title: Stalwart blocked an internal address
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki
                model:
                  editorMode: code
                  expr: sum(count_over_time({cluster="home", namespace="stalwart"} |= "security.ip-blocked" |~ "remoteIp = (10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|f[cd][0-9a-f][0-9a-f]:|fe80:)" [15m]))
                  queryType: range
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 60000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: Stalwart blocked one of our own addresses
              description: >-
                security.ip-blocked events for a private address -- RFC1918 or IPv6 ULA,
                which covers pod, service, node and LAN sources -- appeared in the stalwart
                namespace in the last 15 minutes. Read x:BlockedIp/get and x:AllowedIp/get:
                a permanent record covering a cluster address is the failure that
                crashlooped this server before. Blocked internet scanners are expected and
                are not counted by this rule.
