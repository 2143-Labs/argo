# LiteLLM proxy: token throughput, provider prompt-cache hit ratio, spend and
# DeepSeek account balances. No alerts here - see litellm-alerts.yaml.
# Provisioned by the Grafana sidecar's dashboard folder (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  litellm.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 1,
          "title": "Replicas scraped",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "count(up{job=\"litellm\"} == 1)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 2,
          "title": "DeepSeek balance",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 9,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (account) (deepseek_balance_usd)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 3,
          "title": "Days of runway (home keys)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 15,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "max by (account) (deepseek_balance_usd{account=~\"home-key1|home-key2\"}) / ((sum by (account) (label_replace(rate(litellm_spend_metric_total{model_id=~\"deepseek-home-key.*\"}[6h]), \"account\", \"$1\", \"model_id\", \"deepseek-(.*)\")) * 86400) > 0)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 4,
          "title": "Balance poll age",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "time() - max by (account) (deepseek_balance_last_success_timestamp_seconds)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 900
                  },
                  {
                    "color": "red",
                    "value": 1800
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 5,
          "title": "Input tokens/s by deployment",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (model_id) (rate(litellm_input_tokens_metric_total[5m]))",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 6,
          "title": "Provider prefix-cache hit ratio",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (model_id) (rate(litellm_provider_cache_read_input_tokens_metric_total[5m])) / clamp_min(sum by (model_id) (rate(litellm_input_tokens_metric_total[5m])), 1e-9)",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 7,
          "title": "Output tokens/s by deployment",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (model_id) (rate(litellm_output_tokens_metric_total[5m]))",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "id": 8,
          "title": "Spend USD/hour by deployment",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "editorMode": "code",
              "expr": "sum by (model_id) (rate(litellm_spend_metric_total[6h])) * 3600",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "litellm"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "LiteLLM proxy",
      "uid": "litellm",
      "version": 1
    }
