apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
spec:
  serviceName: mimir-headless
  replicas: 3
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          # Relative data dirs (./tsdb WAL+head, ./tsdb-sync, ./data-compactor, ...) resolve
          # against cwd; the image's cwd is "/" (ephemeral). Put them on the PVC.
          workingDir: /data
          args:
            - "-target=all,alertmanager"
            - "-config.file=/etc/mimir/mimir.yaml"
            - "-config.expand-env=true"
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9095
              name: grpc
            - containerPort: 7946
              name: memberlist
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: storage
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: mimir-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["big", "closet", "office"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mimir
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: false
    target: all
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: warn
    common:
      storage:
        backend: s3
        s3:
          endpoint: seaweedfs-s3.default.svc:8333
          access_key_id: "${S3_ACCESS_KEY}"
          secret_access_key: "${S3_SECRET_KEY}"
          insecure: true
    blocks_storage:
      s3:
        bucket_name: mimir-blocks
      # Write idle series to a block as soon as an ingester holds 200k in memory
      # (limit is 250k per ingester: 750k per user / 3 ingesters). Without this,
      # series that stopped receiving samples count against the limit until the
      # next 2 h block boundary; on 2026-10-28 that caused hours of rejections.
      tsdb:
        early_head_compaction_min_in_memory_series: 200000
    ruler_storage:
      s3:
        bucket_name: mimir-rules
    alertmanager_storage:
      s3:
        bucket_name: mimir-alertmanager
    ruler:
      alertmanager_url: http://127.0.0.1:8080/alertmanager
      rule_path: /data/rules
    ingester:
      ring:
        replication_factor: 1
    limits:
      max_global_series_per_user: 750000
      compactor_blocks_retention_period: 720h
      ingestion_rate: 100000
      ingestion_burst_size: 500000
      # Promote the deployment environment to a label. Without it rots-prod, dino-prod and every
      # preview namespace write identical series and overwrite each other.
      promote_otel_resource_attributes: deployment.environment.name
      # Keep the OTLP identifying resource attributes (`service.name`, `service.instance.id`,
      # `service.namespace`) on target_info as well as converting them to `job`/`instance`. The
      # `instance` label is what makes per-replica series distinct: the gameserver sends
      # `service.instance.id` (Tempo shows `service.instance.id=rots-gs-875-g120-0` on its span
      # resource), and without it every replica writes one series per metric.
      otel_keep_identifying_resource_attributes: true
    memberlist:
      bind_port: 7946
      join_members:
        - dns+mimir-memberlist.observability.svc.cluster.local:7946
      abort_if_cluster_join_fails: false
      # Re-resolve join_members periodically. Without this, a pod whose startup
      # join only reaches itself stays in its own ring forever (split-brain).
      rejoin_interval: 1m
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9095
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-memberlist
  namespace: observability
spec:
  clusterIP: None
  selector:
    app: mimir
  ports:
    - name: memberlist
      port: 7946
