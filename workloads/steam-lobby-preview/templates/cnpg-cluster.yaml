apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.clusterName }}
  namespace: {{ .Values.namespace }}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: {{ .Values.db.size }}
    storageClass: {{ .Values.db.storageClass }}
  walStorage:
    size: {{ .Values.db.walSize }}
  bootstrap:
    initdb:
      database: {{ .Values.db.name }}
      owner: lobby
