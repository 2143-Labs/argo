apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.clusterName }}
  namespace: {{ .Values.namespace }}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: {{ .Values.db.size }}
    storageClass: {{ .Values.db.storageClass }}
  walStorage:
    size: {{ .Values.db.walSize }}
    # Explicit class — the default (local-path) provisioner half-failed during
    # a node outage and left a PV with no hostPath, blocking the WAL mount
    # (FailedMount) and crash-looping the DB. Longhorn is the reliable class.
    storageClass: longhorn
  bootstrap:
    initdb:
      database: {{ .Values.db.name }}
      owner: lobby
