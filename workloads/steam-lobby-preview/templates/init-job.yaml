apiVersion: batch/v1
kind: Job
metadata:
  name: steam-lobby-secret-init
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: steam-lobby-secret-init
      # The preview's Temporal namespace (pvp-preview) must exist before the
      # worker connects — Temporal clients can't self-register, and a missing
      # namespace silently degrades the app to in-process only (queueing
      # breaks). Ensure it idempotently; also self-heals a rebuilt Temporal
      # (the namespace was lost once during the DB recovery).
      initContainers:
        - name: ensure-temporal-namespace
          image: docker.io/temporalio/admin-tools:1.31.1
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal-frontend.default.svc:7233" }
            - { name: TEMPORAL_CLI_ADDRESS, value: "temporal-frontend.default.svc:7233" }
          command: ["/bin/sh", "-c"]
          args:
            - |-
              set -e
              if ! temporal operator namespace describe "{{ .Values.temporal.namespace }}" >/dev/null 2>&1; then
                echo "registering namespace {{ .Values.temporal.namespace }}"
                temporal operator namespace create "{{ .Values.temporal.namespace }}" --retention 72h
              else
                echo "namespace {{ .Values.temporal.namespace }} already exists"
              fi
      containers:
        - name: init
          image: docker.io/alpine/k8s:1.35.6   # kubectl client matching the k3s cluster version; alpine base → /bin/sh
          env:
            - { name: CLUSTER, value: "{{ .Values.db.clusterName }}" }
            - { name: NAMESPACE, value: "{{ .Values.namespace }}" }
          command:
            - /bin/sh
            - -c
            - |-
              set -e
              for i in $(seq 1 60); do
                if kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              if ! kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "CNPG app secret never appeared" >&2
                exit 1   # backoffLimit retries the whole job
              fi
              DATABASE_URL=$(kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" -o jsonpath='{.data.fqdn-uri}' | base64 -d)
              if [ -z "$DATABASE_URL" ]; then   # operator version without fqdn-uri: compose from the parts
                USER=$(kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" -o jsonpath='{.data.username}' | base64 -d)
                PW=$(kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)
                DB=$(kubectl get secret "$CLUSTER-app" -n "$NAMESPACE" -o jsonpath='{.data.database}' | base64 -d)
                DATABASE_URL="postgres://${USER}:${PW}@${CLUSTER}-rw.${NAMESPACE}.svc:5432/${DB}"
              fi
              JWT_SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')   # 64-hex dev token; no openssl in alpine/k8s
              kubectl create secret generic steam-lobby-secret -n "$NAMESPACE" \
                --from-literal=DATABASE_URL="${DATABASE_URL}" \
                --from-literal=JWT_SECRET="${JWT_SECRET}" \
                --dry-run=client -o yaml | kubectl apply -f -
