apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "pvp-%s" (last (splitList "-" .Values.namespace)) }}   # e.g. pvp-123 — unique per PR in the shared default ns
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-https
  hostnames:
    - {{ .Values.ingress.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: steam-lobby
          namespace: {{ .Values.namespace }}
          port: 80
