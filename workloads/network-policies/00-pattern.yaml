# East-west NetworkPolicy pattern for the home k3s cluster.
#
# This file is documentation only (a ConfigMap). It is not a policy. Read it
# before adding a namespace file, because every namespace file is a hand-audited
# statement about who talks to whom.
#
# Background: before this app the only NetworkPolicies in the cluster were the
# seven shipped by the ArgoCD install and one on openbao. Every other namespace
# was default-allow in both directions. NetworkPolicy *is* enforced here: the k3s
# built-in controller (kube-router derived) installs KUBE-NWPLCY-* /
# KUBE-POD-FW-* iptables chains keyed on pod IPs. Four consequences shape the
# template and were verified against live state on 2026-09-18:
#
#   1. hostNetwork pods are keyed on the node IP, which the controller never
#      lists as a pod IP, so they are effectively exempt (no node IP appears as
#      a source in any KUBE-POD-FW chain).
#   2. kube-router adds a "source is the pod's local node" accept to every
#      pod it polices, so kubelet probes and same-node traffic need no rule.
#   3. Policy *ports* are the destination pod's container ports, not the Service
#      ports: grafana's Service publishes 80 while the container listens on 3000.
#   4. The important one: anything that reaches a pod through kube-proxy is
#      masqueraded, and the masquerade address is the pod network gateway, NOT
#      a LAN address. Per node, flannel.1 carries cross-node traffic
#      (10.42.<n>.0/32) and cni0 carries same-node traffic (10.42.<n>.1/32).
#      Verified by conntrack on the destination node: a connection from the
#      office node to a pod on closet arrives as src=10.42.1.0, office's
#      flannel.1 address.
#
#      This covers LoadBalancer IPs, NodePorts, and control-plane processes
#      dialing a Service (the apiserver reaching keda's aggregated metrics API,
#      for example). Do NOT write a 192.168.5.0/24 ingress rule expecting it to
#      carry LoadBalancer traffic - an earlier revision of this pattern did, and
#      it silently denied mimir-lb and loki-push-lb while looking correct.
#
#      Two further consequences are worth stating plainly:
#        * The masquerade is applied to the LoadBalancer path
#          (KUBE-EXT-* -> KUBE-MARK-MASQ) without regard for the client, so a
#          pod that reaches a VIP is anonymised exactly like an internet client.
#          Allowing the node gateways therefore allows anything that can reach
#          the VIP. Only the ports you actually list are exposed that way.
#        * A Service with externalTrafficPolicy: Local is the exception - it
#          preserves the real client address, so it needs explicit source rules
#          (a world rule for stalwart's mail ports, for example) and gets no
#          benefit from the gateway list.
#
# ---------------------------------------------------------------------------
# Per-namespace template
# ---------------------------------------------------------------------------
#
# Every covered namespace gets three objects in one file, in one sync wave, so
# that a namespace is never half-policed:
#
#   default-deny-ingress : podSelector {} + policyTypes [Ingress]
#   allow-ingress        : the common sources below plus that namespace's own
#                          Traefik ports
#   egress-baseline      : the B1 egress tier below
#
# Common ingress sources:
#   1. The cluster SNAT gateways, one ipBlock per node for both addresses
#      (10.42.<n>.0/32 and 10.42.<n>.1/32). Currently 0=closet 1=office 2=pite
#      3=nas 4=big 6=arch.
#      MAINTENANCE: this list must be regenerated when the node set changes, or
#      LB/NodePort access to the covered namespaces breaks silently with a
#      "connection refused" from the node that used to be listed:
#        kubectl get nodes -o json | jq -r '.items[].spec.podCIDR'
#      and turn each 10.42.<n>.0/24 into 10.42.<n>.0/32 plus 10.42.<n>.1/32.
#   2. podSelector {} - same namespace.
#   3. namespaceSelector kube-system + podSelector traefik, with that
#      namespace's backend container ports. Traefik is not hostNetwork, so its
#      traffic arrives from its pod and this rule is what keeps HTTP routing up.
#   4. namespaceSelector observability - Alloy scrapes these pods by name.
#   Add anything else only with evidence (a config that points at the namespace,
#   an EndpointSlice consumer, a controller), and keep the port list exact.
#
# Egress (tier B1) is deliberately coarse: it stops a compromised workload from
# reaching arbitrary LAN hosts, which is the realistic lateral-movement path,
# without enumerating every external provider. It is NOT per-service isolation.
#   1. kube-system :53 UDP/TCP   - DNS
#   2. podSelector {}            - same namespace
#   3. 10.42.0.0/16              - pod network. Egress policy is evaluated
#                                  against the post-DNAT destination, so a
#                                  ClusterIP destination actually appears here.
#   4. 10.43.0.0/16              - service CIDR. Belt and braces: a ClusterIP
#                                  destination normally appears post-DNAT as a
#                                  pod IP (rule 3), so this only matters for
#                                  paths evaluated pre-DNAT.
#   5. 192.168.6.0/24            - MetalLB service VIPs.
#   6. 0.0.0.0/0 except RFC1918/ULA - internet, for ACME, S3, OIDC, LLM APIs.
#   7. 192.168.5.0/24 on 6443    - the kube-apiserver's endpoints. REQUIRED in
#                                  every namespace. The `kubernetes` Service is
#                                  a ClusterIP, but egress policy is evaluated
#                                  AFTER kube-proxy DNAT and the apiserver's
#                                  endpoints are control-plane node IPs on
#                                  6443, outside the pod CIDR - so rule 3 and
#                                  rule 4 do not reach it. Denied, every *new*
#                                  API connection is refused while established
#                                  watches keep working, so it presents as a
#                                  random late failure. First symptom seen:
#                                  observability/loki-sc-rules crash-looping
#                                  about `10.43.0.1:443` connection refused.
#   plus, only where proven, narrow extra ipBlocks on a single port. The other
#   one in use is 192.168.5.0/24 on 10250 for Alloy's kubelet/cAdvisor scrape
#   (see observability.yaml). Prefer a port-restricted /24 over enumerating node
#   IPs: it survives a node being added and still keeps the LAN's real services
#   (router API, NAS SMB, SSH) out of reach.
#
# ipBlock rules are IPv4-only and NetworkPolicy is per-family, so an absent
# IPv6 rule is a deny. That is acceptable today because no IPv6 pod traffic
# exists (0 conntrack entries for fd42:42:42::/56 or fd00:6::/64 across the
# cluster) and the selector-based rules above are family-agnostic. If IPv6 pod
# traffic is ever introduced, mirror the ipBlocks: fd42:42:42::/56 pod network,
# fd00:1::/64 node ULA, fd00:6::/64 service VIPs, and per-node gateways
# fd42:42:42:<n>::/64.
#
# ---------------------------------------------------------------------------
# Safety gate (do not skip this)
# ---------------------------------------------------------------------------
#
# Before adding a namespace, account for every source and port by comparing this
# template against live Services, httproutes/tlsroutes, EndpointSlices, pod
# probes and the controller configs that point at the namespace. Any dependency
# you cannot name exactly means: skip the whole namespace, leave it default-allow
# and record the reason. Do not apply default-deny and then improvise allows
# during the sync window.
#
# Namespaces covered so far, in wave order:
#   wave 1: keda, crowdsec, observability
#
# Namespaces deliberately NOT covered, and why:
#   default                      - contains Home Assistant, Mosquitto and
#                                  Matter, which talk to arbitrary LAN IoT
#                                  devices and need mDNS/SSDP multicast egress.
#                                  That dependency set is dynamic and cannot be
#                                  enumerated, so B1 egress cannot be applied
#                                  without breaking device control. Ingress and
#                                  egress ship together by design, so the whole
#                                  namespace is skipped.
#   kube-system                  - hosts Traefik, CoreDNS and metrics-server;
#                                  policy risk outweighs benefit.
#   longhorn-system              - CSI/instance-manager chatter and host mounts.
#   metallb-system, cnpg-system  - hostNetwork controllers that also serve other
#                                  namespaces' pods.
#   argocd                       - already covered by the upstream install.
#   flux-system, authentik, vpn-endpoints, reloader, kube-node-lease,
#   kube-public                  - out of scope for this effort.
#
# Also note: this pattern does NOT stop pod-to-pod traffic inside a covered
# namespace, and reachability to an uncovered namespace stays default-allow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-policies-pattern
  namespace: default
data:
  README.md: |
    See the comments in workloads/network-policies/00-pattern.yaml in the argo
    repository. This ConfigMap exists so the pattern is discoverable from the
    cluster; the repository file is authoritative.
