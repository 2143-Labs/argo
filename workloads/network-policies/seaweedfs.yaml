# SeaweedFS (namespace default): apps reach only the S3 API.
#
# Exception to 00-pattern.yaml, which leaves `default` unpoliced: these are
# pod-scoped, ingress-only policies on the SeaweedFS filer, master and volume
# pods. Every other pod in default, and all egress, stays default-allow.
#
# Who may reach what (measured 2026-11-02 with netstat inside each pod):
#   filer  8333       S3 API (SigV4). Apps: every default pod, the
#                     observability namespace (mimir/tempo/loki), Traefik
#                     (files.john2143.com, lan-only), and LAN/WireGuard
#                     clients through the seaweedfs-s3-lan LoadBalancer.
#   filer  8888       filer HTTP + web UI, NO authentication. Only the
#                     oauth2-proxy-seaweedfs-lan pod (files-ui.ts.2143.me; the
#                     LAN host, Pocket ID group `admin`). There is no public
#                     UI host by design.
#   filer  18888 (filer gRPC), 18333 (S3 gRPC), 9101, 8181: components only.
#   master 9333/19333 unauthenticated admin API: components only.
#   volume 8080/18080 chunk data + gRPC (vacuum, BatchDelete): components only.
# "Components" = app in (seaweedfs-filer, seaweedfs-master, seaweedfs-volume,
# seaweedfs-lifecycle) on all ports. Their traffic is bursty (deletes, vacuum,
# lifecycle jobs) and not all of it shows in one snapshot; e.g. filer ->
# volume:18080 gRPC carries chunk deletes.
#
# Kubelet probes need no rule: kube-router accepts sources local to the pod's
# node, and probes arrive from the node's cni0 address (10.42.<n>.1). The
# master's 10 s readiness probe is the steady 10.42.0.1 -> 9333 stream on closet.
#
# LB path: seaweedfs-s3-lan uses externalTrafficPolicy Cluster, so LAN and
# WireGuard clients arrive masqueraded to a node gateway (10.42.<n>.0/32
# cross-node, 10.42.<n>.1/32 same-node). MAINTENANCE: regenerate when the node
# set changes:  kubectl get nodes -o json | jq -r '.items[].spec.podCIDR'
# Current: 0=closet 1=office 2=pite 3=nas 4=big 6=arch.
#
# IPv4 only, like every policy in this directory: no IPv6 traffic reaches these
# pods today. If the LB's IPv6 VIP (fd00:6::31) is ever used, add the
# fd42:42:42:<n>::/64 gateways described in 00-pattern.yaml.
#
# A new S3 consumer outside default/observability needs its namespace added to
# the 8333 rules below, or it fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-filer
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: seaweedfs-filer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [seaweedfs-filer, seaweedfs-master, seaweedfs-volume, seaweedfs-lifecycle]
    - from:
        - podSelector: {}
      ports:
        - port: 8333
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8333
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8333
          protocol: TCP
    - from:
        - ipBlock: {cidr: 10.42.0.0/32}
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.3.0/32}
        - ipBlock: {cidr: 10.42.3.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}
        - ipBlock: {cidr: 10.42.4.1/32}
        - ipBlock: {cidr: 10.42.6.0/32}
        - ipBlock: {cidr: 10.42.6.1/32}
      ports:
        - port: 8333
          protocol: TCP
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [oauth2-proxy-seaweedfs-lan]
      ports:
        - port: 8888
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-master
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: seaweedfs-master
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [seaweedfs-filer, seaweedfs-master, seaweedfs-volume, seaweedfs-lifecycle]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-volume
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: seaweedfs-volume
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [seaweedfs-filer, seaweedfs-master, seaweedfs-volume, seaweedfs-lifecycle]
