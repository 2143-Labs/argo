# zot's htpasswd (bcrypt lines for rots4-ci and cluster-pull), from OpenBao
# consumers/data/john2143-com/default/zot-htpasswd. The plaintext passwords live in
# john2143-com/default/zot-rots4-ci and john2143-com/default/zot-cluster-pull.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-htpasswd
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zot-htpasswd
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: john2143-com/default/zot-htpasswd
        property: htpasswd
