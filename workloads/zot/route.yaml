# registry.ts.2143.me: the only way in. CI pushes from the runner VM, kubelet pulls on every
# node, and the rots authserver's digest check all resolve this name through MagicDNS
# (workloads/headscale/configmap.yaml extra_records) to the gateway; lan-only keeps it off the
# internet, zot's htpasswd authenticates every request.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: ts-2143-me-wildcard-https
  hostnames:
    - registry.ts.2143.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: zot
          port: 5000
