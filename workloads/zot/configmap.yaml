apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: default
data:
  # Users are bcrypt lines in Secret zot-htpasswd (OpenBao john2143-com/default/zot-htpasswd):
  #   rots4-ci      push/pull 2143-labs/rots4 (rots4 build_nix.yml, Actions secret REGISTRY_PASSWORD)
  #   cluster-pull  read-only on every repo (imagePullSecrets; OpenBao john2143-com/default/zot-cluster-pull).
  #                 zot applies only the longest matching pattern, so a repo with its own entry
  #                 must list cluster-pull again; "**" covers only repos without one.
  # Retention for 2143-labs/rots4: every *-latest tag; PR tags until 14 days after their last
  # push or pull; the 20 newest <sha7> tags per component. Anything else in that repo (e.g.
  # smoke-* test tags) goes at the next GC. Other repos keep every tag (last policy).
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "retention": {
          "delay": "24h",
          "policies": [
            {
              "repositories": ["2143-labs/rots4"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [
                {"patterns": ["^.+-latest$"]},
                {"patterns": ["^.+-pr-[0-9]+$"], "pushedWithin": "336h", "pulledWithin": "336h"},
                {"patterns": ["^webserver-wasm-[0-9a-f]{7}$"], "mostRecentlyPushedCount": 20},
                {"patterns": ["^gameserver-[0-9a-f]{7}$"], "mostRecentlyPushedCount": 20},
                {"patterns": ["^authserver-[0-9a-f]{7}$"], "mostRecentlyPushedCount": 20}
              ]
            },
            {"repositories": ["**"], "keepTags": [{"patterns": [".*"]}]}
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "realm": "zot",
        "auth": {"htpasswd": {"path": "/etc/zot-auth/htpasswd"}},
        "accessControl": {
          "repositories": {
            "**": {"policies": [{"users": ["cluster-pull"], "actions": ["read"]}]},
            "2143-labs/rots4": {
              "policies": [
                {"users": ["rots4-ci"], "actions": ["read", "create", "update"]},
                {"users": ["cluster-pull"], "actions": ["read"]}
              ]
            }
          }
        }
      },
      "log": {"level": "info"}
    }
