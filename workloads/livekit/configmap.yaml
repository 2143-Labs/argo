# Source: livekit-server/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-server
data:
  config.yaml: |
    key_file: keys.yaml
    keys: {}
    log_level: info
    port: 7880
    redis: {}
    rtc:
      tcp_port: 7881
      udp_port: 50000
      use_external_ip: false
      node_ip: 192.168.6.22
    turn:
      enabled: true
      domain: turn.john2143.com
      tls_port: 5349
      external_tls: false
      cert_file: /etc/livekit/turn/tls.crt
      key_file: /etc/livekit/turn/tls.key
      relay_range_start: 50001
      relay_range_end: 50064
      # The relay's peer is this cluster's own SFU, whose media sockets live on
      # private addresses, and LiveKit denies private peers unless allow-listed.
      # 10.42.0.0/16 = pod CIDR (the SFU's source address), 192.168.6.22/32 = the
      # node_ip it advertises. Without this, TURN allocations succeed but no
      # media is ever relayed.
      allow_restricted_peer_cidrs:
        - 10.42.0.0/16
        - 192.168.6.22/32

