# Routes SNI turn.john2143.com from the public 443 to LiveKit's embedded TURN
# listener. TLS is NOT terminated here — the pod presents its own certificate
# (see certificate.yaml), which is required because LiveKit advertises
# turns:<domain>:443 and speaks TURN/TLS rather than HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: livekit-turn
  namespace: matrix
  # Not in LAN DNS: steam-lobby coturn resolves turn.john2143.com via kube-dns to
  # learn the public WAN IP (external-ip). If it resolved to the gateway, coturn
  # would advertise a LAN address and external TURN would break.
  labels:
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
      sectionName: turn-john2143-passthrough
  hostnames:
    - turn.john2143.com
  rules:
    - backendRefs:
        - name: livekit-server
          port: 5349