apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: asciinema
  namespace: default
  annotations:
    # Wave 2 of 3: the InterceptorRoute (wave 1) must exist before traffic moves to
    # the interceptor, and the ScaledObject (wave 3) must land only after traffic
    # flows through it.
    argocd.argoproj.io/sync-wave: "2"
spec:
  hostnames:
    - terminals.john2143.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: default
      sectionName: john2143-wildcard-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
