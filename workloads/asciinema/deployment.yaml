apiVersion: apps/v1
kind: Deployment
metadata:
  name: asciinema
  namespace: default
  labels:
    app: asciinema
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: asciinema
  template:
    metadata:
      labels:
        app: asciinema
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values: [general]
      containers:
        - name: asciinema
          image: ghcr.io/asciinema/asciinema-server@sha256:0474b2186be46b23f5e16dbd4319727dbb68f27a303705fbe632821bf524b313
          imagePullPolicy: IfNotPresent
          command:
            - /sbin/tini
            - --
            - /bin/sh
            - -c
          args:
            - |-
              set -eu
              key_file=/var/lib/asciinema/secret_key_base
              if [ ! -s "$key_file" ]; then
                umask 077
                head -c 48 /dev/urandom | base64 > "$key_file.tmp"
                mv "$key_file.tmp" "$key_file"
              fi
              export SECRET_KEY_BASE="$(cat "$key_file")"
              exec /opt/app/bin/server
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asciinema-db-app
                  key: fqdn-uri
            - name: URL_HOST
              value: terminals.john2143.com
            - name: URL_SCHEME
              value: https
            - name: UPLOAD_AUTH_REQUIRED
              value: "true"
            - name: ADMIN_PANEL_ON_MAIN_ENDPOINT
              value: "1"
            - name: TZ
              value: America/New_York
            # SES SMTP submission on port 2587, which is SES's STARTTLS port.
            # 25 and 587 are silently dropped by the home gateway, and 465 is
            # implicit TLS - unreachable from here because Swoosh requires
            # `ssl: true` for that and runtime.exs never sets it.
            - name: SMTP_HOST
              value: email-smtp.us-east-1.amazonaws.com
            - name: SMTP_PORT
              value: "2587"
            - name: SMTP_TLS
              value: always
            # runtime.exs only forwards `auth` to Swoosh when SMTP_AUTH is set,
            # and with it unset gen_smtp never offers the credential at all -
            # SES then answers 530 Authentication required, not 535.
            - name: SMTP_AUTH
              value: always
            # SES SMTP credential, shared with the Stalwart relay. Extracted into
            # this namespace separately - a Secret does not cross namespaces.
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ses-smtp
                  key: SES_SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ses-smtp
                  key: SES_SMTP_PASS
            # Sending is authorised by the SES domain identity for the apex
            # `john2143.com`, which covers every subdomain - so this address
            # needs no identity of its own. SES signs d=john2143.com and relaxed
            # DMARC alignment accepts a subdomain From for it.
            - name: MAIL_FROM_ADDRESS
              value: hello@terminals.john2143.com
          volumeMounts:
            - name: data
              mountPath: /var/lib/asciinema
            - name: cache
              mountPath: /var/cache/asciinema
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asciinema-data
        - name: cache
          emptyDir: {}
