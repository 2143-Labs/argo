{{- if .Values.prodOnly }}
# aross files (second Seafile, namespace aross-files) at its interim host until
# files.aross.studio has DNS. Public, class-B edge gate as seafile-route.yaml
# (AppSec off: it false-positives on Seafile uploads). The backend is Anubis,
# never seafile, and there is no failover TraefikService: failover buffers the
# whole request body for replay, which large uploads cannot go through.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arossfiles-john2143
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - arossfiles.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
      backendRefs:
        - name: anubis
          namespace: aross-files
          port: 80
---
# http:// -> https:// for this host. Separate from john2143-http-to-https,
# which is at the Gateway API cap of 16 hostnames per HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arossfiles-john2143-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - arossfiles.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
