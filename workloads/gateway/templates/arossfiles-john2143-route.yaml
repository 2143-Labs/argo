{{- if .Values.prodOnly }}
# arossfiles.john2143.com was the interim host of the aross files Seafile. It
# now only redirects (http and https, any path) to files.aross.studio: a tab
# left open on the old host gets upload URLs on files.aross.studio, and Anubis
# challenges the cross-origin CORS preflight, so uploads from the old host fail.
# No backend. Delete this file once nothing links to the old name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arossfiles-john2143
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - arossfiles.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: files.aross.studio
            statusCode: 301
{{- end }}
