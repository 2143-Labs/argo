{{- if .Values.prodOnly }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ts-2143-me-wildcard
  namespace: default
spec:
  secretName: ts-2143-me-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.ts.2143.me"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: 2143-me-wildcard
  namespace: default
spec:
  secretName: 2143-me-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.2143.me"
    - "2143.me"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: john2143-com-wildcard
  namespace: default
spec:
  secretName: john2143-com-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.john2143.com"
    - "john2143.com"
---
# *.dev.john2143.com — prod terminates TLS for the bigp nonprod cluster and
# re-encrypts to it (dev-route.yaml). One label only: a.dev.john2143.com.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-dev-john2143-com
  namespace: default
spec:
  secretName: wildcard-dev-john2143-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.dev.john2143.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aross-studio-tls
  namespace: default
spec:
  secretName: aross-studio-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - aross.studio
---
# files.aross.studio: aross files Seafile. HTTP-01, not DNS-01: aross.studio is
# not in letsencrypt-prod's dnsZones (its DNS lives in another deSEC account),
# and the name is a CNAME to john2143.com, which reaches our edge.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: files-aross-studio-tls
  namespace: default
spec:
  secretName: files-aross-studio-tls
  issuerRef:
    name: letsencrypt-http01
    kind: ClusterIssuer
  dnsNames:
    - files.aross.studio
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mm-b-hero-rehab-tls
  namespace: default
spec:
  secretName: mm-b-hero-rehab-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - mm.b.hero.rehab
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mm-timestone-tls
  namespace: default
spec:
  secretName: mm-timestone-tls
  issuerRef:
    name: letsencrypt-http01
    kind: ClusterIssuer
  dnsNames:
    - mm.timestone.2143.me
    - mm.timestone.john2143.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: balabusta-homes-tls
  namespace: default
spec:
  secretName: balabusta-homes-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - balabusta.homes
    - www.balabusta.homes
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chess-dsstar-us-tls
  namespace: default
spec:
  secretName: chess-dsstar-us-tls
  issuerRef:
    name: letsencrypt-http01
    kind: ClusterIssuer
  dnsNames:
    - chess.dsstar.us
---
# *.dsstar.us (Moss & Wool: moss, moss-dev, moss-<PR>). DNS-01 through deSEC;
# dsstar.us is in letsencrypt-prod's dnsZones. chess.dsstar.us keeps its own cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dsstar-us-wildcard
  namespace: default
spec:
  secretName: dsstar-us-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.dsstar.us"
---
# *.poe.sale (how.poe.sale). DNS-01 through deSEC; poe.sale is in
# letsencrypt-prod's dnsZones. The apex poe.sale is not ours to serve (its A
# record points at an external redirect host), so it is not a dnsName.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: poe-sale-wildcard
  namespace: default
spec:
  secretName: poe-sale-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.poe.sale"
{{- end }}
