apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: acme-http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same

    - name: john2143-https
      protocol: HTTPS
      port: 8443
      hostname: john2143.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "john2143-com-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Same

    # One listener per wildcard certificate. Routes attach by sectionName; a
    # hostname must be one label under the wildcard (the certificate covers
    # nothing deeper — scripts/validate-gateway-certs.sh enforces it).
    # BackendTLSPolicy is banned by CI check 6 (it caps this Gateway at 16
    # listeners); the Gateway API limit is 64 listeners. Prefer adding a
    # namespace to an allowlist below over adding a listener.
    - name: john2143-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.john2143.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "john2143-com-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - default
                  - argocd
                  - kube-system
                  - openbao
    - name: 2143-me-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.2143.me"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "2143-me-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - default
                  - pocket-id
                  - stalwart
    # *.dev.john2143.com: prod routes it to the bigp nonprod cluster
    # (dev-route.yaml); nonprod serves the same hostnames on its own Traefik.
    - name: dev-john2143-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.dev.john2143.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "wildcard-dev-john2143-com-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: ts-2143-me-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.ts.2143.me"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "ts-2143-me-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - default
                  - argocd
                  - longhorn-system
                  - openbao
                  - stalwart

    - name: temporal-grpc-mtls
      protocol: TLS
      port: 8443
      hostname: temporal-grpc.john2143.com
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same

    # LiveKit's embedded TURN server always advertises
    # turns:<domain>:443?transport=tcp (hardcoded in pkg/service/roommanager.go)
    # and terminates TLS itself, so this listener passes the raw TLS stream
    # through by SNI to livekit-server:5349. This is what lets voice/calls work
    # for clients that cannot reach the cluster's UDP media ports — i.e. anyone
    # off the LAN/tailnet.
    - name: turn-john2143-passthrough
      protocol: TLS
      port: 8443
      hostname: turn.john2143.com
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: matrix

    - name: mm-b-hero-rehab-https
      protocol: HTTPS
      port: 8443
      hostname: mm.b.hero.rehab
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "mm-b-hero-rehab-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
    #- name: mm-timestone-2143-https
      #protocol: HTTPS
      #port: 8443
      #hostname: mm.timestone.2143.me
      #tls:
        #mode: Terminate
        #certificateRefs:
          #- group: ""
            #kind: Secret
            #name: mm-timestone-tls
      #allowedRoutes:
        #namespaces:
          #from: Same
    #- name: mm-timestone-john2143-https
      #protocol: HTTPS
      #port: 8443
      #hostname: mm.timestone.john2143.com
      #tls:
        #mode: Terminate
        #certificateRefs:
          #- group: ""
            #kind: Secret
            #name: mm-timestone-tls
      #allowedRoutes:
        #namespaces:
          #from: Same

    - name: aross-studio-https
      protocol: HTTPS
      port: 8443
      hostname: aross.studio
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "aross-studio-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Same

    # *.aross.studio: every aross subdomain (files.aross.studio today). One label
    # only; a route hostname must match this listener, not the apex listener.
    - name: aross-studio-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.aross.studio"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "aross-studio-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Same

    - name: balabusta-homes-https
      protocol: HTTPS
      port: 8443
      hostname: balabusta.homes
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "balabusta-homes-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: www-balabusta-homes-https
      protocol: HTTPS
      port: 8443
      hostname: www.balabusta.homes
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "balabusta-homes-tls" }}
      allowedRoutes:
        namespaces:
          from: Same

    # *.dsstar.us: Moss & Wool environments and chess.dsstar.us. One label only
    # (moss-12.dsstar.us).
    - name: dsstar-us-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.dsstar.us"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "dsstar-us-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Same

    # *.poe.sale: how.poe.sale (prod). Routes live in `default`.
    - name: poe-sale-wildcard-https
      protocol: HTTPS
      port: 8443
      hostname: "*.poe.sale"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.certOverride | default "poe-sale-wildcard-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
