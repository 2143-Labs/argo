{{- if .Values.prodOnly }}
# *.dev.john2143.com and au-dev.2143.me -> bigp nonprod cluster Traefik
# (192.168.7.7). Prod terminates TLS (public LE certs) and re-encrypts to
# nonprod through the per-backend ServersTransport below (SNI + nonprod-dev-ca)
# on a TraefikService that the routes reference. BackendTLSPolicy is not used:
# Traefik records one status ancestor per listener of every Gateway a policy's
# routes name, never prunes them, and caps the list at 16, which would cap
# shared-gateway at 16 listeners (scripts/validate-gateway-certs.sh check 6).
# Selectorless Service + custom EndpointSlice, same pattern as
# workloads/metallb/templates/kubernetes-api-lb.yaml.
{{- range $name, $host := dict "nonprod-traefik" "gateway.dev.john2143.com" "nonprod-traefik-2143me" "au-dev.2143.me" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: default
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ $name }}
  namespace: default
  labels:
    kubernetes.io/service-name: {{ $name }}
    endpointslice.kubernetes.io/managed-by: custom
addressType: IPv4
endpoints:
  - addresses: ["192.168.7.7"]
    conditions:
      ready: true
ports:
  - name: https
    port: 443
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $name }}-tls
  namespace: default
spec:
  # SNI and verified name; covered by the static cert's SANs.
  serverName: {{ $host }}
  rootCAs:
    - configMap: nonprod-dev-ca
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ $name }}-tls
  namespace: default
spec:
  weighted:
    services:
      - name: {{ $name }}
        port: 443
        # Never infer HTTPS from the port (Traefik >=3.7.15 does not).
        scheme: https
        serversTransport: {{ $name }}-tls
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-to-nonprod
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: dev-john2143-wildcard-https
  hostnames:
    - "*.dev.john2143.com"
  rules:
    # Class A (browser surfaces, docs/public-edge.md): these are whole
    # applications behind the nonprod Traefik, page loads included.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: nonprod-traefik-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-to-nonprod-au
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: 2143-me-wildcard-https
  hostnames:
    - au-dev.2143.me
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: nonprod-traefik-2143me-tls
{{- end }}
