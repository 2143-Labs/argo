{{- if .Values.prodOnly }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-tuwunel
  namespace: default
spec:
  hostnames:
    - matrix.2143.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: default
      sectionName: 2143-me-wildcard-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /voice
      filters:
        # Class B (machine/API, docs/public-edge.md): the voice relay speaks a
        # machine protocol, so no AppSec body inspection.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
      backendRefs:
        - group: ""
          kind: Service
          name: heorot-voice-relay
          namespace: matrix
          port: 8088
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        # Everything except /voice goes through the KEDA HTTP add-on interceptor,
        # so the homeserver can idle at 0 pods: the interceptor holds the request,
        # the InterceptorRoute `tuwunel` (workloads/tuwunel/) reports the metric,
        # KEDA wakes the StatefulSet, and the interceptor forwards. Same hop as
        # element-web/route.yaml and chat-heorot (gateway/templates/tuwunel-route.yaml).
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
{{- end }}
