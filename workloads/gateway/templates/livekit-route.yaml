{{- if .Values.prodOnly }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit-john2143
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - livekit.john2143.com
  rules:
    - filters:
        # Class B (machine/API, docs/public-edge.md): the media server's
        # signalling API and WebSocket upgrades.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
      backendRefs:
        - name: livekit-server
          namespace: matrix
          port: 7880
{{- end }}
