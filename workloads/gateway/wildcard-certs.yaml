apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ts-2143-me-wildcard
  namespace: default
spec:
  secretName: ts-2143-me-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.ts.2143.me"
