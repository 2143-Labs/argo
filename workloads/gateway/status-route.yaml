apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-route
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: status-2143-https
  hostnames: [status.2143.me]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: status-anubis
---
apiVersion: v1
kind: Service
metadata:
  name: pite-status
  namespace: default
spec:
  ports:
    - port: 3030
      targetPort: 3030
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pite-status
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.5.9
    ports:
      - port: 3030
        protocol: TCP
---
# status.2143.me goes through Anubis (workloads/anubis-status). If Anubis has no
# ready pod (Traefik answers 503) or fails upstream (502/504), serve the page
# directly so the status page never depends on Anubis being up. 500 is not in
# the range: that is Anubis's own error page and must not be replayed.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: status-anubis
  namespace: default
spec:
  failover:
    service:
      name: anubis-status
      port: 80
    fallback:
      name: pite-status
      port: 3030
    errors:
      status:
        - "502-504"