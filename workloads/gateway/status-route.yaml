apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-route
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: status-2143-https
  hostnames: [status.2143.me]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: pite-status
          port: 3030
---
apiVersion: v1
kind: Service
metadata:
  name: pite-status
  namespace: default
spec:
  ports:
    - port: 3030
      targetPort: 3030
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pite-status
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.5.9
    ports:
      - port: 3030
        protocol: TCP