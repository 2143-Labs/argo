# chess.dsstar.us (http + https) -> Dsstar's Lichess TV, one hop, any path.
# No backend. 302 so browsers don't cache it forever if the target changes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chess-dsstar-redirect
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
    - name: shared-gateway
      sectionName: chess-dsstar-us-https
  hostnames:
    - chess.dsstar.us
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: lichess.org
            path:
              type: ReplaceFullPath
              replaceFullPath: /@/Dsstar/tv
            statusCode: 302
