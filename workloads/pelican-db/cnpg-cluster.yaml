apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pelican-db
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: longhorn-cnpg
  walStorage:
    size: 4Gi
    storageClass: longhorn-cnpg
  bootstrap:
    initdb:
      database: pelican
      owner: pelican
  managed:
    roles:
      - name: pelican
        ensure: present
        login: true
        passwordSecret:
          name: pelican-db-password
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
