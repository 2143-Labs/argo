apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: john2143-com-worker
  labels: {app: john2143-com-worker}
  annotations:
    # apps/john2143-worker.yaml ignores diffs on unsafeCustomBuildID, so a commit that
    # changes only the build ID never syncs. Bump this alongside such a change.
    john2143.com/build-id-sync: "209-1"
spec:
  workerOptions:
    connectionRef: {name: john2143-temporal}
    temporalNamespace: john2143-com
    unsafeCustomBuildID: "213"
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels: {app: john2143-com-worker, app.kubernetes.io/part-of: john2143-com}
    spec:
      serviceAccountName: john2143-worker
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: worker
          image: ghcr.io/john2143/john2143.com-worker:213
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_MODE
              value: "worker"
            - name: DB
              valueFrom:
                secretKeyRef:
                  name: mongo-creds
                  key: worker-uri
            - name: MINIO_ENDPOINT_URL
              value: "http://seaweedfs-s3.default.svc.cluster.local:8333"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: S3_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT_URL
              value: "https://nyc3.digitaloceanspaces.com"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_SECRET_KEY
            - name: BUCKET
              value: "imagehost-files"
            - name: FOLDER
              value: "public-prod"
            - name: NODE_ENV
              value: "production"
          readinessProbe: {httpGet: {path: /ready, port: 3000}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits: {memory: "2Gi", cpu: "2000m"}
