apiVersion: v1
kind: ConfigMap
metadata:
  name: acquis-configmap
  namespace: crowdsec
data:
  acquis.yaml: |-
    ---
    filenames:
      - /var/log/containers/traefik-*_kube-system_*.log
    poll_without_inotify: true
    force_inotify: false
    labels:
      type: containerd
      program: traefik
