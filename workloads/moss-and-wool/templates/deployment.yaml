# darkhttpd on :8000 serving the built index.html (Moss-And-Wool flake packages.container). No replicas: the ScaledObject owns it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moss-and-wool
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app: moss-and-wool
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: moss-and-wool
  template:
    metadata:
      labels:
        app: moss-and-wool
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: moss-and-wool
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          # Tags are immutable sha-<commit>; a new build means a new tag in the Application.
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: &port 8000
              name: http

          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi

          livenessProbe:
            httpGet:
              path: /
              port: *port
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 25

          readinessProbe:
            httpGet:
              path: /
              port: *port
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
