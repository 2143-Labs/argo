apiVersion: v1
kind: Service
metadata:
  name: moss-and-wool
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app: moss-and-wool
spec:
  type: ClusterIP
  selector:
    app: moss-and-wool
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
