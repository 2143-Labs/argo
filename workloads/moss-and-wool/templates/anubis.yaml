{{- $ns := required "namespace is required" .Values.namespace }}
# Anubis (bot challenge) in front of this environment's page and assets
# (docs/public-edge.md, "Anubis in front of an app", chart-embedded variant).
# The HTTPRoute's / rule points at Service anubis; Anubis proxies to the KEDA
# interceptor and keeps the inbound Host, so the InterceptorRoutes still match
# and page views still wake the scale-to-zero pods.
# No failover: Traefik's kubernetescrd provider runs without allowCrossNamespace,
# so a TraefikService in `default` cannot name this namespace's Service; with
# this pod down the page answers 503 (open sockets are unaffected).
# Sync waves: Namespace and signing key -2, Anubis -1, the HTTPRoute 0, so the
# route switches only after Anubis is ready.
#
# Persistent JWT signing key (HS512_SECRET), generated once in-cluster, so an
# Anubis restart does not make every player solve the challenge again.
# CreatedOnce = never rotated; deleting the Secret makes ESO generate a new one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: anubis-signing-key
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 128
  digits: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anubis-signing-key
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: anubis-signing-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: anubis-signing-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: anubis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: anubis
  template:
    metadata:
      labels:
        app: anubis
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            # Open Graph passthrough: link unfurlers (Discord, Slack, iMessage...)
            # get the app's own og:/twitter: tags on the challenge page. Anubis
            # fetches the requested URL from TARGET without the visitor's
            # cookies, so only what the app shows anonymously is exposed.
            # Cached per host+path for 1h. Off by default in v1.28.
            - name: OG_PASSTHROUGH
              value: "true"
            - name: OG_CACHE_CONSIDER_HOST
              value: "true"
            - name: OG_EXPIRY_TIME
              value: "1h"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://keda-add-ons-http-interceptor-proxy.keda.svc:8080"
            - name: REDIRECT_DOMAINS
              value: {{ required "host is required" .Values.host | quote }}
            - name: HS512_SECRET
              valueFrom:
                secretKeyRef:
                  name: anubis-signing-key
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: anubis
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: anubis
spec:
  type: ClusterIP
  selector:
    app: anubis
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# The HTTPRoute lives in `default`; this lets its / rule reach Service anubis.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-httproute-to-anubis
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: anubis
