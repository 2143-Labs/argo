apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: moss-and-wool
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  target:
    service: moss-and-wool
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Moss &amp; Wool is starting</title>
          <meta name="theme-color" content="#eee9d8">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#f2eddc;color-scheme:light}
          body{display:grid;place-items:center;text-align:center;
               font:14px/1.5 system-ui,-apple-system,sans-serif;color:#403b42}
          .box{background:#fbf9f3;border:1px solid #c9cbb3;border-radius:7px;padding:24px 30px}
          h1{margin:0 0 .35rem;font:29px Georgia,serif;color:#596447}
          .tag{margin:0 0 .9rem;font-size:12px;letter-spacing:.06em;color:#347b80}
          p{margin:0;font-size:13px;color:#60654f}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:0 auto 12px;
                border:2px solid #c9cbb3;border-top-color:#347b80;
                animation:spin .7s linear infinite}
          .bar{height:2px;margin:14px 0 0;background:#c9cbb3;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#347b80;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>Moss &amp; Wool is starting...</h1>
          <p class="tag">A little meadow. A little patience.</p>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - "{{ required "host is required" .Values.host }}"
  scalingMetric:
    concurrency:
      targetValue: 10
