apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: moss-and-wool
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  target:
    service: moss-and-wool
    port: 80
  rules:
    - hosts:
        - "{{ required "host is required" .Values.host }}"
  scalingMetric:
    concurrency:
      targetValue: 10
