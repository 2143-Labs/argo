{{- $ns := required "namespace is required" .Values.namespace }}
# Public game edge (docs/public-edge.md): the shared generous rate and in-flight
# limits, then crowdsec-bouncer-noappsec, which enforces IP bans only (no AppSec:
# the backend is our own static server). The CrowdSec agent treats this host as
# a game host (workloads/crowdsec-agent/agent-game-hosts.yaml): no crawl/probing
# heuristics, only exploit signatures and a flood ban. Bots are Anubis's job:
# the / rule's backend is Service anubis (anubis.yaml).
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the dsstar-us-wildcard-https listener only admits routes from `default`.
# / is Anubis, which proxies to the KEDA interceptor (the interceptor wakes the
# scale-to-zero pod via the InterceptorRoute).
# scripts/validate-route-gates.sh skips /templates/, so these gates are not CI-checked:
# keep the three ExtensionRef filters by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "routeName is required" .Values.routeName }}
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: dsstar-us-wildcard-https
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
        # Every build's files carry the Nix store mtime (1970), so darkhttpd's
        # Last-Modified never changes and a revalidating browser would get a 304
        # with a stale game. Strip the validators and make browsers re-fetch.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [If-Modified-Since]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-cache
            remove: [Last-Modified]
      backendRefs:
        - name: anubis
          namespace: {{ $ns }}
          port: 80
---
# http:// -> https:// (one hop). No backend, so it never wakes the pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routeName }}-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
