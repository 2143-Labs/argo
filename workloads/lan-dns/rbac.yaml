apiVersion: v1
kind: ServiceAccount
metadata:
  name: lan-dns
  namespace: lan-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lan-dns
rules:
  # k8s_gateway checks each route CRD is established/served before watching it
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: ["*"]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lan-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lan-dns
subjects:
  - kind: ServiceAccount
    name: lan-dns
    namespace: lan-dns
