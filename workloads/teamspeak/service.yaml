apiVersion: v1
kind: Service
metadata:
  name: teamspeak
  labels:
    app: teamspeak
spec:
  type: ClusterIP
  selector:
    app: teamspeak
  ports:
    - port: 9987
      targetPort: 9987
      protocol: UDP
      name: voice
    - port: 30033
      targetPort: 30033
      protocol: TCP
      name: file-transfer
---
apiVersion: v1
kind: Service
metadata:
  name: ts-voice
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.15,fd00:6::15"
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv4, IPv6]
  type: LoadBalancer
  # Local: only the node running the pod announces this VIP, so draining any
  # other node never re-hashes live players (argo docs/node-maintenance.md).
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  ports:
  - port: 9987
    targetPort: 9987
    protocol: UDP
    name: voice
  # Voice and file transfer share this VIP: both used to have a Service of their
  # own, but they select the same pods, so the second address (.6.16) bought
  # nothing. The router dst-nats both ports here (docs/network-edge.md).
  - port: 30033
    targetPort: 30033
    protocol: TCP
    name: file-transfer

  selector:
    app: teamspeak
