apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: services
  namespace: metallb-system
spec:
  addresses:
  {{- range .Values.pools.services }}
  - {{ . }}
  {{- end }}
---
# The ingress VIP pair (WAN/LAN entry point, Traefik). Exactly one address per
# family so the dual-stack Traefik Service gets both from one pool without
# pinning either. autoAssign: false keeps every other Service off it; only a
# Service annotated `metallb.io/address-pool: ingress` can take it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress
  namespace: metallb-system
spec:
  addresses:
  {{- range .Values.pools.ingress }}
  - {{ . }}
  {{- end }}
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: control-plane-vip
  namespace: metallb-system
spec:
  addresses:
  - {{ .Values.apiVip }}-{{ .Values.apiVip }}
  autoAssign: false
