# big-oil.john2143.com (covered by the *.john2143.com DNS wildcard; no record).
# Lives in `default` because Traefik ExtensionRef middlewares are
# namespace-local and the john2143-wildcard-https listener admits default.
# Deliberately not named game-...: the CrowdSec agent exempts
# httproute-default-game-* from its crawl/probe scenarios
# (workloads/crowdsec-agent/agent-game-hosts.yaml), and an API should keep them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: big-oil
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - "big-oil.john2143.com"
  rules:
    # The JSON API goes straight to the app behind the same gates as
    # rots-web's /auth (game-edge.urlGates): Anubis would answer API clients
    # with its challenge page.
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: big-oil-exchange
          port: 9100
    # Everything else (/, /metrics, /healthz) is challenged by Anubis.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: big-oil-anubis
          port: 80
