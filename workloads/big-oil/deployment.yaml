apiVersion: apps/v1
kind: Deployment
metadata:
  name: big-oil-exchange
  namespace: default
  labels:
    app.kubernetes.io/name: big-oil-exchange
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # RWO PVC + 1 replica: RollingUpdate deadlocks (a new pod can never attach the
  # volume while the old pod holds it). Matches the other RWO workloads.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: big-oil-exchange
  template:
    metadata:
      labels:
        app.kubernetes.io/name: big-oil-exchange
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup is what makes the Longhorn volume writable for a non-root uid.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: big-oil
          image: ghcr.io/2143-labs/big-oil:7
          # --since is ignored once the database holds hours; it exists so the
          # very first start backfills the league from its first hour.
          args:
            - exchange
            - serve
            - --since
            - "1794600000"
            - --listen
            - 0.0.0.0:9100
          # Named http for the Service; Alloy scrapes <pod IP>:9100 by number.
          ports:
            - name: http
              containerPort: 9100
          env:
            - name: BIG_OIL_EXCHANGE_DB
              value: /data/exchange.db
            # Goes into the User-Agent, which GGG's guidelines ask for.
            - name: BIG_OIL_CONTACT
              value: john@2143.me
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9100
            periodSeconds: 30
            failureThreshold: 6
          # Long thresholds on purpose: one failed hour retries on the next
          # boundary and must not restart the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            periodSeconds: 60
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: big-oil-exchange
        - name: tmp
          emptyDir: {}
