# Anubis in front of everything on big-oil.john2143.com except /v1 (see
# httproute.yaml): the JSON API must answer non-browser clients, and Anubis
# would hand them a challenge page. Same shape as workloads/anubis-aross-files;
# every object is prefixed big-oil- because `default` is shared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big-oil-anubis
  namespace: default
  labels:
    app: big-oil-anubis
spec:
  # One replica: the default in-memory store keeps issued challenges per pod,
  # so a second replica would fail roughly half of all challenge submissions.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: big-oil-anubis
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: big-oil-anubis
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://big-oil-exchange.default.svc:9100"
            - name: REDIRECT_DOMAINS
              value: "big-oil.john2143.com"
            - name: POLICY_FNAME
              value: "/etc/anubis/policy.yaml"
            - name: HS512_SECRET
              valueFrom:
                secretKeyRef:
                  name: big-oil-anubis-signing-key
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: policy
              mountPath: /etc/anubis
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: big-oil-anubis-policy
---
apiVersion: v1
kind: Service
metadata:
  name: big-oil-anubis
  namespace: default
  labels:
    app: big-oil-anubis
spec:
  selector:
    app: big-oil-anubis
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Every request that reaches Anubis is challenged: /v1 never gets here, and
# nothing else on this host is meant for non-browser clients. Anubis serves its
# own challenge assets under /.within.website/ before policy evaluation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: big-oil-anubis-policy
  namespace: default
data:
  policy.yaml: |
    bots:
      - name: challenge-every-request
        path_regex: .*
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 4
    dnsbl: false
---
# Persistent HS512 signing key, generated once in-cluster. CreatedOnce = never
# rotated; deleting the Secret makes ESO generate a new one (every visitor
# re-solves the challenge once).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: big-oil-anubis-signing-key
  namespace: default
spec:
  length: 128
  digits: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: big-oil-anubis-signing-key
  namespace: default
spec:
  refreshPolicy: CreatedOnce
  target:
    name: big-oil-anubis-signing-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: big-oil-anubis-signing-key
