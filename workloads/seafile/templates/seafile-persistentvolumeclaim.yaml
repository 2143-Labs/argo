{{- if include "seafile.seafileDataVolume.enabled" . | eq "true" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  annotations:
    # Customer data: Argo must never prune or delete this claim on app deletion.
    # (longhorn-3 is also reclaimPolicy Retain.)
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # Mirrored weekly to B2 by offsite-volumes on the NAS (docs/offsite-data.md).
    offsite.backup/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ include "seafile.seafileDataVolume.storage" . }}
  {{- if and .Values.seafile.configs.seafileDataVolume .Values.seafile.configs.seafileDataVolume.storageClassName }}
  storageClassName: {{ .Values.seafile.configs.seafileDataVolume.storageClassName }}
  {{- end }}
{{- end }}