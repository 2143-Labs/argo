apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kubernetes.io/hostname: big
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
        name: nvidia-device-plugin-ctr
        env:
        - name: DEVICE_LIST_STRATEGY
          value: cdi-annotations
        - name: LD_LIBRARY_PATH
          value: /driver-root
        securityContext:
          privileged: true
        volumeMounts:
        - name: kubelet-device-plugins-dir
          mountPath: /var/lib/kubelet/device-plugins
        - name: driver-root
          mountPath: /driver-root
          readOnly: true
        - name: cdi-root
          mountPath: /var/run/cdi
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        - name: dev-nvidia0
          mountPath: /dev/nvidia0
        - name: dev-nvidiactl
          mountPath: /dev/nvidiactl
        - name: dev-nvidia-uvm
          mountPath: /dev/nvidia-uvm
        - name: dev-nvidia-uvm-tools
          mountPath: /dev/nvidia-uvm-tools
        - name: dev-nvidia-caps
          mountPath: /dev/nvidia-caps
      volumes:
      - name: kubelet-device-plugins-dir
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
      - name: driver-root
        hostPath:
          path: /driver-root
          type: Directory
      - name: cdi-root
        hostPath:
          path: /var/run/cdi
          type: Directory
      - name: nix-store
        hostPath:
          path: /nix/store
          type: Directory
      - name: dev-nvidia0
        hostPath:
          path: /dev/nvidia0
      - name: dev-nvidiactl
        hostPath:
          path: /dev/nvidiactl
      - name: dev-nvidia-uvm
        hostPath:
          path: /dev/nvidia-uvm
      - name: dev-nvidia-uvm-tools
        hostPath:
          path: /dev/nvidia-uvm-tools
      - name: dev-nvidia-caps
        hostPath:
          path: /dev/nvidia-caps
          type: Directory
