apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
  namespace: mattermost
  annotations:
    # No running pods, PVCs retained. The operator only honours this once the
    # Cluster reports Ready — a not-Ready cluster keeps retrying instead, which
    # is what made 0f1bbd1 revert. Hence `instances: 1` as well: the second copy
    # never became healthy (closet has no memory headroom), so it both blocked
    # hibernation and held a 1Gi request on the node that needs it most.
    # Rehydrate by setting this to "off" (mattermost is at 0 replicas since Jul).
    cnpg.io/hibernation: "on"
spec:
  instances: 1
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    # Required: the copies must never share a node, or the second copy is no
    # protection at all.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      # arch is excluded because its Longhorn disk cannot provision new
      # volumes: 91 GiB free against a 25% floor of 111 GiB, and 242 GiB of
      # storageReserved on a 442 GiB disk. Remove this rule if arch's disk is
      # ever freed.
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [arch]
      # Preferred only: a required "big or closet" rule would stop the
      # operator from recreating a lost instance on nas.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [big, closet]
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: longhorn-cnpg
  walStorage:
    size: 4Gi
    storageClass: longhorn-cnpg
  bootstrap:
    initdb:
      database: mattermost
      owner: mattermost
  managed:
    roles:
      - name: mattermost
        ensure: present
        login: true
        passwordSecret:
          name: mattermost-db-password
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
  # Continuous WAL archiving + base backups offsite via ObjectStore mattermost-db-offsite
  # (offsite-backup.yaml). docs/db-backups.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: mattermost-db-offsite
