apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production Let's Encrypt server
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for certificate expiry notifications
    email: john@john2143.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: shared-gateway
                namespace: default
                sectionName: acme-http
      - dns01:
          webhook:
            groupName: acme.2143.me
            solverName: desec
            config:
              apiTokenSecretRef:
                name: desec-io-dns
                key: token
        selector:
          dnsZones:
            - "2143.me"
            - "john2143.com"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging server for testing (higher rate limits)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: john@john2143.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: shared-gateway
                namespace: default
                sectionName: acme-http
---
# http01-only issuer for concrete public names outside the deSEC zones
# (e.g. *.b.hero.rehab, *.timestone.* mirrors). letsencrypt-prod routes
# concrete names inside dnsZones [2143.me, john2143.com] to the desec dns01
# webhook; this issuer never does, so issuance cannot be blocked by it.
# Wildcard certs still require letsencrypt-prod (dns01).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: john@john2143.com
    privateKeySecretRef:
      name: letsencrypt-http01-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: shared-gateway
                namespace: default
                sectionName: acme-http
