apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: temporal-db
spec:
  # Single instance: temporal-db-5's Longhorn volumes are faulted beyond
  # recovery (node outage). One healthy instance keeps Temporal's DB up;
  # scale back to 2 with fresh volumes once the old ones are recreated.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: longhorn-cnpg
  walStorage:
    size: 4Gi
    storageClass: longhorn-cnpg
  bootstrap:
    initdb:
      database: temporal
      owner: temporal
      postInitSQL:
        - CREATE DATABASE temporal_visibility OWNER temporal
  managed:
    roles:
      - name: temporal
        ensure: present
        login: true
        passwordSecret:
          name: temporal-db-password
  postgresql:
    pg_hba:
      - host all all 0.0.0.0/0 scram-sha-256
