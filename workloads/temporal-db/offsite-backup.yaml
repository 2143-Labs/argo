---
# Offsite WAL archive + daily base backup for temporal-db (Barman Cloud plugin): Backblaze
# B2, home bucket j2143-argo-db-backups-home, Object Lock COMPLIANCE 30d, SSE-C,
# lifecycle expiry 31d. The writer key in Secret db-backup-s3 cannot be trusted to
# stop at the lock, so the lock is the control. docs/db-backups.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: temporal-db-offsite
  # the Cluster itself carries no namespace; state it on these objects anyway
  namespace: default
  annotations:
    # exists before the Cluster gains the plugin that references it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  configuration:
    destinationPath: s3://j2143-argo-db-backups-home/databases/cnpg/default
    endpointURL: https://s3.us-east-005.backblazeb2.com
    s3Credentials:
      accessKeyId: {name: db-backup-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: db-backup-s3, key: ACCESS_SECRET_KEY}
      region: {name: db-backup-s3, key: REGION}
      sseCustomerKey: {name: db-backup-s3, key: SSE_CUSTOMER_KEY}
    wal:
      compression: zstd
      maxParallel: 4
    data:
      compression: zstd
      jobs: 2
  instanceSidecarConfiguration:
    # CRD defaults stated explicitly: these apps use ServerSideApply where
    # server-defaulted fields otherwise show up as permanent drift.
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    # PROFILE G: requests equal limits, so 250m/512Mi keeps the pod Guaranteed.
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 250m, memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: temporal-db-offsite-daily
  namespace: default
  annotations:
    # after the Cluster has rolled with the plugin
    argocd.argoproj.io/sync-wave: "1"
spec:
  # CNPG uses six-field cron, seconds first, in UTC.
  schedule: "0 0 5 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: temporal-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
