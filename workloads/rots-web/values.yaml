# Every empty string is set by apps/rots-web.yaml (prod) or apps/rots-web-preview.yaml
# (one per rots4 PR); the templates fail to render if any is empty.
namespace: ""   # rots-prod (prod) or rots-pr-<N>
host: ""        # rots.john2143.com or rots-<N>.john2143.com
routeName: ""   # unique in `default`: rots-web or rots-pr-<N>
publicUrl: ""   # https://rots.john2143.com or https://rots-<N>.john2143.com; ticket audience
image:
  repository: registry.ts.2143.me/2143-labs/rots4
  tag: ""       # web client: webserver-wasm-latest or webserver-wasm-pr-<N>

# Pull credential for the private images under image.repository (templates/registry-pull.yaml).
# key: OpenBao key (consumers mount) holding {username, token}; "" = public images, no pull
# secret. registry: the only host the credential is sent to.
imagePullSecret:
  key: john2143-com/default/zot-cluster-pull
  registry: registry.ts.2143.me

web:
  # minReplicaCount on the ScaledObject rots-web (max is always 1). 0 (previews):
  # the KEDA interceptor holds a page view while the pod cold-starts. 1 (prod): a
  # pod is always up, so the wasm bundle is served warm.
  minReplicas: 0

authserver:
  # set by apps/rots-web.yaml (prod, rewritten by rots4 CI) or apps/rots-web-preview.yaml
  image: ""
  # OpenBao path rendered into Secret rots-authserver-secret (externalsecret.yaml):
  # john2143-com/rots-prod/rots-authserver-secret (prod) or
  # john2143-com/rots-preview/rots-authserver-secret (every preview).
  secretKey: ""
  # DISABLED_PROVIDERS: "" (prod) or "discord" (previews; Discord redirect URIs are exact).
  disabledProviders: ""
  # SESSION_EXECUTION_TIMEOUT_SECS: a login session's workflow ends after this long at
  # the latest. 172800 (prod); previews 7200, so a deleted preview's sessions end soon.
  sessionExecutionTimeoutSecs: 172800
  # KEDA scale-to-zero for the authserver and, with it, the Temporal worker that runs the
  # coordinator. /auth goes through the KEDA interceptor, which holds a request while the pod
  # cold-starts; any game-server pod in the namespace keeps it up, because only a running
  # authserver can delete a managed instance. Prod's static pods keep it up until the managed
  # switch.
  scaleToZero:
    enabled: true
    # Seconds with no /auth request in flight and no game-server pod before it scales to zero.
    idleSeconds: 3600
    # Replica bounds for the authserver's ScaledObject. Prod runs at least one (the warm pool
    # needs a coordinator to fill and reap it) and may scale out on /auth concurrency;
    # previews keep 0 so they still scale to zero.
    minReplicas: 0          # prod 1
    maxReplicas: 1          # prod 3

db:
  clusterName: rots-db  # one CNPG cluster per namespace; app secret is <clusterName>-app
  instances: 1          # 2 (prod) or 1 (previews)
  size: 2Gi
  walSize: 1Gi
  storageClass: longhorn-cnpg
  protect: false        # true (prod): Prune=false,Delete=false on the Cluster and Namespace

gameserver:
  tag: ""          # gameserver-latest (prod) or gameserver-pr-<N>
  # static: this chart's own StatefulSet rots-gameserver with `replicas` pods -
  # today's prod, slot = pod ordinal. kubernetes: the authserver provisions one
  # one-replica StatefulSet per instance from PodTemplate rots-gameserver
  # (podtemplate.yaml) and destroys it when idle - previews, prod after the switch.
  provisioner: static
  replicas: 1      # static mode: 4 (prod) or 1 (previews)
  slots: 4         # network slots: per-slot Services and /ws/<k> routes range over this
  udpPortBase: 0   # 36000 (prod) or 31000 + 4*(N % 1000) (previews)
  lbIP: ""         # 192.168.6.32 (prod) or 192.168.6.33 (previews)
  lbIPv6: ""       # fd00:6::32 (prod) or fd00:6::33 (previews)
  shareKey: ""     # metallb.io/allow-shared-ip: rots-prod (prod) or rots-preview (previews)
  # Managed (kubernetes) mode only - passed to the authserver:
  capacityPerServer: 32   # static mode's placement cap; placeholder until #74 measures it
  readyTimeoutSecs: 120   # first heartbeat deadline before a start counts as failed
  idleSecs: 60            # ROTS_IDLE_SECS: connected == 0 this long -> destroy
  # Managed (kubernetes) mode only: instances kept booted in pre-game (sockets and the
  # coordinator link up, world paused) and activated when a player is placed on one, so
  # /play answers with a ticket in ~1 s instead of ~15 s. Each takes a slot from
  # gameserver.slots, a 200m/256Mi pod and a 1Gi Longhorn volume.
  warmInstances: 0        # prod 1; previews 0 (a warm pod keeps the authserver awake)
  # How long an unclaimed warm instance may live before it is destroyed and replaced.
  warmMaxAgeSecs: 21600
  # requests.cpu / requests.memory hard cap on pods of PriorityClass
  # rots-gameserver, and the numbers the authserver's pre-check reports.
  quota:
    cpu: "2"
    memory: 4Gi
  # Cluster-scoped, so prod only: one copy serves every preview namespace, which
  # is also why a PodTemplate may name the class while previews do not create it.
  priorityClass:
    create: false

temporal:
  namespace: ""    # rots (prod) | rots-preview (all previews)
  taskQueue: ""    # rots-prod | rots-pr-<N>
  # Previews only (never with db.protect): a PreDelete hook stops the authserver and
  # terminates every workflow on taskQueue before Argo deletes the preview.
  cleanupOnDelete: false

# Link previews (helm_modules/game-edge): the Open Graph payload the Anubis
# challenge page carries for clients that cannot solve a challenge (Discord,
# Slack, Telegram, ...). ROTS serves no raster (every path 404s), so the card is
# a title and a description.
embed:
  title: ROTS
  siteName: ROTS
  description: "ROTS — a multiplayer game built with Bevy: play it in the browser, or with the native client."
