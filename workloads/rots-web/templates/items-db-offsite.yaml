{{- if .Values.items.enabled }}
---
# Offsite WAL archive + daily base backup for items-db (Barman Cloud plugin):
# Backblaze B2 home bucket, Object Lock COMPLIANCE 30d, SSE-C, lifecycle expiry 31d.
# Barman appends the serverName (the Cluster name, items-db) to destinationPath, so
# these objects sit beside rots-db's and settings-db's under databases/cnpg/rots-prod/.
# items-db has one instance and no standby, so enabling this restarts it in place once;
# every game pod keeps minting meanwhile only if the restart is short, and a manifest a
# pod cannot deliver is retried (the sender backs off on 5xx and connection errors).
# The writer key in Secret db-backup-s3 carries the SSE-C key and cannot be trusted to
# stop at the lock, so the lock is the control. docs/db-backups.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.items.db.clusterName }}-offsite
  namespace: {{ required "namespace is required" .Values.namespace }}
  annotations:
    # exists before the Cluster gains the plugin that references it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  configuration:
    destinationPath: s3://j2143-argo-db-backups-home/databases/cnpg/{{ .Values.namespace }}
    endpointURL: https://s3.us-east-005.backblazeb2.com
    s3Credentials:
      accessKeyId: {name: db-backup-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: db-backup-s3, key: ACCESS_SECRET_KEY}
      region: {name: db-backup-s3, key: REGION}
      sseCustomerKey: {name: db-backup-s3, key: SSE_CUSTOMER_KEY}
    wal:
      compression: zstd
      maxParallel: 4
    data:
      compression: zstd
      jobs: 2
  instanceSidecarConfiguration:
    # CRD defaults stated explicitly: Argo diffs them otherwise.
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    # PROFILE B: items-db's requests are burstable (50m/128Mi against 500m/512Mi limits),
    # so the sidecar does not claim a guarantee the pod does not have.
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.items.db.clusterName }}-offsite-daily
  namespace: {{ required "namespace is required" .Values.namespace }}
  annotations:
    # after the Cluster has rolled with the plugin
    argocd.argoproj.io/sync-wave: "1"
spec:
  # CNPG uses six-field cron, seconds first, in UTC. 05:05 keeps it clear of the other
  # clusters' dailies (04:00-04:55, 05:00, 05:15, 05:30, 05:45).
  schedule: "0 5 5 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Values.items.db.clusterName }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
