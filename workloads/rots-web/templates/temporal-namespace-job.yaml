# Ensures this environment's Temporal namespace exists before the authserver
# worker connects: Temporal clients cannot self-register, and a missing namespace
# turns every /play into 503 temporal_unavailable. Idempotent; also self-heals a
# rebuilt Temporal. Two previews creating the same shared namespace at once make
# one Job retry, after which `describe` succeeds.
# Wave -1 runs it before the authserver Deployment (wave 0): the authserver only
# turns Ready once its worker reaches the namespace, and a later wave would wait
# for that forever. While Temporal is unreachable, this Job holds back the whole
# sync, game servers and web included.
# HookSucceeded deletes the Job once it succeeds, so every sync runs it fresh:
# with a completed Job left over from the last sync, Argo CD (v3.5) deleted it
# and reused its old result without running a new one.
{{- $ns := required "namespace is required" .Values.namespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rots-temporal-namespace
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure-temporal-namespace
          image: docker.io/temporalio/admin-tools:1.32.0
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal-frontend.default.svc:7233"
          command: ["/bin/sh", "-c"]
          args:
            - |-
              set -e
              NS={{ .Values.temporal.namespace }}
              temporal operator namespace describe "$NS" >/dev/null 2>&1 || temporal operator namespace create "$NS" --retention 72h
              # Custom search attributes the authserver copies onto every session
              # workflow, so the UI names the player and `temporal workflow list -q`
              # can filter by them. A namespace that lacks one makes the authserver
              # start sessions without attributes (degraded UI, no failed login),
              # so this must stay idempotent and run before the authserver rolls.
              # `create` fails when the name exists; `list` is the guard.
              for attr in \
                RotsPlayerName:Keyword RotsCharacterId:Int RotsAccountId:Int \
                RotsProvider:Keyword RotsKind:Keyword
              do
                name=${attr%%:*}
                type=${attr##*:}
                temporal operator search-attribute list --namespace "$NS" | grep -qw "$name" \
                  || temporal operator search-attribute create --namespace "$NS" --name "$name" --type "$type"
              done
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
