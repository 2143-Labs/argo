{{- /* Managed (kubernetes) provisioner: the pod template the authserver's
       provisioner copies into one one-replica StatefulSet per instance
       (rots-gs-<k>-g<g>). It is never run from this repo directly. The
       StatefulSet keeps one stable pod name (<name>-0) for the liveness probe
       and the forced kill. The provisioner adds the per-instance labels and
       the slot/generation/join-code/public-port env and uses the emptyDir
       volume as is: the world lives in rots-sync (sync.yaml), not on a volume. */}}
{{- if eq (.Values.gameserver.provisioner | default "static") "kubernetes" }}
{{- $ns := required "namespace is required" .Values.namespace }}
apiVersion: v1
kind: PodTemplate
metadata:
  name: rots-gameserver
  namespace: {{ $ns }}
  labels:
    app: rots-gameserver
template:
  metadata:
    labels:
      app: rots-gameserver
  spec:
    # StatefulSet pods must use Always; a gracefully-exited server is restarted
    # by the controller, which is why it writes the shutdown sentinel first.
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    # The server runs as 65534 and writes config.yaml and the shutdown sentinel to
    # /data; fsGroup also covers a pre-emptyDir instance's root-owned Longhorn PVC.
    securityContext:
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
    priorityClassName: rots-gameserver
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: workload-type
                  operator: In
                  values:
                    - general
          # office is wifi-only: used only when the wired nodes are full.
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - office
{{- if .Values.imagePullSecret.key }}
    imagePullSecrets:
      - name: registry-pull
{{- end }}
    containers:
      {{- include "rots-web.gameserver-container" (dict "root" . "managed" true) | nindent 6 }}
    volumes:
      # config.yaml and the shutdown sentinel only; a pre-emptyDir authserver image
      # replaces this volume with the instance's PVC.
      - name: data
        emptyDir:
          sizeLimit: 1Gi
{{- end }}
