# ROTS game servers. Two provisioners (gameserver.provisioner):
#   static     - one StatefulSet rots-gameserver with `replicas` pods (today's
#                prod). Slot = pod ordinal.
#   kubernetes - no StatefulSet here: the authserver provisions one one-replica
#                StatefulSet per instance from PodTemplate rots-gameserver
#                (podtemplate.yaml), because only StatefulSet pods get their
#                Longhorn volume freed when their node dies.
# Either way slot k is reached two ways:
#   - browsers: wss://<host>/ws/<k> (HTTPRoute -> Service rots-gs-<k>, TCP 25565;
#     server/src/websocket.rs binds TCP on the game port)
#   - native clients: udp <lbIP>:<udpPortBase + k> (Service rots-gs-<k>-udp)
# Every connection carries a game ticket the server verifies against the
# authserver's public key (fetched once at startup from ROTS_AUTH_URL).
{{- $ns := required "namespace is required" .Values.namespace }}
{{- $gs := .Values.gameserver }}
{{- $provisioner := $gs.provisioner | default "static" }}
{{- if not (has $provisioner (list "static" "kubernetes")) }}
{{- fail (printf "gameserver.provisioner must be static or kubernetes, got %q" $provisioner) }}
{{- end }}
{{- $static := eq $provisioner "static" }}
{{- $replicas := int $gs.replicas }}
{{- $slots := int $gs.slots }}
{{- $base := int $gs.udpPortBase }}
{{- if and $static (gt $replicas $slots) }}
{{- fail (printf "gameserver.replicas (%d) exceeds gameserver.slots (%d)" $replicas $slots) }}
{{- end }}
{{- if or (lt $base 1) (gt (add $base $slots -1) 65535) }}
{{- fail (printf "gameserver.udpPortBase (%d) must leave %d ports within 1-65535" $base $slots) }}
{{- end }}
{{- $lbIP := required "gameserver.lbIP is required" $gs.lbIP }}
{{- $lbIPv6 := required "gameserver.lbIPv6 is required" $gs.lbIPv6 }}
{{- $shareKey := required "gameserver.shareKey is required" $gs.shareKey }}
{{- if $static }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rots-gameserver
  namespace: {{ $ns }}
  labels:
    app: rots-gameserver
spec:
  serviceName: rots-gameserver
  replicas: {{ $replicas }}
  # Pods are independent servers; never make pod 3 wait on pod 0.
  podManagementPolicy: Parallel
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rots-gameserver
  template:
    metadata:
      labels:
        app: rots-gameserver
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        {{- include "rots-web.gameserver-container" (dict "root" . "managed" false) | nindent 8 }}
      volumes:
        - name: data
          emptyDir: {}
---
# Governing (headless) Service for the StatefulSet; gives each pod stable DNS.
apiVersion: v1
kind: Service
metadata:
  name: rots-gameserver
  namespace: {{ $ns }}
  labels:
    app: rots-gameserver
spec:
  clusterIP: None
  selector:
    app: rots-gameserver
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
      name: game-ws
{{- end }}
{{- range $i := until (int $slots) }}
---
# WebSocket backend for /ws/{{ $i }} (httproute-ws.yaml), and the health port the
# authserver probes before it ever kills an instance.
apiVersion: v1
kind: Service
metadata:
  name: rots-gs-{{ $i }}
  namespace: {{ $ns }}
  labels:
    app: rots-gameserver
spec:
  type: ClusterIP
  selector:
{{- if $static }}
    statefulset.kubernetes.io/pod-name: rots-gameserver-{{ $i }}
{{- else }}
    app: rots-gameserver
    rots.2143.me/slot: "{{ $i }}"
{{- end }}
  ports:
    - port: 80
      targetPort: 25565
      protocol: TCP
      name: game-ws
    - port: 25566
      targetPort: 25566
      protocol: TCP
      name: health
---
# Native UDP for slot {{ $i }}. Every LB Service in this environment (and, for
# previews, in every rots-pr-* namespace) shares one VIP via allow-shared-ip;
# MetalLB only shares across differing selectors with externalTrafficPolicy: Cluster.
apiVersion: v1
kind: Service
metadata:
  name: rots-gs-{{ $i }}-udp
  namespace: {{ $ns }}
  labels:
    app: rots-gameserver
  annotations:
    metallb.io/loadBalancerIPs: "{{ $lbIP }},{{ $lbIPv6 }}"
    metallb.io/allow-shared-ip: {{ $shareKey | quote }}
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv4, IPv6]
  selector:
{{- if $static }}
    statefulset.kubernetes.io/pod-name: rots-gameserver-{{ $i }}
{{- else }}
    app: rots-gameserver
    rots.2143.me/slot: "{{ $i }}"
{{- end }}
  ports:
    - port: {{ add $base $i }}
      targetPort: 25565
      protocol: UDP
      name: game-udp
{{- end }}
