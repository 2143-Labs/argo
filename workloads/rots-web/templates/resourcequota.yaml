{{- /* Managed (kubernetes) provisioner only. Scoped by PriorityClass so only
       game-server pods count, and the authserver's quota pre-check (which
       reads this object) speaks the same numbers as the scheduler.
       requests.cpu hard cap / game-server request (200m) = instances this
       namespace may run; prod 32 CPU -> 160, previews 2 CPU -> 10. */}}
{{- if eq (.Values.gameserver.provisioner | default "static") "kubernetes" }}
{{- $ns := required "namespace is required" .Values.namespace }}
{{- $quota := .Values.gameserver.quota }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rots-gameservers
  namespace: {{ $ns }}
spec:
  hard:
    requests.cpu: {{ $quota.cpu | quote }}
    requests.memory: {{ $quota.memory | quote }}
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - rots-gameserver
{{- end }}
