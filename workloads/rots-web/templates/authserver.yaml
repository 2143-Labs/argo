# rots-authserver: accounts, sessions and game tickets. Served at https://<host>/auth; the
# HTTPRoute strips /auth, so the app serves /api/v1/... at its root.
# With authserver.scaleToZero.enabled the ScaledObject rots-authserver owns `replicas`: the pod
# is up while an /auth request is in flight or a game-server pod exists in this namespace,
# which also covers game servers' public-key fetch at startup.
{{- $ns := required "namespace is required" .Values.namespace }}
{{- $gs := .Values.gameserver }}
{{- /* In kubernetes mode the authserver provisions game servers itself, so it
       runs as a ServiceAccount with the provisioner Role (rbac.yaml). */}}
{{- $managed := eq ($gs.provisioner | default "static") "kubernetes" }}
{{- if ge (int ($gs.warmInstances | default 0)) (int ($gs.slots | default 0)) }}
{{- fail "gameserver.warmInstances must be smaller than gameserver.slots" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rots-authserver
  namespace: {{ $ns }}
  labels:
    app: rots-authserver
spec:
{{- if not .Values.authserver.scaleToZero.enabled }}
  replicas: 1
{{- end }}
  # The authserver holds no state (fleet and session state live in Temporal), but
  # the join path's availability does: the default 25%/25% would delete the only
  # pod before its replacement is Ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rots-authserver
  template:
    metadata:
      labels:
        app: rots-authserver
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
{{- if $managed }}
      serviceAccountName: rots-authserver
{{- end }}
{{- if .Values.imagePullSecret.key }}
      imagePullSecrets:
        - name: registry-pull
{{- end }}
      containers:
        - name: rots-authserver
          image: {{ required "authserver.image is required" .Values.authserver.image }}
          # authserver-<sha7> (prod, rewritten by rots4 CI) and authserver-pr-<N>-<head sha>
          # (previews) are immutable per commit, so Always costs nothing and a repointed tag
          # is picked up on the next pod.
          imagePullPolicy: Always
          # clap subcommand (Action::Server) is required.
          args: ["server"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PUBLIC_URL
              value: {{ required "publicUrl is required" .Values.publicUrl | quote }}
            - name: STEAM_APP_ID
              value: "4346770"
            - name: DISABLED_PROVIDERS
              value: {{ .Values.authserver.disabledProviders | quote }}
            # The authserver hosts the Temporal worker for the fleet coordinator
            # and the per-login session workflows; see rots-authserver's README.
            - name: TEMPORAL_ADDRESS
              value: "http://temporal-frontend.default.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: {{ required "temporal.namespace is required" .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ required "temporal.taskQueue is required" .Values.temporal.taskQueue | quote }}
            - name: SESSION_EXECUTION_TIMEOUT_SECS
              value: {{ .Values.authserver.sessionExecutionTimeoutSecs | quote }}
            # Internal API for game-server reports (bearer COORDINATOR_TOKEN from
            # the secret below). Never routed through the gateway.
            - name: INTERNAL_PORT
              value: "8001"
            # Provisioner: static (servers are this chart's StatefulSet pods) or
            # kubernetes (spawn/delete one StatefulSet per instance). Static
            # places against `replicas` ready servers; managed owns `slots`.
            - name: GAME_SERVER_PROVISIONER
              value: {{ $gs.provisioner | default "static" | quote }}
            - name: GAME_SERVER_SLOTS
              value: {{ ternary $gs.slots $gs.replicas $managed | quote }}
            - name: GAME_SERVER_CAPACITY_PER_SERVER
              value: {{ $gs.capacityPerServer | quote }}
            - name: GAME_SERVER_READY_TIMEOUT_SECS
              value: {{ $gs.readyTimeoutSecs | quote }}
            - name: GAME_SERVER_WARM_INSTANCES
              value: {{ $gs.warmInstances | default 0 | quote }}
            - name: GAME_SERVER_WARM_MAX_AGE_SECS
              value: {{ $gs.warmMaxAgeSecs | default 21600 | quote }}
            - name: GAME_UDP_HOST
              value: {{ .Values.host | quote }}
            - name: GAME_UDP_PORT_BASE
              value: {{ .Values.gameserver.udpPortBase | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.clusterName }}-app
                  key: uri
            - name: RUST_LOG
              value: info
{{- if .Values.imagePullSecret.key }}
            # The warm pool's stale-image check reads the PodTemplate image digest from
            # the registry; private images need the pull credential (k8s.rs registry_digest).
            - name: REGISTRY_DOCKERCONFIGJSON
              valueFrom:
                secretKeyRef:
                  name: registry-pull
                  key: .dockerconfigjson
                  optional: true
{{- end }}
          # TICKET_SIGNING_KEY and the provider credentials (externalsecret.yaml).
          envFrom:
            - secretRef:
                name: rots-authserver-secret
          ports:
            - containerPort: &port 8000
              name: http
            # Game-server reports (internal.rs); ClusterIP only.
            - containerPort: 8001
              name: internal

          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: *port
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            # timeoutSeconds 3: the 1 s default timed out under node contention
            # (rots-pr-13, 2026-11-02 04:56Z) and, with one replica, took the
            # whole API out of Traefik for ~15 s.
            timeoutSeconds: 3

          # Readiness, not liveness: traffic only lands on a pod whose Temporal
          # worker has connected (the worker retries every 10 s, so /health alone
          # would route joins to a pod answering 503 temporal_unavailable).
          readinessProbe:
            httpGet:
              path: /ready
              port: *port
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rots-authserver
  namespace: {{ $ns }}
  labels:
    app: rots-authserver
spec:
  type: ClusterIP
  selector:
    app: rots-authserver
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    # Game servers post /internal/v1/servers/* here
    # (http://rots-authserver.<ns>.svc:8001).
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: internal
