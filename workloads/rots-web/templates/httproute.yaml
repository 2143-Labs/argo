{{- /* The Class A gates; every HTTPS rule below includes them. */}}
{{- define "rots-web.gates" }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
{{- end }}
{{- $ns := required "namespace is required" .Values.namespace }}
# Class A browser surface (see docs/public-edge.md): the crowdsec-bouncer filter
# is what stops scanners; the rate/inflight limits are the shared generous ones.
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the john2143-wildcard-https listener only admits default/argocd/kube-system.
# /auth and /ws/<i> go straight to the namespace's Services (reference-grant.yaml).
# The / backend is the KEDA interceptor (ReferenceGrant keda/allow-httproute-to-interceptor),
# which wakes the scale-to-zero web client via the InterceptorRoute.
# scripts/validate-route-gates.sh skips /templates/, so these gates are not CI-checked:
# every rule must include "rots-web.gates".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "routeName is required" .Values.routeName }}
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    # rots-authserver serves /api/v1/... at its root.
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
{{- include "rots-web.gates" . }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: rots-authserver
          namespace: {{ $ns }}
          port: 80
    {{- range $i := until (int .Values.gameserver.replicas) }}
    # Game server pod {{ $i }} over WebSocket; tungstenite ignores the path.
    - matches:
        - path:
            type: PathPrefix
            value: /ws/{{ $i }}
      filters:
{{- include "rots-web.gates" $ }}
      backendRefs:
        - name: rots-gs-{{ $i }}
          namespace: {{ $ns }}
          port: 80
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
{{- include "rots-web.gates" . }}
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
---
# http:// -> https:// (one hop). Separate from gateway/john2143-http-to-https,
# which is at the Gateway API cap of 16 hostnames. No backend, so it never wakes
# the pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "routeName is required" .Values.routeName }}-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
