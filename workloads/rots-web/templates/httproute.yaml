{{- $ns := required "namespace is required" .Values.namespace }}
# Class A browser surface (see docs/public-edge.md): the gates, Anubis and the
# route names come from helm_modules/game-edge; a rule whose router is
# `httproute-default-game-...` is what the CrowdSec agent exempts from its
# crawl/probing heuristics (workloads/crowdsec-agent/agent-game-hosts.yaml).
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the john2143-wildcard-https listener only admits default/argocd/kube-system.
# /auth goes through the KEDA interceptor (ReferenceGrant keda/allow-httproute-to-interceptor)
# to the authserver when authserver.scaleToZero.enabled, else straight to the namespace's
# Service (reference-grant.yaml); the /ws/<k> game-server rules live in httproute-ws.yaml,
# because one HTTPRoute holds at most 16 rules and the fleet has one route per 16 slots.
# The / backend is the KEDA interceptor (ReferenceGrant keda/allow-httproute-to-interceptor),
# which wakes the scale-to-zero web client via the InterceptorRoute.
# / is Anubis, which proxies to the KEDA interceptor and keeps the inbound Host,
# so the InterceptorRoute still matches and page views still wake the client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    # rots-authserver serves /api/v1/... at its root.
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
{{- include "game-edge.urlGates" . }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
{{- if .Values.authserver.scaleToZero.enabled }}
          # Selects InterceptorRoute rots-authserver; `set` overwrites any client value.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Rots-Backend
                value: authserver
{{- end }}
      backendRefs:
{{- if .Values.authserver.scaleToZero.enabled }}
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
{{- else }}
        - name: rots-authserver
          namespace: {{ $ns }}
          port: 80
{{- end }}
    # No /ws/<k> rule here: httproute-ws.yaml carries them, 16 per route.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
{{- include "game-edge.gates" . }}
{{- if .Values.authserver.scaleToZero.enabled }}
          # Only the /auth rule may select the authserver's InterceptorRoute.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-Rots-Backend]
{{- end }}
      backendRefs:
        - name: anubis
          namespace: {{ $ns }}
          port: 80
---
# http:// -> https:// (one hop). Separate from gateway/john2143-http-to-https,
# which is at the Gateway API cap of 16 hostnames. No backend, so it never wakes
# the pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
