# Renders Secret rots-authserver-secret (envFrom on the authserver) from OpenBao.
# The path holds JSON keys TICKET_SIGNING_KEY, STEAM_API_KEY, DISCORD_CLIENT_ID,
# DISCORD_CLIENT_SECRET, AU2143_CLIENT_ID, AU2143_CLIENT_SECRET, COORDINATOR_TOKEN
# (also read directly by the game servers, which need the internal API's bearer) and
# SETTINGS_TOKEN (the bearer for rots-settings; the same value in prod and preview paths).
# Prod also carries ROTS_S3_ACCESS_KEY / ROTS_S3_SECRET_KEY for rots-sync's replay store
# (docs/2026-11-19-rots-replay-bucket.md); the authserver itself never reads them.
# Until it is seeded this stays SecretSyncedError and the authserver pod waits in
# CreateContainerConfigError; nothing else in the namespace is affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rots-authserver-secret
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rots-authserver-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "authserver.secretKey is required" .Values.authserver.secretKey }}
{{- if .Values.items.enabled }}
---
# Renders Secret rots-items-secret (envFrom on rots-items, one key each on the verifier and the
# authserver): ITEMS_COORDINATOR_TOKEN, the bearer rots-authserver presents on the item server's
# coordinator routes (the item server keeps only the lineage's own credential for the game
# pods); ITEMS_ADMIN_TOKEN for the revoke and query calls; ITEMS_VERIFIER_TOKEN for the
# verifier's job claim. All three are `openssl rand -hex 32`, seeded by hand
# (docs/adding-a-secret.md); ITEMS_COORDINATOR_TOKEN must hold the same value in this path and
# in the authserver path.
# Until it is seeded this stays SecretSyncedError and both rots-items and rots-authserver wait
# in CreateContainerConfigError. That is the intended dependency: the authserver reads
# ITEMS_COORDINATOR_TOKEN from here precisely when items.enabled is set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rots-items-secret
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rots-items-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "items.secretKey is required" .Values.items.secretKey }}
{{- end }}
