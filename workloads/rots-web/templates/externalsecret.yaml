# Renders Secret rots-authserver-secret (envFrom on the authserver) from OpenBao.
# The path holds JSON keys TICKET_SIGNING_KEY, STEAM_API_KEY, DISCORD_CLIENT_ID,
# DISCORD_CLIENT_SECRET, AU2143_CLIENT_ID, AU2143_CLIENT_SECRET. Until it is
# seeded this stays SecretSyncedError and the authserver pod waits in
# CreateContainerConfigError; nothing else in the namespace is affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rots-authserver-secret
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rots-authserver-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "authserver.secretKey is required" .Values.authserver.secretKey }}
