apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rots-web
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  scaleTargetRef:
    name: rots-web
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 1800
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: rots-web
