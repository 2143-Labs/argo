# The HTTPRoute lives in `default` (httproute.yaml); this lets it reach
# rots-authserver and rots-gs-<i> in this namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-rots-services
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
