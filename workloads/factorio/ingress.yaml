apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factorio
  namespace: default
  # Not in LAN DNS: factorio.john2143.com is also the UDP 34197 game address
  # (router dst-nat -> 192.168.6.28). One A record can't serve both, so the LAN
  # gets the public answer and hairpins. docs/lan-dns.md "Exceptions".
  labels:
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
  hostnames:
    - factorio.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: factorio-http
          port: 80
