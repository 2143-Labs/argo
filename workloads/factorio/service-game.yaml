# MetalLB dual-stack LB for the Factorio game port (UDP 34197).
# LAN clients connect to 192.168.6.28:34197 directly (hairpin NAT removed);
# WAN clients reach it via the MikroTik dst-nat on factorio.john2143.com:34197.
apiVersion: v1
kind: Service
metadata:
  name: factorio-game
  namespace: default
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.28,fd00:6::28"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: factorio}
  ports:
    - {port: 34197, targetPort: 34197, protocol: UDP, name: game}
