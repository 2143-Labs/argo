# A deployment for a Factorio server via OFSM (Open Factorio Server Manager):
# web UI on :80 + headless Factorio server on UDP 34197.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio
  labels:
    app: factorio
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factorio
  template:
    metadata:
      labels:
        app: factorio
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - closet
      volumes:
        - name: factorio-saves
          persistentVolumeClaim:
            claimName: factorio-saves-lh
        - name: factorio-configs
          persistentVolumeClaim:
            claimName: factorio-configs-lh
        - name: factorio-fsm-data
          persistentVolumeClaim:
            claimName: factorio-db-lh
        - name: factorio-mod-packs
          persistentVolumeClaim:
            claimName: factorio-mod-packs-lh
      containers:
        - name: factorio
          image: ofsm/ofsm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
            - containerPort: 34197
              protocol: UDP
              name: game
          env:
            # The ofsm/ofsm image entrypoint ignores FSM_MODPACK_DIR /
            # SQ_LITE_DATABASE_FILE (verified against /opt/entrypoint.sh and
            # binary strings). Its real contract: the OFSM sqlite DB + conf
            # live at /opt/fsm-data (hardcoded), the game is installed from
            # FACTORIO_VERSION=latest (image default -> Factorio 2.1.x), and
            # the binary's modpack dir defaults to /opt/fsm/mod_packs.
            # FSM_AUTOSTART is a UI-managed setting; kept for intent.
            - name: FSM_AUTOSTART
              value: "true"
          volumeMounts:
            - mountPath: /opt/factorio/saves/
              name: factorio-saves
            - mountPath: /opt/factorio/config/
              name: factorio-configs
            # OFSM's own data dir (sqlite.db, conf.json, log) — persist on
            # longhorn-2 via factorio-db-lh so admin user/settings survive
            # restarts. The old config mounted /mnt/db which nothing reads.
            - mountPath: /opt/fsm-data
              name: factorio-fsm-data
            # The binary's default modpack dir (log: "/opt/fsm/mod_packs").
            # Same PVC also mounted at the game's mods dir so active mods
            # (e.g. the K2+SE pack) persist across pod restarts.
            - mountPath: /opt/fsm/mod_packs
              name: factorio-mod-packs
            - mountPath: /opt/factorio/mods
              name: factorio-mod-packs
          resources:
            requests:
              memory: "3000Mi"
              cpu: "2"
