# Mirrors the chart-managed exporter's pod shape (apps/appset-kube-state-metrics.yaml,
# chart 8.4.2, image v2.20.0) so both run under the same security posture: non-root,
# read-only root filesystem, no volumes — the process needs no writable path.
#
# Two ports are declared, exactly as the chart does, so pod discovery yields two
# targets per pod; `discovery.relabel "ksm_fast_port"` keeps only the metrics port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics-fast
  namespace: kube-state-metrics-fast
  labels:
    app.kubernetes.io/name: kube-state-metrics-fast
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-fast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics-fast
    spec:
      serviceAccountName: kube-state-metrics-fast
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --port=8080
            - --resources=deployments,statefulsets,namespaces
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
