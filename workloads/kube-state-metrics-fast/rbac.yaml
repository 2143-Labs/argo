# The tracker's fast kube-state-metrics. Deliberately narrow: only the three
# resource types that change on a KEDA wake or a preview create/delete, so the
# gather stays cheap enough to scrape every 3 s (Alloy's ksm_fast job).
#
# A separate namespace is load-bearing: `discovery.kubernetes "ksm"` in
# workloads/alloy/values-prod.yaml admits pods from the `kube-state-metrics`
# namespace only, so the chart-managed exporter and this one never scrape each
# other's targets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics-fast
  namespace: kube-state-metrics-fast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-fast
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-fast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-fast
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics-fast
    namespace: kube-state-metrics-fast
