# bigp nonprod. Identical to values-prod.yaml except secrets.externalSecret.
podAnnotations:
  reloader.stakater.com/auto: "true"
# nonprod: no secrets.externalSecret — the chart generates its own
# crowdsec-lapi-secrets (nonprod is rebuilt weekly; no OpenBao dependency).
agent:
  enabled: false
  hostVarLog: true
  container_runtime: containerd
  acquisition:
    - namespace: kube-system
      podName: "traefik-*"
      program: traefik
appsec:
  enabled: true
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      appsec_config: crowdsecurity/crs-vpatch
      labels:
        type: appsec
  configs:
    crs-vpatch.yaml: |
      name: crowdsecurity/crs-vpatch
      # In-band only: a vpatch match is one 403 for that request, never a ban.
      # The out-of-band CRS pass was removed on 2026-11-28: it scored every request
      # on CRS defaults (allowed methods GET HEAD POST OPTIONS) and turned six
      # ordinary saves in 30 s into a 4 h IP ban on 45 hosts. CI keeps it out:
      # scripts/validations/appsec-no-outofband.sh. docs/public-edge.md.
      default_remediation: ban
      inband_rules:
        - crowdsecurity/base-config
        - crowdsecurity/vpatch-*
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs"
lapi:
  replicas: 1
  persistentVolume:
    data:
      storageClassName: longhorn-2
    config:
      storageClassName: longhorn-2
