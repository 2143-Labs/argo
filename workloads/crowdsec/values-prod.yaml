podAnnotations:
  reloader.stakater.com/auto: "true"
# Let External Secrets own crowdsec-lapi-secrets instead of the chart
# generating it. Setting externalSecret.name makes the chart skip its own
# Secret (templates/lapi-secrets.yaml) and consume this one, so the
# credential lives in OpenBao and ESO renders it under the same name —
# no workload changes. Without this the chart and ESO both manage the
# Secret and the chart wins on every sync.
secrets:
  externalSecret:
    name: crowdsec-lapi-secrets
agent:
  enabled: false
  hostVarLog: true
  container_runtime: containerd
  acquisition:
    - namespace: kube-system
      podName: "traefik-*"
      program: traefik
appsec:
  enabled: true
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      appsec_config: crowdsecurity/crs-vpatch
      labels:
        type: appsec
  configs:
    crs-vpatch.yaml: |
      name: crowdsecurity/crs-vpatch
      default_remediation: ban
      #log_level: debug
      outofband_rules:
        - crowdsecurity/crs
      inband_rules:
        - crowdsecurity/base-config
        - crowdsecurity/vpatch-*
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs"
lapi:
  replicas: 1
  persistentVolume:
    data:
      storageClassName: longhorn-2
    config:
      storageClassName: longhorn-2
