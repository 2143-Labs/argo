apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: litellm
  name: litellm-config
data:
  config.yaml: |
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      store_model_in_db: true
      store_prompts_in_spend_logs: false
    model_list:
      # Local Ollama (office)
      - model_name: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
        litellm_params:
          model: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama/*"
        litellm_params:
          model: "ollama/*"
          api_base: "http://office.ts.2143.me:11434"
      # Google Gemini
      - model_name: "gemini/*"
        litellm_params:
          model: "gemini/*"
          api_key: "os.environ/GEMINI_API_KEY"
      # Google Veo (video generation)
      - model_name: "veo-3.1"
        litellm_params:
          model: "gemini/veo-3.1-generate-preview"
          api_key: "os.environ/GEMINI_API_KEY"
      # DeepSeek
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY"
      # Anthropic (Claude)
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: "os.environ/ANTHROPIC_API_KEY"
      # Claude Code on the Claude Max subscription — OAuth passthrough, per
      # docs.litellm.ai/docs/tutorials/claude_code_max_subscription.
      #
      # Header flow (all verified against the pinned image ghcr.io/berriai/litellm:v1.100.1):
      #   Claude Code sends  Authorization: Bearer sk-ant-oat...   (subscription token)
      #                 and  x-litellm-api-key: Bearer sk-...      (proxy key)
      #   * user_api_key_auth prefers `x-litellm-api-key` over Authorization
      #     (SpecialHeaders.custom_litellm_api_key, proxy/_types.py:4229;
      #      get_api_key() branch order, proxy/auth/user_api_key_auth.py:657).
      #   * clean_headers keeps the OAuth Authorization because litellm did NOT
      #     authenticate with it (proxy/litellm_pre_call_utils.py:911).
      #   * add_provider_specific_headers_to_request scopes it to the anthropic
      #     provider only (proxy/litellm_pre_call_utils.py:3151, called at :1863).
      #   * optionally_handle_anthropic_oauth rewrites it to
      #     `Authorization: Bearer <token>`, adds
      #     `anthropic-beta: oauth-2025-04-20` and
      #     `anthropic-dangerous-direct-browser-access: true`
      #     (llms/anthropic/common_utils.py:92).
      # Do NOT set general_settings.forward_client_headers_to_llm_api for this —
      # it is not needed (the OAuth path above is unconditional) and it would
      # forward every client `x-*` header upstream.
      #
      # Two patterns because Claude Code appends a literal `[1m]` to the model id
      # for 1M-context models (verified in claude-code 2.1.280: picker values
      # `claude-opus-4-8[1m]`, `claude-sonnet-5[1m]`). The longer pattern wins the
      # specificity sort in PatternMatchRouter
      # (litellm/router_utils/pattern_match_deployments.py:36) and its capture
      # group replaces the `*` in litellm_params.model, so the suffix is stripped:
      #   claude-opus-4-8[1m] -> anthropic/claude-opus-4-8
      #   claude-opus-5-5    -> anthropic/claude-opus-5-5
      #
      # Deliberately NO `api_key`: when the client sends an `sk-ant-oat*`
      # Authorization header, optionally_handle_anthropic_oauth
      # (llms/anthropic/common_utils.py:92) takes THAT token and strips any
      # api_key from the request, so the subscription pays.
      #
      # Be aware of the fallback: with no client OAuth token, litellm resolves
      # the credential from the environment instead
      # (AnthropicModelInfo.get_api_key = `api_key or
      # get_secret_str("ANTHROPIC_API_KEY")`, common_utils.py:805-808), i.e. the
      # pod's platform key. That keeps API-key clients working on these names;
      # Assumptions §2 has the fail-closed variant if you would rather error.
      - model_name: "claude-*[1m]"
        litellm_params:
          model: "anthropic/claude-*"
      - model_name: "claude-*"
        litellm_params:
          model: "anthropic/claude-*"
      # OpenAI
      - model_name: "openai/*"
        litellm_params:
          model: "openai/*"
          api_key: "os.environ/OPENAI_API_KEY"
      # ChatGPT subscription (OAuth login — auth.openai.com/codex/device)
      # Request model name is "chatgpt/<slug>", e.g. chatgpt/gpt-5.6-terra.
      # mode: responses is required; /v1/chat/completions is bridged to Responses.
      - model_name: "chatgpt/*"
        model_info:
          mode: responses
        litellm_params:
          model: "chatgpt/*"
      # Explicit per-model entries are required so litellm registers these
      # slugs in model_cost with mode=responses. Without them,
      # supports_native_streaming() returns False (model not in static map)
      # → should_fake_stream=True → litellm strips stream → codex 400
      # "Stream must be set to true".
      - model_name: "chatgpt/gpt-6-astra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-6-astra"
      - model_name: "chatgpt/gpt-5.6-terra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-terra"
      - model_name: "chatgpt/gpt-5.6-sol"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-sol"
      - model_name: "chatgpt/gpt-5.6-luna"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-luna"
      # OpenRouter
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_key: "os.environ/OPENROUTER_API_KEY"

      # Kimi / Moonshot
      - model_name: "moonshot/*"
        litellm_params:
          model: "moonshot/*"
          api_key: "os.environ/MOONSHOT_API_KEY"
    
    litellm_settings:
      drop_params: true
      set_verbose: false
      cache: true
      s3_callback_params:
        s3_region_name: us-east-1
        s3_bucket_name: litellm-spend-logs
        s3_endpoint_url: http://seaweedfs-s3:8333
        s3_aws_access_key_id: "os.environ/S3_ACCESS_KEY"
        s3_aws_secret_access_key: "os.environ/S3_SECRET_KEY"
      success_callback: ["s3_v2"]
      cache_params:
        type: redis
        host: litellm-redis
        port: "6379"
        ttl: 3600
  # Injected onto PYTHONPATH at container start as `sitecustomize`, so every
  # Python interpreter in the pod — the litellm proxy included — imports this
  # module at startup, before litellm configures logging.
  #
  # Why: litellm's DeepSeek handler injects a single-space `reasoning_content`
  # placeholder for every replayed assistant message that has none, and warns
  # once per message per request
  # (litellm/llms/deepseek/chat/transformation.py :: _fill_reasoning_content,
  # called from transform_request). Agent histories are long and ~40% of turns
  # are tool-call turns where DeepSeek thinking is off, so the same messages
  # re-warn on every request: measured 2026-09-16, 5101 of 6115 proxy log lines
  # in one hour (83%) were this one message, which buried real warnings.
  # Upstream bug, open: BerriAI/litellm#37629; fix in PR #37728 (aggregate to
  # one warning per request) is unmerged and not in the pinned image
  # ghcr.io/berriai/litellm:v1.100.1.
  #
  # Scope: drops ONLY that one message, from litellm's `LiteLLM` logger. The
  # placeholder substitution is untouched, so DeepSeek receives exactly the
  # same request bytes as before, and every other litellm log line still
  # prints. The aggregate message PR #37728 will emit has different wording
  # ("...injected single-space reasoning_content placeholders into N assistant
  # messages in this request"), so it is deliberately NOT matched and will log
  # normally.
  #
  # REMOVAL TRIGGER: once the litellm image carries the #37728 fix, delete this
  # key together with the /etc/litellm-pyfilter mount and the PYTHONPATH prefix
  # in deployment.yaml, and bump the image.
  sitecustomize.py: |
    import logging
    import sys

    _NOISE = "DeepSeek thinking mode: assistant message is missing"

    class _DropDeepSeekReasoningPlaceholderNoise(logging.Filter):
        """Drop litellm's per-message DeepSeek placeholder warning (#37629)."""

        def filter(self, record: logging.LogRecord) -> bool:
            try:
                return _NOISE not in record.getMessage()
            except Exception:
                return True  # never swallow a record we cannot inspect

    logging.getLogger("LiteLLM").addFilter(_DropDeepSeekReasoningPlaceholderNoise())
    print(
        "litellm-logfilter: installed on logger 'LiteLLM' "
        "(suppressing the per-message DeepSeek placeholder warning)",
        file=sys.stderr,
    )
