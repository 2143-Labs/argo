apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: litellm
  name: litellm-config
data:
  config.yaml: |
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      store_model_in_db: true
      store_prompts_in_spend_logs: false
    model_list:
      # Local Ollama (office)
      - model_name: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
        litellm_params:
          model: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama/*"
        litellm_params:
          model: "ollama/*"
          api_base: "http://office.ts.2143.me:11434"
      # Google Gemini
      - model_name: "gemini/*"
        litellm_params:
          model: "gemini/*"
          api_key: "os.environ/GEMINI_API_KEY"
      # Google Veo (video generation)
      - model_name: "veo-3.1"
        litellm_params:
          model: "gemini/veo-3.1-generate-preview"
          api_key: "os.environ/GEMINI_API_KEY"
      # DeepSeek
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY"
      # Anthropic (Claude)
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: "os.environ/ANTHROPIC_API_KEY"
      # OpenAI
      - model_name: "openai/*"
        litellm_params:
          model: "openai/*"
          api_key: "os.environ/OPENAI_API_KEY"
      # ChatGPT subscription (OAuth login — auth.openai.com/codex/device)
      # Request model name is "chatgpt/<slug>", e.g. chatgpt/gpt-5.6-terra.
      # mode: responses is required; /v1/chat/completions is bridged to Responses.
      - model_name: "chatgpt/*"
        model_info:
          mode: responses
        litellm_params:
          model: "chatgpt/*"
      # Explicit per-model entries are required so litellm registers these
      # slugs in model_cost with mode=responses. Without them,
      # supports_native_streaming() returns False (model not in static map)
      # → should_fake_stream=True → litellm strips stream → codex 400
      # "Stream must be set to true".
      - model_name: "chatgpt/gpt-6-astra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-6-astra"
      - model_name: "chatgpt/gpt-5.6-terra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-terra"
      - model_name: "chatgpt/gpt-5.6-sol"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-sol"
      - model_name: "chatgpt/gpt-5.6-luna"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-luna"
      # OpenRouter
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_key: "os.environ/OPENROUTER_API_KEY"

      # Kimi / Moonshot
      - model_name: "moonshot/*"
        litellm_params:
          model: "moonshot/*"
          api_key: "os.environ/MOONSHOT_API_KEY"
    
    litellm_settings:
      drop_params: true
      set_verbose: false
      cache: true
      s3_callback_params:
        s3_region_name: us-east-1
        s3_bucket_name: litellm-spend-logs
        s3_endpoint_url: http://seaweedfs-s3:8333
        s3_aws_access_key_id: "os.environ/S3_ACCESS_KEY"
        s3_aws_secret_access_key: "os.environ/S3_SECRET_KEY"
      success_callback: ["s3_v2"]
      cache_params:
        type: redis
        host: litellm-redis
        port: "6379"
        ttl: 3600
