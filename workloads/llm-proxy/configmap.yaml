apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: litellm
  name: litellm-config
data:
  config.yaml: |
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      store_model_in_db: true
      store_prompts_in_spend_logs: false
    model_list:
      # Local Ollama (office)
      - model_name: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
        litellm_params:
          model: "ollama/huihui_ai/qwen3-vl-abliterated:8b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama/*"
        litellm_params:
          model: "ollama/*"
          api_base: "http://office.ts.2143.me:11434"
      # Gemma 4 family on the same office Ollama. These MUST use the
      # `ollama_chat/` provider, not `ollama/`: litellm's `ollama/` prefix is
      # the *completion* provider and posts to Ollama's /api/generate, which
      # flattens the whole conversation into a single `### System:` /
      # `### User:` blob (no chat framing, no turn markers) and silently drops
      # `tools`. Gemma 4's chat framing and tool channel only exist on
      # /api/chat — the tags ship `TEMPLATE {{ .Prompt }}` + `RENDERER gemma4`,
      # and the renderer is only applied on the chat path. On /api/generate an
      # agent system prompt therefore reaches the model as raw text with no
      # tool definitions, and it answers with invented pseudo-tool-call text
      # or bare JSON envelopes like {"response": "..."}.
      # `ollama_chat/` forwards full messages, `tools` and `think` to
      # /api/chat (litellm/llms/ollama/chat/transformation.py).
      # Explicit per-tag entries rather than an `ollama_chat/gemma4:*`
      # wildcard: litellm's /model_info wildcard expansion
      # (expand_wildcard_deployments_for_model_info ->
      # get_known_models_from_wildcard) treats the text before `*` as a prefix
      # and fabricates names like `ollama_chat/gemma4:llama2`, which OMP's
      # discovery would then offer as selectable models. The `ollama/*`
      # wildcard above is completion-only, so pin any new gemma4 tag here
      # rather than relying on it.
      # Capabilities from `ollama show` on office: completion, vision, tools,
      # thinking (e2b/e4b/12b/latest also advertise audio). Context is the
      # tag's native window: 131072 for e2b/e4b/latest, 262144 for the rest.
      - model_name: "ollama_chat/gemma4:e4b"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 131072
        litellm_params:
          model: "ollama_chat/gemma4:e4b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama_chat/gemma4:e2b"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 131072
        litellm_params:
          model: "ollama_chat/gemma4:e2b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama_chat/gemma4:12b"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 262144
        litellm_params:
          model: "ollama_chat/gemma4:12b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama_chat/gemma4:26b"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 262144
        litellm_params:
          model: "ollama_chat/gemma4:26b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama_chat/gemma4:31b"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 262144
        litellm_params:
          model: "ollama_chat/gemma4:31b"
          api_base: "http://office.ts.2143.me:11434"
      - model_name: "ollama_chat/gemma4:latest"
        model_info:
          supports_vision: true
          supports_function_calling: true
          max_input_tokens: 131072
        litellm_params:
          model: "ollama_chat/gemma4:latest"
          api_base: "http://office.ts.2143.me:11434"
      # Google Gemini
      - model_name: "gemini/*"
        litellm_params:
          model: "gemini/*"
          api_key: "os.environ/GEMINI_API_KEY"
      # Google Veo (video generation)
      - model_name: "veo-3.1"
        litellm_params:
          model: "gemini/veo-3.1-generate-preview"
          api_key: "os.environ/GEMINI_API_KEY"
      # DeepSeek — two home keys balanced 50/50, one backup key behind them.
      #
      # `weight` drives simple-shuffle: equal weights split requests evenly and
      # `weight: 0` means "never picked by the shuffle", so the backup is only
      # reachable through the weighted failover enabled in router_settings below.
      # Measured on the pinned image ghcr.io/berriai/litellm:v1.108.1: 200
      # selections split 103/97 across the two live keys with zero backup picks.
      #
      # Do NOT express "primary, then backup" with `order` tiers here. Order
      # escalation fires on the first failure *inside* a tier, so with one of the
      # two balanced keys dead, that key's whole share went to the backup even
      # though its sibling was healthy (measured 11 backup / 19 sibling over 30
      # calls). Weighted failover re-picks among the other deployments at the same
      # tier first and reaches the backup only when no weight-bearing key is left
      # (measured: one key dead -> 30/30 sibling, both dead -> 30/30 backup).
      #
      # `router_settings.enable_weighted_failover` is load-bearing, not tuning.
      # Without it the generic retry re-picks at random, so a dead key still failed
      # 8 of 30 calls and both-dead failed 30/30 without ever trying the backup.
      #
      # Cooldown on a failed key is the router default (5s), shared across both
      # replicas through litellm-redis; a drained key costs at most one failed
      # attempt per 5s window. Keys are benched on 401/402/404/408/429 and 5xx
      # (litellm/router_utils/cooldown_handlers.py, _is_cooldown_required), which
      # covers DeepSeek's 402 "Insufficient Balance".
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY1"
          weight: 1
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY2"
          weight: 1
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY_BACKUP1"
          weight: 0
      # Org / lab traffic stays on its own key, cordoned by model-group name:
      # callers ask for `deepseek-labs/<model>` and `deepseek/*` stays home-only, so
      # spend logs, budgets and failover decisions never mix the two accounts.
      # `deepseek-labs/*` is the longer pattern, so PatternMatchRouter's
      # specificity sort (litellm/router_utils/pattern_match_deployments.py)
      # routes it here and `deepseek/*` (regex `deepseek/(.*)`) cannot match it.
      # Left unordered on purpose: one deployment, so there is nothing to fail over
      # to and a cooldown would only turn an upstream error into "no deployments".
      - model_name: "deepseek-labs/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "os.environ/DEEPSEEK_API_KEY_LABS"
      # Anthropic (Claude)
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: "os.environ/ANTHROPIC_API_KEY"
      # Claude Code on the Claude Max subscription — OAuth passthrough, per
      # docs.litellm.ai/docs/tutorials/claude_code_max_subscription.
      #
      # Header flow (all verified against the pinned image ghcr.io/berriai/litellm:v1.108.1):
      #   Claude Code sends  Authorization: Bearer sk-ant-oat...   (subscription token)
      #                 and  x-litellm-api-key: Bearer sk-...      (proxy key)
      #   * user_api_key_auth prefers `x-litellm-api-key` over Authorization
      #     (SpecialHeaders.custom_litellm_api_key, proxy/_types.py;
      #      get_api_key() branch order, proxy/auth/user_api_key_auth.py).
      #   * clean_headers keeps the OAuth Authorization because litellm did NOT
      #     authenticate with it (proxy/litellm_pre_call_utils.py).
      #   * add_provider_specific_headers_to_request scopes it to the anthropic
      #     provider only (proxy/litellm_pre_call_utils.py).
      #   * optionally_handle_anthropic_oauth rewrites it to
      #     `Authorization: Bearer <token>`, adds
      #     `anthropic-beta: oauth-2025-04-20` and
      #     `anthropic-dangerous-direct-browser-access: true`
      #     (llms/anthropic/common_utils.py).
      # Do NOT set general_settings.forward_client_headers_to_llm_api for this —
      # it is not needed (the OAuth path above is unconditional) and it would
      # forward every client `x-*` header upstream.
      #
      # Two patterns because Claude Code appends a literal `[1m]` to the model id
      # for 1M-context models (verified in claude-code 2.1.280: picker values
      # `claude-opus-4-8[1m]`, `claude-sonnet-5[1m]`). The longer pattern wins the
      # specificity sort in PatternMatchRouter
      # (litellm/router_utils/pattern_match_deployments.py) and its capture
      # group replaces the `*` in litellm_params.model, so the suffix is stripped:
      #   claude-opus-4-8[1m] -> anthropic/claude-opus-4-8
      #   claude-opus-5-5    -> anthropic/claude-opus-5-5
      #
      # Fail-closed on purpose: these groups exist only for the official
      # Claude Code client, which always sends an `sk-ant-oat*` Authorization
      # header. optionally_handle_anthropic_oauth (llms/anthropic/common_utils.py)
      # replaces this literal with that token, so the subscription pays; with no
      # client OAuth token the literal is sent as x-api-key and Anthropic
      # answers 401. That is deliberate: the previous behaviour fell back to the
      # pod's platform ANTHROPIC_API_KEY silently, so a misconfigured or expired
      # client billed API usage without saying so. Non-Claude-Code clients (OMP)
      # use the separate `claude-api-*` group below.
      #
      # `/v1/messages/count_tokens` cannot carry the client OAuth token (the
      # endpoint builds its request from the body only), so it hits the same 401
      # and LiteLLM falls back to a local token estimate
      # (proxy_server.py count_request_tokens -> count_source: local_estimate).
      # Claude Code still gets a count; it is an estimate, not Anthropic's.
      - model_name: "claude-*[1m]"
        litellm_params:
          model: "anthropic/claude-*"
          api_key: "oauth-only"
      - model_name: "claude-*"
        litellm_params:
          model: "anthropic/claude-*"
          api_key: "oauth-only"
      # API-key route for non-Claude-Code clients (OMP). The distinct prefix is
      # load-bearing: an exact `claude-opus-*` deployment would win the exact
      # match over these patterns and capture Claude Code's own requests, and
      # the API key would pay for them. `claude-api-*` is longer than
      # `claude-*`, and patterns sort by descending length
      # (PatternUtils.calculate_pattern_specificity), so it wins. Capture
      # substitution turns `claude-api-opus-5-5` into
      # `anthropic/claude-opus-5-5`.
      - model_name: "claude-api-*"
        litellm_params:
          model: "anthropic/claude-*"
          api_key: "os.environ/ANTHROPIC_API_KEY"
      # OpenAI
      - model_name: "openai/*"
        litellm_params:
          model: "openai/*"
          api_key: "os.environ/OPENAI_API_KEY"
      # ChatGPT subscription (OAuth login — auth.openai.com/codex/device)
      # Request model name is "chatgpt/<slug>", e.g. chatgpt/gpt-5.6-terra.
      # mode: responses is required; /v1/chat/completions is bridged to Responses.
      - model_name: "chatgpt/*"
        model_info:
          mode: responses
        litellm_params:
          model: "chatgpt/*"
      # Explicit per-model entries are required so litellm registers these
      # slugs in model_cost with mode=responses. Without them,
      # supports_native_streaming() returns False (model not in static map)
      # → should_fake_stream=True → litellm strips stream → codex 400
      # "Stream must be set to true".
      - model_name: "chatgpt/gpt-6-astra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-6-astra"
      - model_name: "chatgpt/gpt-5.6-terra"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-terra"
      - model_name: "chatgpt/gpt-5.6-sol"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-sol"
      - model_name: "chatgpt/gpt-5.6-luna"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-5.6-luna"
      - model_name: "chatgpt/gpt-6-sol"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-6-sol"
      - model_name: "chatgpt/gpt-6-luna"
        model_info:
          mode: responses
          supports_native_streaming: true
        litellm_params:
          model: "chatgpt/gpt-6-luna"
      # OpenRouter
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_key: "os.environ/OPENROUTER_API_KEY"

      # Kimi / Moonshot
      - model_name: "moonshot/*"
        litellm_params:
          model: "moonshot/*"
          api_key: "os.environ/MOONSHOT_API_KEY"
    
    router_settings:
      # Re-pick inside the requested model group after a failure instead of
      # failing the request or jumping to another model. This is what makes the
      # `weight: 0` deepseek backup reachable (see the deepseek block in
      # model_list) and what keeps one dead balanced key from leaking its share to
      # that backup. Async-only, which is every proxy call path
      # (litellm/router.py, _maybe_run_weighted_failover; accepted as a
      # router_settings key in litellm/constants.py ROUTER_SETTINGS_KEYS).
      enable_weighted_failover: true

    litellm_settings:
      drop_params: true
      set_verbose: false
      cache: true
      s3_callback_params:
        s3_region_name: us-east-1
        s3_bucket_name: litellm-spend-logs
        s3_endpoint_url: http://seaweedfs-s3:8333
        s3_aws_access_key_id: "os.environ/S3_ACCESS_KEY"
        s3_aws_secret_access_key: "os.environ/S3_SECRET_KEY"
      success_callback: ["s3_v2"]
      # Serve request/response content in the UI from the S3 spend-log archive.
      # With store_prompts_in_spend_logs=false (line 12) Postgres keeps only "{}"
      # placeholders plus a ~60-byte metadata.cold_storage_object_key per row, and
      # /spend/logs/ui/{request_id} downloads the real payload from that object
      # (proxy/spend_tracking/spend_management_endpoints.py,
      # _resolve_request_response_payload -> ColdStorageHandler).
      #
      # REQUIRES one S3 object per request: retrieval is by object key. Do NOT add
      # s3_batch_file_upload to s3_callback_params above — litellm ignores it and
      # warns on every flush when s3_v2 is the cold storage logger
      # (integrations/s3_v2.py, _batch_file_mode_active). Do not set
      # s3_use_team_prefix / s3_use_key_prefix either: the row key is built with
      # prefix="" (litellm_core_utils/litellm_logging.py,
      # _generate_cold_storage_object_key) and would stop matching the object path.
      cold_storage_custom_logger: s3_v2
      cache_params:
        type: redis
        host: litellm-redis
        port: "6379"
        ttl: 3600
  # Injected onto PYTHONPATH at container start as `sitecustomize`, so every
  # Python interpreter in the pod — the litellm proxy included — imports this
  # module at startup, before litellm configures logging.
  #
  # Why: litellm's DeepSeek handler injects a single-space `reasoning_content`
  # placeholder for every replayed assistant message that has none, and warns
  # once per message per request
  # (litellm/llms/deepseek/chat/transformation.py :: _fill_reasoning_content,
  # called from transform_request). Agent histories are long and ~40% of turns
  # are tool-call turns where DeepSeek thinking is off, so the same messages
  # re-warn on every request: measured 2026-09-16, 5101 of 6115 proxy log lines
  # in one hour (83%) were this one message, which buried real warnings.
  # Upstream issue BerriAI/litellm#37629 was closed on 2026-10-20 without the
  # aggregation fix: PR #37728 was closed unmerged and the per-message warning
  # is still present in the pinned image ghcr.io/berriai/litellm:v1.108.1
  # (litellm/llms/deepseek/chat/transformation.py, _fill_reasoning_content,
  # line 89).
  #
  # Scope: drops ONLY that one message, from litellm's `LiteLLM` logger. The
  # placeholder substitution is untouched, so DeepSeek receives exactly the
  # same request bytes as before, and every other litellm log line still
  # prints. The aggregate message PR #37728 will emit has different wording
  # ("...injected single-space reasoning_content placeholders into N assistant
  # messages in this request"), so it is deliberately NOT matched and will log
  # normally.
  #
  # REMOVAL TRIGGER: once the litellm image carries the #37728 fix, delete this
  # key together with the /etc/litellm-pyfilter mount and the PYTHONPATH prefix
  # in deployment.yaml, and bump the image.
  sitecustomize.py: |
    import logging
    import sys

    _NOISE = "DeepSeek thinking mode: assistant message is missing"

    class _DropDeepSeekReasoningPlaceholderNoise(logging.Filter):
        """Drop litellm's per-message DeepSeek placeholder warning (#37629)."""

        def filter(self, record: logging.LogRecord) -> bool:
            try:
                return _NOISE not in record.getMessage()
            except Exception:
                return True  # never swallow a record we cannot inspect

    logging.getLogger("LiteLLM").addFilter(_DropDeepSeekReasoningPlaceholderNoise())
    print(
        "litellm-logfilter: installed on logger 'LiteLLM' "
        "(suppressing the per-message DeepSeek placeholder warning)",
        file=sys.stderr,
    )
