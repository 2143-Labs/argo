apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
spec:
  instances: 2
  affinity:
    # Two copies of a database on one node is no protection at all, and every
    # instance volume here is single-replica (longhorn-cnpg), so the copy on the
    # other node is the only thing keeping the data available during a node loss.
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Same placement policy as the rots/odoo clusters: never on nas (its RAM is
    # reserved for the host and the storage pods only it can run), arch (no new
    # Longhorn volumes, disk below the 25% floor), pite (arm64) or office (wifi
    # taint; the validating policy denies storage-backed pods).
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [arch, nas, pite, office]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [big, closet]
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 25Gi
    storageClass: longhorn-cnpg
  walStorage:
    size: 8Gi
    storageClass: longhorn-cnpg
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-password
  postgresql:
    pg_hba:
      - host all all 0.0.0.0/0 scram-sha-256
  # Continuous WAL archiving + base backups offsite via ObjectStore litellm-db-offsite
  # (offsite-backup.yaml). docs/db-backups.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: litellm-db-offsite
