apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: litellm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.108.1
          ports:
            - containerPort: 4000
              protocol: TCP
              name: http
          env:
            - name: PROXY_BASE_URL
              value: "https://llm.2143.me"
            - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
              value: "true"
            # The litellm-logfilter ConfigMap key is imported as
            # `sitecustomize` at interpreter startup (see the /etc/litellm-pyfilter
            # mount below). Remove this prefix, that mount and the ConfigMap key
            # only when a released image carries the aggregation fix for
            # BerriAI/litellm#37629: PR #37728 was closed unmerged, so re-check
            # on every image bump. Re-checked on v1.108.1 (2026-11-06): the
            # per-message warning is unchanged (transformation.py:89), so the
            # filter stays.
            - name: PYTHONPATH
              value: "/etc/litellm-pyfilter:/usr/lib/python3.13/site-packages"
            # Migrations run at startup on purpose. They were disabled on
            # 2026-09-07 (commit 03cff79) because the boot-time migrate was slow
            # enough that the liveness probe killed the pod in a loop; the
            # startupProbe below (3600s grace) is what actually fixed that, and
            # it is still in place.
            #
            # Keeping them disabled is what broke 2026-09-13..16: the v1.92.0 ->
            # v1.100.1 bump left 29 migrations unapplied, so every spend, budget
            # and DB-backed config write failed silently for 3 days until the
            # schema was migrated by hand. The image is the only thing that
            # carries the schema version, so the schema has to move with it —
            # including when the image-bump bot updates this file.
            #
            # v1.100.1 -> v1.106.6 (2026-10-30) carries 52 new migrations. The
            # v2 migration resolver is the default now and the image exits
            # non-zero when database setup fails, so the two CLI flags that used
            # to select those behaviours were removed.
            #
            # v1.106.6 -> v1.108.0 (2026-11-05) carries 7, all additive —
            # CREATE TABLE / ADD COLUMN ... IF NOT EXISTS only, nothing on
            # LiteLLM_SpendLogs: daily gateway failed-request and request-error
            # rollups, user provider credentials, telemetry reports (the
            # LITELLM_TELEMETRY_* exporter stays off unless groups are set, so
            # the table stays empty), access-group MCP tool permissions and
            # skill names, and managed-object end_user_id. Verified by booting
            # the image twice concurrently against an empty database: 220
            # migrations, no deadlock, both replicas healthy.
            # The default is still the v2 resolver; `--use_v2_migration_resolver`
            # is accepted but ignored and `--use_legacy_migration_resolver`
            # opts back into v1.
            #
            # v1.108.0 -> v1.108.1 (2026-11-06) carries none: it is an LTS
            # backport (21 cherry-picks onto lts/1.108.x, mostly router
            # cooldown, spend-log query cancellation and anthropic count_tokens
            # fixes) with an unchanged migration set, so the schema on the
            # cluster is already the target state.
            # `false` (not deletion) so it also overrides any inherited value.
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            # Default per-Prisma-command timeout is 60s; a 29-migration catch-up
            # (with DDL on LiteLLM_SpendLogs, ~509k rows) can exceed it, and a
            # prisma process killed mid-migration leaves a failed migration in
            # the ledger that blocks every later boot.
            - name: LITELLM_PRISMA_COMMAND_TIMEOUT
              value: "1800"
            # The worst catch-up so far (52 migrations) can outlive the 600s
            # default lock wait while the sibling replica holds the migration
            # lock; the 7-migration v1.108.0 catch-up is far below that, but the
            # timeout is sized for the next large bump.
            - name: LITELLM_MIGRATION_LOCK_TIMEOUT
              value: "1800"
            - name: CHATGPT_TOKEN_DIR
              value: /litellm/chatgpt
            # CNPG's authoritative credential: this cluster defines a managed role
            # with passwordSecret litellm-db-password, which is the secret CNPG
            # itself reads. Do NOT use litellm-db-app here: its password is the
            # initdb-generated one and no longer authenticates (verified
            # 2026-09-13: FATAL password authentication failed for user
            # "litellm", while litellm-db-password authenticates AUTH_OK).
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-password
                  key: password
            - name: DATABASE_URL
              value: postgresql://litellm:$(DB_PASSWORD)@litellm-db-rw:5432/litellm
          envFrom:
            - secretRef:
                name: litellm-secrets
            - secretRef:
                name: litellm-s3-creds
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: chatgpt-auth
              mountPath: /litellm/chatgpt
            - name: config
              mountPath: /etc/litellm-pyfilter
              readOnly: true
          command:
            - sh
            - "-c"
            - "apk add --no-cache py3-pillow && sed -i 's/if billable_users and billable_users > 5:/if False:/' /app/.venv/lib/python3.13/site-packages/litellm/proxy/management_endpoints/ui_sso.py && exec litellm --config /app/config.yaml --port 4000 --host 0.0.0.0"
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            failureThreshold: 360
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 4Gi
            limits:
              cpu: 1000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 70
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: litellm-chatgpt-auth
