# One-shot Prisma schema migration for the LiteLLM proxy.
#
# Why this exists: the Deployment runs with DISABLE_SCHEMA_UPDATE=true
# (deployment.yaml), so the proxy never applies the Prisma migrations that ship
# inside the litellm image. An image bump therefore moves the code ahead of the
# DB schema with nothing to close the gap — 2026-09-13's v1.92.0 -> v1.100.1
# bump left 29 migrations unapplied and every spend/budget/config DB write
# failing until this Job fixed it.
#
# Verified 2026-09-16: image v1.100.1 ships 161 migrations, the DB had 132
# applied. All pending migrations are additive (ADD COLUMN / CREATE TABLE /
# CREATE INDEX / FK), so this is safe against a live proxy and stays
# backwards-compatible if the image is ever rolled back.
#
# WHY THIS IS NOT AN ARGOCD HOOK: hooks are excluded from the app's diff, so a
# hook-only commit leaves the Application "Synced" and auto-sync never fires an
# operation — the hook would sit unexecuted forever (observed: revision
# 079eecf showed Synced with no new operationState and no Job). A plain,
# diff-visible Job is what makes auto-sync create it.
#
# Bump this Job's image together with deployment.yaml's image on every litellm
# upgrade: the image is what changes the Job's spec, which is what makes Argo
# replace it and re-run the migration. A finished Job whose spec still matches
# is left alone, so this does not re-run on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-prisma-migrate
  # NOT `app: litellm` — the litellm Service selects that label and would
  # otherwise add this short-lived pod as a dead endpoint.
  labels:
    app: litellm-migrate
  annotations:
    # Migrate before the Deployment is applied (sync-wave 0) on version bumps.
    argocd.argoproj.io/sync-wave: "-1"
    # A Job's spec.template is immutable, so bumping the image is not a patch:
    # Replace makes Argo CD send a full manifest, Force lets it delete and
    # re-create the Job when that update hits an immutable field. Without
    # Force the sync fails with "spec.template: field is immutable" and the
    # migration never re-runs.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  # Declared explicitly because the Replace path sends a full manifest and the
  # API server rejects a Job whose spec.selector is absent ("spec.selector:
  # Required value ... field is immutable"). The normal create path would have
  # defaulted this to a controller-uid selector.
  selector:
    matchLabels:
      app: litellm-migrate
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: litellm-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/berriai/litellm:v1.100.1
          # Deliberately no --config: the migration path is driven entirely by
          # DATABASE_URL, so this needs no provider keys, no configmap mount and
          # no ChatGPT token volume.
          command:
            - sh
            - "-c"
            # --skip_server_startup           run DB setup, then exit
            # --use_v2_migration_resolver     skip the diff-and-force recovery
            #   path the vendor warns thrashes schemas
            # --enforce_prisma_migration_check  exit non-zero if setup fails
            #   (without it, LiteLLM logs a warning and exits 0 — a silent no-op)
            - >-
              exec litellm --skip_server_startup
              --use_v2_migration_resolver
              --enforce_prisma_migration_check
          env:
            # Must be explicit: it wins over anything inherited, and a `true`
            # here would turn this Job into a silent no-op.
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            # The default per-Prisma-command timeout is 60s. The first run has to
            # apply 29 migrations, including DDL on LiteLLM_SpendLogs (~509k
            # rows); killing prisma mid-migration leaves a failed migration in
            # the ledger.
            - name: LITELLM_PRISMA_COMMAND_TIMEOUT
              value: "900"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-password
                  key: password
            - name: DATABASE_URL
              value: postgresql://litellm:$(DB_PASSWORD)@litellm-db-rw:5432/litellm
          # The LiteLLM CLI imports the whole proxy stack before it reaches the
          # Prisma step; 1Gi OOMKilled it mid-startup (2026-09-16). Match the
          # Deployment's 4Gi ceiling.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 4Gi