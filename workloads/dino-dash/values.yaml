# Every empty string is set by apps/dino-dash.yaml (prod), apps/dino-dash-dev.yaml
# (dev) or apps/dino-dash-preview.yaml (one per labeled PR); the templates fail
# to render if any is empty.
namespace: ""   # dino-prod, dino-dev or dino-pr-<N>
host: ""        # dino.dsstar.us, dino-dev.dsstar.us or dino-<N>.dsstar.us
routeName: ""   # unique in `default`: dino-dash, dino-dev or dino-pr-<N>
image:
  repository: ghcr.io/2143-labs/dino-dash
  # sha-<full commit sha>: the game repo's deploy.yml pushes web-<tag> and
  # server-<tag> once per build and never overwrites them.
  tag: ""
gameserver:
  # The client knows exactly one /ws URL and the server has no /servers
  # discovery endpoint, so a second replica would be unreachable without new
  # client code. Raise this only alongside that feature. With scaleToZero this is the
  # ScaledObject's maxReplicaCount.
  replicas: 1
  # Run the world server only while humans are around (KEDA HTTP add-on). /ws then
  # goes through the KEDA interceptor, which holds the WebSocket upgrade while the
  # server cold-starts (~10 s: ~3 s world generation, then the readiness probe) and
  # counts each open WebSocket as one in-flight request for its whole lifetime, so
  # in-server NPCs never keep it up and connected players always do. A page view
  # also wakes it (requestRate on the web route), so it is usually ready before
  # PLAY. Every cold start is a fresh world (positions, leaderboard, NPCs).
  scaleToZero:
    enabled: true
    # Seconds with no open /ws socket and no page view (the rate window adds
    # ~1 min) before the server scales to zero.
    idleSeconds: 300
  # The socket peer seen by the server is Traefik, not the player, so the
  # built-in per-IP cap of 3 would throttle the whole world to three clients.
  maxConnPerIp: "100"
  worldSeed: "1337"
  # In-server artificial players (bots), on in every environment. Pinned to the
  # values the server derived on its own at deploy time (npc/population.ts) so
  # they are visible and overridable per Application; a world-size change in the
  # game no longer moves the target by itself.
  npc:
    enabled: true
    target: "96"      # real + artificial players the governor aims for
  softCap: "80"       # NPCs fill up to here; real players can still join past it
  maxPlayers: "100"   # hard cap, real + artificial
  # Debug mode (PRIMAL_DEBUG=1): Settings > ADMIN respawn at L4.9/9.9/14.9 and reset, the title
  # START AT L4 button, NPC population logs. dino-dev and PR previews only; never prod.
  debug: false

# Link previews (helm_modules/game-edge): the Open Graph payload the Anubis
# challenge page carries for clients that cannot solve a challenge (Discord,
# Slack, Telegram, ...). Only dino ships a raster, so only dino gets an og:image;
# the image path must be under /icons/, which is the one path the policy ALLOWs.
# The copy is lifted verbatim from the per-chart policy this replaces.
embed:
  title: "PRIMAL — Hatch. Hunt. Hide. Evolve."
  siteName: PRIMAL
  description: "A multiplayer browser .io game about dinosaur evolution: hatch as a tiny raptor, eat what you can, hide from what you cannot, and grow through the species chain."
  image: /icons/icon-512.png
  imageWidth: 512
  imageHeight: 512
  imageAlt: "An adult raptor hunting by firelight in the Deep Jungle at night"
