# The world process (Dino-Dash flake `packages.server`): one 20 Hz sim with
# memory-only world state, no database and no accounts. With
# gameserver.scaleToZero.enabled the ScaledObject owns `replicas` (0 while nobody
# is connected or browsing, see values.yaml); otherwise it is always on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dino-dash-server
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app: dino-dash-server
spec:
  revisionHistoryLimit: 3
{{- if not .Values.gameserver.scaleToZero.enabled }}
  replicas: {{ .Values.gameserver.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: dino-dash-server
  template:
    metadata:
      labels:
        app: dino-dash-server
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: dino-dash-server
          image: "{{ .Values.image.repository }}:server-{{ required "image.tag is required" .Values.image.tag }}"
          # Tags are immutable (server-sha-<commit>); a new build means a new tag in the Application.
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: &wsport 8787
              name: ws

          env:
            - name: PORT
              value: "8787"
            # Traefik is the peer, so the per-IP connection cap must be well above
            # the number of players in one house.
            - name: MAX_CONN_PER_IP
              value: {{ .Values.gameserver.maxConnPerIp | quote }}
            - name: WORLD_SEED
              value: {{ .Values.gameserver.worldSeed | quote }}
            # In-server bots: real + artificial target, soft and hard caps (values.yaml).
            - name: PRIMAL_NO_NPC
              value: {{ ternary "0" "1" .Values.gameserver.npc.enabled | quote }}
            - name: PRIMAL_NPC_TARGET
              value: {{ .Values.gameserver.npc.target | quote }}
            - name: SOFT_CAP
              value: {{ .Values.gameserver.softCap | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.gameserver.maxPlayers | quote }}

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

          # The server is a bare WebSocketServer with no HTTP endpoint, so the
          # probes are TCP connects (a full HTTP probe would 404).
          startupProbe:
            tcpSocket:
              port: *wsport
            periodSeconds: 5
            failureThreshold: 36

          livenessProbe:
            tcpSocket:
              port: *wsport
            periodSeconds: 10
            failureThreshold: 6

          readinessProbe:
            tcpSocket:
              port: *wsport
            periodSeconds: 5
            failureThreshold: 3
