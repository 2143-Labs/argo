# Owned by the Application so closing a PR prunes the namespace too. Argo's
# CreateNamespace=true would otherwise leave an empty namespace behind.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace is required" .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: dino-dash
