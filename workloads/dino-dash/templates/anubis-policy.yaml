{{- $ns := required "namespace is required" .Values.namespace }}
{{- $host := required "host is required" .Values.host }}
# Anubis policy for this environment: the stock policy plus the two settings
# that make a link preview work on a site that challenges every Firefox-shaped
# user agent (docs/public-edge.md, "Link previews").
#
# `override` prints these tags on the challenge page instead of fetching the
# page from the backend. That keeps an unfurl working while the world is scaled
# to zero, and stops any bot from making Anubis load the game.
#
# The preview image is allowed through because an unfurler's image fetch carries
# the same Mozilla user agent and would otherwise be challenged; it is one
# static PNG the page already ships to every visitor.
#
# The same tags are in the game repo's index.html for clients Anubis does not
# challenge (search engines, non-Mozilla unfurlers). Keep the two in step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-policy
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  policy.yaml: |
    bots:
      - import: (data)/meta/default-config.yaml
      - name: link-preview-image
        path_regex: ^/og[.]png$
        action: ALLOW
    dnsbl: false

    openGraph:
      enabled: true
      ttl: 1h
      override:
        "og:type": "website"
        "og:site_name": "PRIMAL"
        "og:title": "PRIMAL — Hatch. Hunt. Hide. Evolve."
        "og:description": "A multiplayer browser .io game about dinosaur evolution: hatch as a tiny raptor, eat what you can, hide from what you cannot, and grow through the species chain."
        "og:image": "https://{{ $host }}/og.png"
        "og:image:type": "image/png"
        "og:image:width": "1200"
        "og:image:height": "630"
        "og:image:alt": "An adult raptor hunting by firelight in the Deep Jungle at night"
        "twitter:card": "summary_large_image"
        "description": "A multiplayer browser .io game about dinosaur evolution: hatch as a tiny raptor, eat what you can, hide from what you cannot, and grow through the species chain."
