apiVersion: v1
kind: Service
metadata:
  name: dino-dash-server
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app: dino-dash-server
spec:
  type: ClusterIP
  selector:
    app: dino-dash-server
  ports:
    - port: 80
      targetPort: ws
      protocol: TCP
      name: ws
