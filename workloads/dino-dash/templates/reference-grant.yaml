{{- if not .Values.gameserver.scaleToZero.enabled }}
# The HTTPRoute lives in `default` (httproute.yaml); this lets it reach
# dino-dash-server in this namespace (only needed while /ws bypasses the
# KEDA interceptor).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-dino-services
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
{{- end }}
