apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: dino-dash-web
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  target:
    service: dino-dash-web
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>PRIMAL is starting</title>
          <meta name="theme-color" content="#1e1828">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#1e1828;color-scheme:dark}
          body{display:grid;place-items:center;text-align:center;
               font-family:"Silkscreen","Courier New",monospace;color:#f4edd8}
          .box{border:2px solid #d9cfb0;padding:22px 26px}
          h1{margin:0 0 .6rem;font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
          .tag{margin:0 0 .9rem;font-size:11px;letter-spacing:.16em;color:#d9cfb0;text-transform:uppercase}
          p{margin:0;font-size:11px;line-height:1.6;color:#a79bb0}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:0 auto 12px;
                border:2px solid rgba(217,207,176,.25);border-top-color:#d9cfb0;
                animation:spin .7s linear infinite}
          .bar{height:2px;margin:14px 0 0;background:rgba(217,207,176,.25);overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#d9cfb0;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>PRIMAL is starting...</h1>
          <p class="tag">HATCH. HUNT. HIDE. EVOLVE.</p>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - "{{ required "host is required" .Values.host }}"
  scalingMetric:
    concurrency:
      targetValue: 10
{{- if .Values.gameserver.scaleToZero.enabled }}
    # Also a trigger of the dino-dash-server ScaledObject: a page view in the last
    # minute wakes the world server before the player presses PLAY. Only "> 0"
    # matters; the target is never reached (maxReplicaCount 1).
    requestRate:
      targetValue: 1000
---
# The world server's WebSocket (HTTPRoute /ws -> interceptor -> here). Longest
# path prefix wins over dino-dash-web's implicit /. Concurrency = open sockets =
# connected players; the interceptor holds the upgrade during a cold start.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: dino-dash-server
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  target:
    service: dino-dash-server
    port: 80
  rules:
    - hosts:
        - "{{ required "host is required" .Values.host }}"
      paths:
        - value: /ws
  scalingMetric:
    concurrency:
      targetValue: {{ int .Values.gameserver.maxPlayers }}
  timeouts:
    # Cold start is ~10 s; leave room for an image pull on a fresh node.
    readiness: 60s
    # A socket lives as long as the session: never cut it.
    request: 0s
{{- end }}
