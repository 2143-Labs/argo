{{- $ns := required "namespace is required" .Values.namespace }}
# Public game edge (docs/public-edge.md): the gates, Anubis, and the route names
# come from helm_modules/game-edge. The `game-` name prefix is what the CrowdSec
# agent keys on (workloads/crowdsec-agent/agent-game-hosts.yaml): a rule whose
# router is `httproute-default-game-...` never counts as crawling or probing —
# only exploit signatures and the flood ban apply. Bots are Anubis's job: the /
# rule's backend is Service anubis (anubis.yaml).
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the dsstar-us-wildcard-https listener only admits routes from `default`.
# / is Anubis, which proxies to the KEDA interceptor (the interceptor wakes the
# scale-to-zero client via the InterceptorRoute). /ws goes to the
# interceptor too when gameserver.scaleToZero.enabled (InterceptorRoute
# dino-dash-server), else straight to the world server (reference-grant.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}
  namespace: default
  labels:
    # LAN clients resolve these hosts publicly (docs/lan-dns.md): no lan-dns zone
    # covers them, and lan-dns must not answer anyway.
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: dsstar-us-wildcard-https
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    # The world server over WebSocket (the protocol ignores the path). This MUST
    # stay the first rule: Gateway API evaluates rules in order and a / rule first
    # would send the upgrade into the KEDA interceptor. /ws is not proxied by
    # Anubis; anubis-ws checks the Anubis cookie on the handshake (forwardAuth),
    # because a socket cannot answer a challenge itself.
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      filters:
{{- include "game-edge.wsGates" . }}
      backendRefs:
{{- if .Values.gameserver.scaleToZero.enabled }}
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
{{- else }}
        - name: dino-dash-server
          namespace: {{ $ns }}
          port: 80
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
{{- include "game-edge.gates" . }}
        # Every build's files carry the Nix store mtime (1970), so darkhttpd's
        # Last-Modified never changes and a revalidating browser would get a 304
        # with an older game. Strip the validators and make browsers re-fetch.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [If-Modified-Since]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-cache
            remove: [Last-Modified]
      backendRefs:
        - name: anubis
          namespace: {{ $ns }}
          port: 80
---
# http:// -> https:// (one hop). No backend, so it never wakes anything.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}-http-to-https
  namespace: default
  labels:
    # LAN clients resolve these hosts publicly (docs/lan-dns.md): no lan-dns zone
    # covers them, and lan-dns must not answer anyway.
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ required "host is required" .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
