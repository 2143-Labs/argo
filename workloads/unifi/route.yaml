# unifi.ts.2143.me — traefik terminates TLS with the cert-manager wildcard
# cert (*.ts.2143.me), then re-encrypts to the UniFi controller's own HTTPS
# on 8443 (see backendtlspolicy.yaml). Clients get a valid Let's Encrypt cert;
# the controller's self-signed cert never reaches them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-ts-2143
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: unifi-ts-2143-https
  hostnames:
    - unifi.ts.2143.me
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
    - backendRefs:
        - name: unifi-web
          port: 8443
