{{- /*
Anubis (bot challenge) in front of this environment's page and assets:
helm_modules/game-edge (docs/public-edge.md, "Anubis in front of an app").
   target          the KEDA interceptor when the app scales to zero (prod is
                   always-on and is addressed through its Service directly).
   redirectDomains the public hosts: prod serves how.john2143.com and
                   how.poe.sale, a preview only its own host.
   wsCheck         false: how.poe.sale has no WebSocket.
*/}}
{{- $target := "http://keda-add-ons-http-interceptor-proxy.keda.svc:8080" }}
{{- if ne (toString .Values.keda.enabled) "true" }}
{{- $target = printf "http://how-poe-sale.%s.svc:80" .Values.namespace }}
{{- end }}
{{- $rd := required "host is required" .Values.host }}
{{- with .Values.poeSaleHost }}
{{- $rd = printf "%s,%s" $rd . }}
{{- end }}
{{- include "game-edge.anubis" (dict
      "root" .
      "target" $target
      "redirectDomains" $rd
      "wsCheck" false) }}
