{{- /* The edge gates; every HTTPS rule below includes them. */}}
{{- define "how-poe-sale.gates" }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
{{- end }}
{{- $ns := required "namespace is required" .Values.namespace }}
# Public game edge (docs/public-edge.md): the shared generous rate and in-flight
# limits, then crowdsec-bouncer-noappsec, which enforces IP bans only (no AppSec:
# the backend is our own static server). The CrowdSec agent treats this host as
# a game host (workloads/crowdsec-agent/agent-game-hosts.yaml): no crawl/probing
# heuristics, only exploit signatures and a flood ban. Bots are Anubis's job:
# the / rule's backend is Service anubis (anubis.yaml).
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the john2143-wildcard-https listener only admits default/argocd/kube-system/openbao.
# The backend is Anubis (anubis.yaml), which proxies to the app Service (prod)
# or the KEDA interceptor (previews).
# scripts/validate-route-gates.sh skips /templates/, so these gates are not CI-checked:
# every rule must include "how-poe-sale.gates".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "routeName is required" .Values.routeName }}
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
{{- if .Values.poeSaleHost }}
    - name: shared-gateway
      sectionName: poe-sale-wildcard-https
{{- end }}
  hostnames:
    - "{{ required "host is required" .Values.host }}"
{{- if .Values.poeSaleHost }}
    - "{{ .Values.poeSaleHost }}"
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
{{- include "how-poe-sale.gates" . }}
      backendRefs:
        - name: anubis
          namespace: {{ $ns }}
          port: 80
---
# http:// -> https:// (one hop). Separate from gateway/john2143-http-to-https,
# which is at the Gateway API cap of 16 hostnames. No backend, so it never wakes
# a preview pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "routeName is required" .Values.routeName }}-http-to-https
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ required "host is required" .Values.host }}"
{{- if .Values.poeSaleHost }}
    - "{{ .Values.poeSaleHost }}"
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
