{{- $ns := required "namespace is required" .Values.namespace }}
# Public game edge (docs/public-edge.md): the gates, Anubis and the route names
# come from helm_modules/game-edge. The `game-` name prefix is what the CrowdSec
# agent keys on (workloads/crowdsec-agent/agent-game-hosts.yaml): a rule whose
# router is `httproute-default-game-...` never counts as crawling or probing —
# only exploit signatures and the flood ban apply. Bots are Anubis's job: the /
# rule's backend is Service anubis (anubis.yaml).
# Lives in `default` because Traefik ExtensionRef middlewares are namespace-local
# and the john2143-wildcard-https listener only admits default/argocd/kube-system/openbao.
# The backend is Anubis (anubis.yaml), which proxies to the app Service (prod)
# or the KEDA interceptor (previews).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}
  namespace: default
  labels:
    # LAN clients resolve these hosts publicly (docs/lan-dns.md): no lan-dns zone
    # covers how.poe.sale, and lan-dns must not answer anyway. The label applies
    # to the whole route, so how.john2143.com (inside a zone) stops resolving
    # through lan-dns too; how.poe.sale is the canonical name.
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: john2143-wildcard-https
{{- if .Values.poeSaleHost }}
    - name: shared-gateway
      sectionName: poe-sale-wildcard-https
{{- end }}
  hostnames:
    - "{{ required "host is required" .Values.host }}"
{{- if .Values.poeSaleHost }}
    - "{{ .Values.poeSaleHost }}"
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
{{- include "game-edge.gates" . }}
      backendRefs:
        - name: anubis
          namespace: {{ $ns }}
          port: 80
---
# http:// -> https:// (one hop). Separate from gateway/john2143-http-to-https,
# which is at the Gateway API cap of 16 hostnames. No backend, so it never wakes
# a preview pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "game-edge.routeName" . }}-http-to-https
  namespace: default
  labels:
    # LAN clients resolve these hosts publicly (docs/lan-dns.md): no lan-dns zone
    # covers how.poe.sale, and lan-dns must not answer anyway. The label applies
    # to the whole route, so how.john2143.com (inside a zone) stops resolving
    # through lan-dns too; how.poe.sale is the canonical name.
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: acme-http
  hostnames:
    - "{{ required "host is required" .Values.host }}"
{{- if .Values.poeSaleHost }}
    - "{{ .Values.poeSaleHost }}"
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
