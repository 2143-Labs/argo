{{- if eq (toString .Values.keda.enabled) "true" }}
# Previews only; spec.target has no namespace field, so it resolves to Service
# how-poe-sale in this InterceptorRoute's own namespace.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: how-poe-sale
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  target:
    service: how-poe-sale
    port: 80
  # A page view that finds no ready pod gets this page instead of a held request:
  # KEDA answers with the placeholder while the target has no ready endpoints, and the
  # page reloads every 2s (`Refresh`) until the app answers. `readiness: 0s` = no
  # deadline, so no cold start on this route can end in a 504. Same pattern as
  # workloads/rots-web/templates/interceptorroute.yaml. Previews only: prod is
  # always-on (keda.enabled false), so this never renders there.
  timeouts:
    readiness: 0s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: "text/html; charset=utf-8"
          Refresh: "2"
          Cache-Control: "no-store"
        body: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>how.poe.sale is starting</title>
          <meta name="theme-color" content="#12131a">
          <meta http-equiv="refresh" content="2">
          <style>
          html,body{margin:0;height:100%;background:#12131a;color-scheme:dark}
          body{display:grid;place-items:center;text-align:center;
               font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6e7ee}
          .box{background:#1b1d27;border:1px solid #2f3345;border-radius:6px;padding:20px 26px}
          h1{margin:0 0 .35rem;font-size:18px;font-weight:600;color:#f0b44d}
          .tag{margin:0 0 .9rem;font-size:12px;color:#9aa0b4}
          p{margin:0;font-size:12px;color:#9aa0b4}
          /* The spinner says "working"; the bar is the reload countdown. It runs 2s and the
             page itself reloads every 2s, so the bar restarts at zero with each reload. */
          .spin{box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:0 auto 12px;
                border:2px solid #2f3345;border-top-color:#f0b44d;
                animation:spin .7s linear infinite}
          .bar{height:2px;margin:14px 0 0;background:#2f3345;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#f0b44d;transform-origin:left;
                 animation:fill 2s linear forwards}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;transform:none}}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>how.poe.sale is starting...</h1>
          <p class="tag">Path of Exile crafting solver</p>
          <div class="spin"></div>
          <p>The server is waking up. This page refreshes every 2 seconds.</p>
          <div class="bar"><i></i></div>
          </div>
          </body>
          </html>
  rules:
    - hosts:
        - "{{ required "host is required" .Values.host }}"
  scalingMetric:
    concurrency:
      targetValue: 10
    # The placeholder is answered in ~1ms, so a page view never appears in the
    # instantaneous concurrency count the scaler samples: without this the app would
    # never wake and the page above would reload for ever. Request rate buckets a
    # request across its window (1m), so one page load keeps the route above zero.
    requestRate:
      targetValue: 1
{{- end }}
