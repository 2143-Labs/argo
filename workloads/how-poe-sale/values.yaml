# Every empty string is set by apps/how-poe-sale.yaml (prod) or apps/how-poe-sale-preview.yaml (per PR);
# the templates fail to render if any is empty.
namespace: ""   # how-poe-sale (prod) or how-poe-sale-pr-<N>
host: ""        # how.john2143.com or how-<N>.john2143.com
poeSaleHost: "" # prod only: how.poe.sale, served on listener poe-sale-wildcard-https in addition to host
routeName: ""   # unique in `default`: how-poe-sale or how-pr-<N>
image:
  repository: ghcr.io/2143-labs/how-poe-sale
  tag: ""       # sha-<commit>: main HEAD (prod, bumped by CI) or the PR head (previews)
# Previews: true (scale to zero). Always compared as `eq (toString .Values.keda.enabled) "true"`
# so a string "false" (helm --set-string) cannot read as true.
keda:
  enabled: false
replicas: 1     # prod only; with KEDA the ScaledObject owns replicas

# Link previews (helm_modules/game-edge): the Open Graph payload the Anubis
# challenge page carries for clients that cannot solve a challenge. The SPA
# answers every path with its index.html and serves no image, so the card is a
# title and a description; how.poe.sale is the canonical name on both hosts.
embed:
  title: "how.poe.sale — Path of Exile crafting solver"
  siteName: how.poe.sale
  description: "Paste an item and see which crafts can produce it, with exact odds, expected cost and time. Buying is priced against crafting at every step."
  url: https://how.poe.sale/
