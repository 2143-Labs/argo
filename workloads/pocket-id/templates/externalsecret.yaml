# Prod reads this ExternalSecret from the `secrets` app
# (workloads/secrets/pocket-id-pocket-id-secrets.yaml); moving it would make
# that app prune it and, with creationPolicy Owner, delete the prod Secret.
# So it renders here only where renderExternalSecret is true (nonprod, which
# has no `secrets` app). Copy of the secrets-app file, verbatim below.
{{- if .Values.renderExternalSecret }}
# Rendered into namespace pocket-id as Secret/pocket-id-secrets from OpenBao
# consumers/data/john2143-com/pocket-id/pocket-id-secrets. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pocket-id-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/pocket-id/pocket-id-secrets
{{- end }}
