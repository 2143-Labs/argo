apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
  namespace: stalwart
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
      sectionName: ts-2143-me-wildcard-https
  hostnames:
    - stalwart.ts.2143.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The host is tailnet/LAN-only now, so the three public filters
      # (public-rate-limit, public-inflight-limit, crowdsec-bouncer) are replaced
      # by lan-only. Do not keep both.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: stalwart-stalwart-web
          port: 8080
