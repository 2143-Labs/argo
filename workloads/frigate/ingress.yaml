apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: frigate-ts-2143-https
  hostnames:
    - frigate.ts.2143.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frigate
          port: 5000
