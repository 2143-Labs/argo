apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: ts-2143-me-wildcard-https
  hostnames:
    - cams.ts.2143.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: frigate-http
          port: 5000
