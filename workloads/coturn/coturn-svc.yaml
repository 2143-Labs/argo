apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: matrix
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.21"
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv4, IPv6]
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: coturn
  ports:
    - name: stun-turn
      port: 3478
      protocol: UDP
      targetPort: 3478
    - name: stun-turn-tcp
      port: 3478
      protocol: TCP
      targetPort: 3478
