apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pelican
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: pelican-john2143-https
  hostnames:
    - pelican.john2143.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pelican-http
          port: 80
