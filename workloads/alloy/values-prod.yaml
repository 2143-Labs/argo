alloy:
  # Basic-auth password for status-1's /metrics (Caddy basic_auth, user
  # "scraper"); rendered from OpenBao by workloads/secrets/observability-status-scraper.yaml.
  extraEnv:
    - name: STATUS_METRICS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: status-scraper
          key: password
          optional: true
    # LiteLLM virtual key for the llm-proxy /metrics endpoint (bearer auth), from
    # workloads/secrets/observability-litellm-metrics.yaml. Read once at pod start,
    # so rotating the key requires `rollout restart ds/alloy`.
    - name: LITELLM_METRICS_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-metrics
          key: api_key
          optional: true
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.home.receiver]
        clustering {
          enabled = true
        }
      }

      loki.source.kubernetes_events "events" {
        forward_to = [loki.write.home.receiver]
        job_name   = "kube-events"
        log_format = "json"
        clustering {
          enabled = true
        }
      }

      loki.write "home" {
        endpoint {
          url = "http://loki-gateway.observability.svc:80/loki/api/v1/push"
        }
        external_labels = { cluster = "home" }
      }

      // ── Metrics: remote write to Mimir ──
      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir.observability.svc:8080/api/v1/push"
          // Classic histogram buckets are dropped only for infrastructure
          // exporters. Application histograms keep theirs, because their p95 is
          // the point of the metric (gRPC/HTTP latency, gameserver tick
          // duration). Buckets were 185k of 414k series; these jobs are 105k
          // (2026-11-11). job="etcd" buckets come from pite's Prometheus, not
          // through here.
          write_relabel_config {
            source_labels = ["__name__", "job"]
            separator     = ";"
            regex         = ".*_bucket;(kubelet|cadvisor|temporal.*|longhorn.*|metallb.*|argocd.*|memberlist.*|keda.*|cnpg-system.*)"
            action        = "drop"
          }
        }
        // No cluster label on home series: adding one doubled every series
        // and hit Mimir's 500k per-tenant limit (2026-10-28). Home is the
        // series without a cluster label; DOKS is cluster="doks", status-1 cluster="do".
      }

      // kubelet + cAdvisor per node (role=node → <internalIP>:10250)
      discovery.kubernetes "nodes" {
        role = "node"
      }

      prometheus.scrape "kubelet" {
        targets           = discovery.kubernetes.nodes.targets
        job_name          = "kubelet"
        scheme            = "https"
        metrics_path      = "/metrics"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.relabel.kubelet_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "kubelet_metrics" {
        rule {
          source_labels = ["__name__"]
          regex         = "apiserver_.*|etcd_.*|scheduler_.*|workqueue_.*|rest_client_.*|go_.*|process_.*|grpc_.*|kubernetes_feature_.*|node_namespace_.*|apiextensions_.*|watch_cache_.*|session_server_.*|hpa_controller_.*|pv_collector_.*|lasso_.*|registered_metrics_total|kubeproxy_.*|k3s_.*"
          action        = "drop"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.scrape "cadvisor" {
        targets           = discovery.kubernetes.nodes.targets
        job_name          = "cadvisor"
        scheme            = "https"
        metrics_path      = "/metrics/cadvisor"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.relabel.cadvisor_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cadvisor_metrics" {
        // Longhorn's per-volume engine/replica containers dominate this job;
        // kube-state-metrics already reports those pods.
        rule {
          source_labels = ["namespace"]
          regex         = "longhorn-system"
          action        = "drop"
        }
        // Families nothing queries (0 references in workloads/). container_fs_* has
        // no pod or container label on this cluster, so the numbers cannot be joined
        // to a workload; 12,428 series in total.
        rule {
          source_labels = ["__name__"]
          regex         = "container_tasks_state|container_memory_failures_total|container_blkio_device_usage_total|container_fs_.*"
          action        = "drop"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // kube-state-metrics (deployed in Step 2)
      discovery.kubernetes "ksm" {
        role = "pod"
        namespaces {
          names = ["kube-state-metrics"]
        }
      }

      prometheus.scrape "ksm" {
        targets         = discovery.kubernetes.ksm.targets
        job_name        = "kube-state-metrics"
        scrape_interval = "30s"
        forward_to      = [prometheus.relabel.ksm_slow.receiver]
        clustering {
          enabled = true
        }
      }

      // The tracker's fast dimension. Deployments, statefulsets and namespaces change on
      // every KEDA wake and every preview create/delete, and the full kube-state-metrics
      // gather takes ~1.9 s for 4.1 MB, so they come from a resource-filtered exporter
      // scraped every 3 s instead of from a faster scrape of the big one.
      discovery.kubernetes "ksm_fast" {
        role = "pod"
        namespaces {
          names = ["kube-state-metrics-fast"]
        }
      }

      // The fast exporter declares two ports, so pod discovery yields two targets;
      // scrape the metrics port only. Same shape as discovery.relabel "traefik".
      discovery.relabel "ksm_fast_port" {
        targets = discovery.kubernetes.ksm_fast.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "8080"
          action        = "keep"
        }
      }

      prometheus.scrape "ksm_fast" {
        targets = discovery.relabel.ksm_fast_port.output
        // Same job label as the 30 s exporter on purpose: the two are disjoint by
        // metric family, so every existing query and dashboard keeps working, and
        // these families simply get 3 s resolution.
        job_name        = "kube-state-metrics"
        scrape_interval = "3s"
        // Prometheus rejects a timeout longer than the interval, and Alloy's default
        // timeout is 10 s. The gather itself measures ~15 ms.
        scrape_timeout  = "2s"
        forward_to      = [prometheus.relabel.ksm_fast_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "ksm_fast_metrics" {
        rule {
          source_labels = ["__name__"]
          regex         = "(up|kube_(deployment|statefulset|namespace)_.*)"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // The 30 s exporter keeps pods and the other resource types; the families the
      // fast exporter owns are dropped here so no series is reported by both.
      prometheus.relabel "ksm_slow" {
        rule {
          source_labels = ["__name__"]
          regex         = "kube_(deployment|statefulset|namespace)_.*"
          action        = "drop"
        }
        // Families nothing reads (argo dashboards and alerts, pite's rules, the
        // status page). rots-prod alone has 2,013 Services and 3,013 EndpointSlices;
        // 417 of 537 ReplicaSets are scaled to zero.
        rule {
          source_labels = ["__name__"]
          regex         = "kube_endpointslice_(info|created|ports)|kube_service_(info|created)|kube_replicaset_.*|kube_pod_tolerations|kube_pod_ips|kube_persistentvolume_.*|kube_(secret|configmap)_.*|kube_(lease|validatingwebhookconfiguration|mutatingwebhookconfiguration|networkpolicy)_.*|kube_volumeattachment_(labels|status_attachment_metadata)|kube_.*_created"
          action        = "drop"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // traefik (kube-system, metrics port 9100 declared)
      discovery.kubernetes "traefik" {
        role = "pod"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=traefik"
        }
      }

      discovery.relabel "traefik" {
        targets = discovery.kubernetes.traefik.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9100"
          action        = "keep"
        }
      }

      prometheus.scrape "traefik" {
        targets         = discovery.relabel.traefik.output
        job_name        = "traefik"
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }

      // longhorn-manager metrics, one target per manager pod (:9500). Without them
      // there is no longhorn_volume_robustness in Mimir, so volume degradation is
      // invisible — which is how 20 volumes stayed degraded for hours on 2026-11-02.
      // Each manager reports only the volumes it owns and the replicas, engines and
      // disks on its own node, so the longhorn-backend Service returned one node's
      // slice (25 of 78 attached volumes on 2026-11-12). instance is the node name,
      // so a manager restart does not re-key every series.
      discovery.kubernetes "longhorn" {
        role = "pod"
        namespaces {
          names = ["longhorn-system"]
        }
        selectors {
          role  = "pod"
          label = "app=longhorn-manager"
        }
      }

      discovery.relabel "longhorn" {
        targets = discovery.kubernetes.longhorn.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9500"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "longhorn" {
        targets         = discovery.relabel.longhorn.output
        job_name        = "longhorn"
        scrape_interval = "30s"
        forward_to      = [prometheus.relabel.longhorn_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      // Per-backup and per-snapshot series (3,046 backups x 3 families) and the
      // manager's client-go self-metrics are not read by anything. Backup freshness
      // stays visible per volume in longhorn_volume_last_backup_at.
      prometheus.relabel "longhorn_metrics" {
        rule {
          source_labels = ["__name__"]
          regex         = "longhorn_backup_(state|actual_size_bytes|uploaded_data_size_bytes)|longhorn_snapshot_actual_size_bytes|longhorn_workqueue_.*|longhorn_rest_client_.*"
          action        = "drop"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // temporal server services (default ns; metrics on :9090 — force address since
      // the pods may not declare the container port)
      discovery.kubernetes "temporal" {
        role = "pod"
        namespaces {
          names = ["default"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=temporal"
        }
      }

      discovery.relabel "temporal" {
        targets = discovery.kubernetes.temporal.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          regex         = "temporal-(frontend|history|matching|worker)-.*"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          regex         = "(.+)"
          replacement   = "$1:9090"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "temporal" {
        targets         = discovery.relabel.temporal.output
        job_name        = "temporal"
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }


      // llm-proxy counters: token usage, provider prompt-cache read/creation and
      // spend, labelled api_provider / model_id / requested_model. Scraped PER POD,
      // never through the Service VIP: two replicas behind a ClusterIP means a VIP
      // scrape alternates pods and the counters look like they reset every scrape.
      // /metrics requires a bearer token (PrometheusAuthMiddleware runs the normal
      // proxy-key auth). The trailing slash is load-bearing: `/metrics` answers
      // 307 -> `/metrics/`, so scraping the slash saves a request per scrape per pod.
      // Series stay out of Mimir's 750k per-tenant limit because the proxy
      // whitelists the metric families it emits (litellm_settings.prometheus_metrics_config).
      discovery.kubernetes "litellm" {
        role = "pod"
        namespaces {
          names = ["default"]
        }
        selectors {
          role  = "pod"
          label = "app=litellm"
        }
      }

      discovery.relabel "litellm" {
        targets = discovery.kubernetes.litellm.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          regex         = "(.+)"
          replacement   = "$1:4000"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "litellm" {
        targets         = discovery.relabel.litellm.output
        job_name        = "litellm"
        metrics_path    = "/metrics/"
        scrape_interval = "30s"
        authorization {
          type        = "Bearer"
          credentials = sys.env("LITELLM_METRICS_KEY")
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }


      // CNPG instances (:9187): WAL-archive backlog and Barman Cloud plugin backup
      // timestamps for db-backup-alerts.yaml. docs/db-backups.md.
      discovery.kubernetes "cnpg" {
        role = "pod"
        namespaces {
          names = ["default", "mattermost", "steam-lobby", "odoo-aross", "odoo-labs", "rots-prod"]
        }
        selectors {
          role  = "pod"
          label = "cnpg.io/podRole=instance"
        }
      }

      discovery.relabel "cnpg" {
        targets = discovery.kubernetes.cnpg.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9187"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
          target_label  = "cnpg_cluster"
        }
      }

      prometheus.scrape "cnpg" {
        targets         = discovery.relabel.cnpg.output
        job_name        = "cnpg"
        scrape_interval = "60s"
        forward_to      = [prometheus.relabel.cnpg_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cnpg_metrics" {
        rule {
          source_labels = ["__name__"]
          regex         = "(up|cnpg_collector_pg_wal|cnpg_collector_pg_wal_archive_status|cnpg_pg_stat_archiver_.*|barman_cloud_cloudnative_pg_io_.*)"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // LGTM + Alloy self-metrics (static targets — services are stable)
      prometheus.scrape "observability" {
        targets = [
          { __address__ = "mimir.observability.svc:8080" },
          { __address__ = "loki-read.observability.svc:3100" },
          { __address__ = "loki-write.observability.svc:3100" },
          { __address__ = "loki-backend.observability.svc:3100" },
          { __address__ = "tempo.observability.svc:3200" },
          { __address__ = "grafana.observability.svc:80" },
          { __address__ = "alloy.observability.svc:12345" },
          { __address__ = "crowdsec-service.crowdsec.svc:6060" },
          { __address__ = "crowdsec-appsec-service.crowdsec.svc:6060" },
          { __address__ = "crowdsec-agent-service.crowdsec.svc:6060" },
          { __address__ = "lan-dns-metrics.lan-dns.svc:9153" },
        ]
        job_name        = "observability"
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }


      // keda metrics API server (verified 200 on :8080/metrics)
      prometheus.scrape "keda" {
        targets = [
          { __address__ = "keda-operator-metrics-apiserver.keda.svc:8080" },
        ]
        job_name        = "keda"
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }


      // ArgoCD application status for the status-design games tracker. Only the
      // controller exports argocd_app_info (sync + health per Application); its
      // Service argocd-metrics:8082 admits ingress from every namespace
      // (argocd-application-controller-network-policy), so the peer that wins
      // the hash under clustering can scrape it from whichever node it runs on.
      // Everything else the controller exports (per-app histograms for 130+
      // Applications) is dropped before remote write.
      prometheus.scrape "argocd" {
        targets         = [{ __address__ = "argocd-metrics.argocd.svc:8082" }]
        job_name        = "argocd"
        scrape_interval = "3s"
        scrape_timeout  = "2s"
        forward_to      = [prometheus.relabel.argocd_app_info.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_app_info" {
        rule {
          source_labels = ["__name__"]
          regex         = "argocd_app_info"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }


      // OpenBao server metrics (HTTPS via internal ordinals, public CA)
      prometheus.scrape "openbao" {
        targets = [
          { __address__ = "openbao-0.openbao-internal.openbao.svc:8200" },
          { __address__ = "openbao-1.openbao-internal.openbao.svc:8200" },
          { __address__ = "openbao-2.openbao-internal.openbao.svc:8200" },
        ]
        job_name        = "openbao"
        scheme          = "https"
        metrics_path    = "/v1/sys/metrics"
        params = {
          "format" = ["prometheus"],
        }
        scrape_interval = "30s"
        tls_config {
          server_name = "openbao.ts.2143.me"
        }
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }

      // status-1 droplet host metrics, pulled from home over its public 443
      // behind Caddy basic_auth. Nothing on the droplet dials home.
      prometheus.scrape "status_droplet" {
        targets         = [{ __address__ = "status.2143.me", cluster = "do", site = "tor1", node = "status-1" }]
        job_name        = "status-1"
        scheme          = "https"
        metrics_path    = "/metrics"
        scrape_interval = "30s"
        basic_auth {
          username = "scraper"
          password = sys.env("STATUS_METRICS_PASSWORD")
        }
        forward_to      = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }

      // ── Traces: OTLP receiver → batch → Tempo ──
      otelcol.receiver.otlp "traces" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces  = [otelcol.processor.batch.traces.input]
          metrics = [otelcol.processor.filter.beyla_metrics.input]
        }
      }

      // Beyla histograms nothing reads: the four HTTP body-size families, and the
      // Kubernetes-API client calls made by the CNPG instance manager inside every
      // *-db pod (most of those services' series). db.* and http.server.* stay.
      // OTTL string literals take Go-style escapes, so "\." must be written "[.]".
      otelcol.processor.filter "beyla_metrics" {
        error_mode = "ignore"

        metric_conditions {
          context    = "metric"
          conditions = [
            `metric.name == "http.server.request.body.size"`,
            `metric.name == "http.server.response.body.size"`,
            `metric.name == "http.client.request.body.size"`,
            `metric.name == "http.client.response.body.size"`,
            `resource.attributes["service.name"] != nil and IsMatch(resource.attributes["service.name"], "-db$") and IsMatch(metric.name, "^http[.]client[.]")`,
          ]
        }

        output {
          metrics = [otelcol.processor.batch.metrics.input]
        }
      }

      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.processor.batch "metrics" {
        output {
          metrics = [otelcol.exporter.otlphttp.mimir.input]
        }
      }

      otelcol.exporter.otlphttp "mimir" {
        client {
          endpoint = "http://mimir.observability.svc:8080/otlp"
          tls {
            insecure = true
          }
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc:4317"
          tls {
            insecure = true
          }
        }
      }

      // -- Node systemd journal (k3s, kubelet, sshd, postgres, ...) --
      loki.relabel "journal" {
        forward_to = []
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label  = "host"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
        rule {
          target_label = "job"
          replacement  = "node-journal"
        }
      }

      loki.source.journal "node" {
        path          = "/var/log/journal"
        max_age       = "12h"
        // job is set by the relabel rule: this component forces
        // job=<component id> over `labels`.
        relabel_rules = loki.relabel.journal.rules
        forward_to    = [loki.write.home.receiver]
      }

      // -- MikroTik router syslog (BSD/RFC3164 over UDP via syslog-lb 192.168.6.25:514) --
      loki.relabel "syslog" {
        forward_to = []
        rule {
          source_labels = ["__syslog_message_severity"]
          target_label  = "level"
        }
        rule {
          source_labels = ["__syslog_message_app_name"]
          target_label  = "app"
        }
      }

      loki.source.syslog "mikrotik" {
        listener {
          address                = "0.0.0.0:1514"
          protocol               = "udp"
          syslog_format          = "rfc3164"
          use_incoming_timestamp = false
          labels                 = { job = "mikrotik", host = "router" }
        }
        relabel_rules = loki.relabel.syslog.rules
        forward_to    = [loki.write.home.receiver]
      }

      // -- Edge request logs: each edge's Alloy pushes through the lab connector
      // (10.61.0.11:3500 -> syslog-lb 192.168.6.25:3500). This is the trust
      // boundary: an edge controls only `slot` (s1-s9, self-reported) and `kind`;
      // job is forced and every other label dropped, so no edge can write into
      // another stream.
      loki.relabel "edge" {
        forward_to = []
        rule {
          action = "labelkeep"
          regex  = "slot|kind"
        }
        rule {
          source_labels = ["slot"]
          regex         = "s[1-9]"
          action        = "keep"
        }
        rule {
          source_labels = ["kind"]
          regex         = "access|error|turn"
          action        = "keep"
        }
        // job is derived from kind, never taken from the edge: a TURN relay's
        // journal goes to edge-coturn, request logs to edge-nginx.
        rule {
          source_labels = ["kind"]
          regex         = "turn"
          target_label  = "job"
          replacement   = "edge-coturn"
        }
        rule {
          source_labels = ["kind"]
          regex         = "access|error"
          target_label  = "job"
          replacement   = "edge-nginx"
        }
      }

      loki.source.api "edge" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 3500
        }
        use_incoming_timestamp = false
        relabel_rules          = loki.relabel.edge.rules
        forward_to             = [loki.write.home.receiver]
      }
  clustering:
    enabled: true
    name: alloy
  enableReporting: false
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: positions
        mountPath: /var/lib/alloy
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: syslog-udp
      port: 1514
      targetPort: 1514
      protocol: UDP
    - name: edge-logs
      port: 3500
      targetPort: 3500
      protocol: TCP
controller:
  volumes:
    extra:
      - name: positions
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
      - name: journal
        hostPath:
          path: /var/log/journal
          type: Directory
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
