apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  labels:
    app: headscale
data:
  derp.yaml: |
    regions:
      900:
        regionid: 900
        regioncode: derp-r
        regionname: "Remote DERP (NYC)"
        nodes:
          - name: derp-r
            regionid: 900
            hostname: derp-r.2143.me
            stunport: 3478
            derpport: 443
  policy.hujson: |
    {
      "acls": [
        // Users can only reach their own devices
        {
          "action": "accept",
          "src": ["autogroup:member"],
          "dst": ["autogroup:self:*"]
        },
        // Everyone can use exit nodes
        {
          "action": "accept",
          "src": ["autogroup:member"],
          "dst": ["autogroup:internet:*"]
        },
        // Only john2143 can access the 192.168.5.x and 192.168.6.x subnets
        {
          "action": "accept",
          "src": ["john2143@"],
          "dst": ["192.168.5.0/24:*", "192.168.6.0/24:*"]
        }
      ]
    }
  config.yaml: |
    server_url: https://net.john2143.com
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: false

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: true
        region_id: 999
        region_code: "headscale"
        region_name: "Headscale Embedded DERP"
        verify_clients: true
        stun_listen_addr: "0.0.0.0:3478"
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
      urls: []
      paths:
        - /etc/headscale/derp.yaml
      auto_update_enabled: false
      update_frequency: 3h

    disable_check_updates: true

    node:
      expiry: 0
      ephemeral:
        inactivity_timeout: 30m

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
        wal_autocheckpoint: 1000

    log:
      level: info
      format: text

    policy:
      mode: file
      path: /etc/headscale/policy.hujson

    dns:
      magic_dns: true
      base_domain: ts.2143.me
      override_local_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
          - 2606:4700:4700::1111
          - 2606:4700:4700::1001
      split: {}
      search_domains: []
      extra_records:
        # auth.ts.2143.me
        - name: "auth.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # home.ts.2143.me
        - name: "home.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # files-ui.ts.2143.me
        - name: "files-ui.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # pihole.ts.2143.me
        - name: "pihole.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # longhorn.ts.2143.me
        - name: "longhorn.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # argocd.ts.2143.me
        - name: "argocd.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # immich.ts.2143.me
        - name: "immich.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # grocy.ts.2143.me
        - name: "grocy.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # cameras.ts.2143.me
        - name: "cameras.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # frigate.ts.2143.me
        - name: "frigate.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
        # temporal.ts.2143.me
        - name: "temporal.ts.2143.me"
          type: "A"
          value: "192.168.6.11"
    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"

    logtail:
      enabled: false

    randomize_client_port: false

    taildrop:
      enabled: true

