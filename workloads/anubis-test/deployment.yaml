apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis-test
  namespace: default
  labels:
    app: anubis-test
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: anubis-test
  template:
    metadata:
      labels:
        app: anubis-test
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://pite-status.default.svc:3030"
            - name: PUBLIC_URL
              value: "https://anubis-test.john2143.com"
            - name: REDIRECT_DOMAINS
              value: "anubis-test.john2143.com"
            - name: SERVE_ROBOTS_TXT
              value: "true"
            - name: SLOG_LEVEL
              value: "debug"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
