# The console presents a self-signed certificate (CN=unifi.local) with no
# basicConstraints extension, so it cannot be used as a trust anchor — Go's
# crypto/x509 rejects a v3 cert lacking basicConstraints. Skip validation for
# this single hop only; Traefik still terminates the client-facing TLS with the
# valid cert-manager *.ts.2143.me certificate.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-os-insecure
  namespace: default
spec:
  insecureSkipVerify: true
