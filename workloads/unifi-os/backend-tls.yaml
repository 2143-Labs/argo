# Re-encryption to the UniFi OS console (192.168.5.30:11443, self-signed for
# unifi.local). route.yaml references the TraefikService; the ServersTransport
# trusts only unifi-os-ca and verifies the name unifi.local.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-os-tls
  namespace: default
spec:
  serverName: unifi.local
  rootCAs:
    - configMap: unifi-os-ca
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: unifi-os-tls
  namespace: default
spec:
  weighted:
    services:
      - name: unifi-os
        port: 11443
        # Never infer HTTPS from the port (Traefik >=3.7.15 does not).
        scheme: https
        serversTransport: unifi-os-tls
