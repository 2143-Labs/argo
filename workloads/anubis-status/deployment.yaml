apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis-status
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: anubis-status
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: anubis-status
  template:
    metadata:
      labels:
        app: anubis-status
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://pite-status.default.svc:3030"
            - name: REDIRECT_DOMAINS
              value: "status.2143.me"
            - name: HS512_SECRET
              valueFrom:
                secretKeyRef:
                  name: anubis-status-signing-key
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
