apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: crowdsec-bouncer-plugin-src
    files:
      - plugin.tar.gz
  # Served by the bouncer for a blocked address (banFilePath in the gateway
  # Middlewares). The HelmChartConfig on closet mounts it at /etc/traefik/ban-page.
  - name: traefik-ban-page
    files:
      - ban.html
