# MetalLB dual-stack LoadBalancer for the Minecraft game port (TCP 25565).
#
# LAN clients connect to 192.168.6.29:25565 directly (hairpin NAT was removed
# 2026-05-29). WAN clients reach it via the MikroTik dst-nat
# "minecraft (tcp/25565) -> .6.29".
#
# 192.168.6.29 / fd00:6::29 are pinned from the 'services' IPAddressPool
# (workloads/metallb/ipaddresspool.yaml).
#
# allocateLoadBalancerNodePorts is false: the .6.x address is the only entry
# point, so no ports are consumed from the 30000-32767 node-port range. The old
# deployment exposed nodePort 32565 instead; that is deliberately not repeated.
apiVersion: v1
kind: Service
metadata:
  name: minecraft-game
  namespace: default
  annotations:
    metallb.io/loadBalancerIPs: "192.168.6.29,fd00:6::29"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  # Local: only the node running the pod announces this VIP, so draining any
  # other node never re-hashes live players (argo docs/node-maintenance.md).
  externalTrafficPolicy: Local
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: minecraft}
  ports:
    - {port: 25565, targetPort: 25565, protocol: TCP, name: game}
