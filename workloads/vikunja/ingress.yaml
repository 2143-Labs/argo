apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja
  namespace: default
spec:
  hostnames:
    - tasks.2143.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: default
      sectionName: tasks-2143-me-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # content-* tier, not public-*: the SPA fans out to many asset/API requests,
      # and LAN clients hairpin in as the WAN IP (not in excludedIPs), so the
      # household would share one 100/min public-rate-limit bucket.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: content-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: content-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: ""
          kind: Service
          name: vikunja
          port: 80
