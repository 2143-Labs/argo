# tasks.2143.me. /dav and /.well-known/caldav are CalDAV (machine traffic): class B
# (crowdsec-bouncer-noappsec), so no in-band AppSec signature can 403 a calendar sync.
# Until 2026-11-28 this split existed because the out-of-band OWASP CRS pass scored
# DAV verbs (911100) into 4 h bans; that pass is gone (values-prod.yaml,
# scripts/validations/appsec-no-outofband.sh), and the split stays because a calendar
# client has nothing to gain from body inspection. docs/public-edge.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja
  namespace: default
spec:
  hostnames:
    - tasks.2143.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: default
      sectionName: 2143-me-wildcard-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dav
        - path:
            type: PathPrefix
            value: /.well-known/caldav
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer-noappsec
      backendRefs:
        - group: ""
          kind: Service
          name: vikunja
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - group: ""
          kind: Service
          name: vikunja
          port: 80
