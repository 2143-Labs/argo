# Mounted as a directory at /etc/vikunja (on Vikunja's default config search path).
# Secrets (service.secret, provider clientid/clientsecret) come from env via
# Secret/vikunja-secrets; Vikunja deep-merges VIKUNJA_* env over this file.
# database.path and files.basepath are env vars in the Deployment because the
# image bakes VIKUNJA_DATABASE_PATH and env wins over the file.
# Do not enable emailfallback/usernamefallback (GHSA-xv7q-fvmc-jx96).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
  namespace: default
  labels:
    app: vikunja
data:
  config.yml: |
    service:
      publicurl: "https://tasks.2143.me"
      enableregistration: false
      # Brand logo, inlined as a base64 data: URI. Vikunja has no upload or
      # filesystem option for this: the value is injected into index.html as
      # window.CUSTOM_LOGO_URL(_DARK) and fetched by the browser as <img src>.
      # Set BOTH keys - frontend/src/components/home/Logo.vue falls back to
      # whichever one is set, so a dark-only value renders on light themes too
      # (light bars on a white page = invisible).
      # Regenerate: base64 -w0 2143tasks_logo_light.svg | sed "s|^|data:image/svg+xml;base64,|"
      customlogourl: "data:image/svg+xml;base64,"
      customlogourldark: "data:image/svg+xml;base64,"
    database:
      type: sqlite
    auth:
      local:
        enabled: false
      openid:
        enabled: true
        providers:
          pocketid:
            name: "Pocket ID"
            authurl: "https://au.2143.me"
            scope: "openid email profile"
