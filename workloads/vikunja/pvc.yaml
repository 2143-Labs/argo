apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-data
  namespace: default
  # Functional Longhorn group label: enrolls the claim in the nightly backup
  # RecurringJob. Prune=false/Delete=false keeps Argo from removing a live volume.
  labels:
    recurring-job-group.longhorn.io/default: enabled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Holds both the SQLite DB (/data/vikunja.db) and attachments (/data/files).
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-2
  resources:
    requests:
      storage: 5Gi
