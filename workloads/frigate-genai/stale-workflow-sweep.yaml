apiVersion: batch/v1
kind: CronJob
metadata:
  name: frigate-genai-stale-workflow-sweep
  namespace: default
  labels: {app: frigate-genai}
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: temporalio/admin-tools:1.31.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date -u -d @$(( $(date +%s) - 21600 )) +%Y-%m-%dT%H:%M:%SZ)
                  Q="(WorkflowType='GenAIWorkflow' OR WorkflowType='AgentSessionWorkflow' OR WorkflowType='SubAgentWorkflow') AND ExecutionStatus='Running' AND StartTime < '$TS'"
                  ADDR=temporal-frontend.default.svc.cluster.local:7233
                  OUT=$(temporal workflow list --query "$Q" --address $ADDR --namespace default --limit 1 2>&1); RC=$?
                  if [ $RC -ne 0 ]; then echo "$OUT" >&2; exit $RC; fi
                  echo "$OUT" | grep -q Running || exit 0
                  temporal workflow terminate --query "$Q" --reason "stale frigate-genai workflow (Running > 6h)" --yes --address $ADDR --namespace default
