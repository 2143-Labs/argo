apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: frigate-genai-gemini-keda
spec:
  workerDeploymentRef: {name: frigate-genai-gemini}
  template:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    spec:
      scaleTargetRef: {}
      minReplicaCount: 0
      maxReplicaCount: 10
      pollingInterval: 15
      cooldownPeriod: 300
      triggers:
      - type: temporal
        metadata:
          endpoint: temporal-frontend.default.svc.cluster.local:7233
          namespace: ""
          workerDeploymentName: ""
          workerDeploymentBuildId: ""
          taskQueue: genai-tasks-gemini
          targetQueueSize: "20"
          activationTargetQueueSize: "0"
          queueTypes: "workflow,activity"
