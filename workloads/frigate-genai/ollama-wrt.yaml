apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: frigate-genai-ollama-keda
spec:
  workerDeploymentRef: {name: frigate-genai-ollama}
  template:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    spec:
      scaleTargetRef: {}
      minReplicaCount: 0
      maxReplicaCount: 1
      pollingInterval: 15
      cooldownPeriod: 300
      triggers:
      - type: temporal
        metadata:
          endpoint: temporal-frontend.default.svc.cluster.local:7233
          namespace: ""
          workerDeploymentName: ""
          workerDeploymentBuildId: ""
          taskQueue: genai-tasks-ollama
          targetQueueSize: "3"
          activationTargetQueueSize: "0"
          queueTypes: "workflow,activity"
          # The queue only carries activity tasks; the workflows that own them
          # run on genai-tasks, so the running-workflow count must come from there.
          includeRunningWorkflowCount: "true"
          workflowTaskQueueForCount: genai-tasks
