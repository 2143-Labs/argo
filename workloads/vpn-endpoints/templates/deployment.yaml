apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: vpn-endpoints
    vpn.2143.me/endpoint: {{ .Values.name }}
    vpn.2143.me/country: {{ .Values.country | lower | replace " " "-" | quote }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
      app.kubernetes.io/part-of: vpn-endpoints
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: vpn-endpoints
        vpn.2143.me/endpoint: {{ .Values.name }}
        vpn.2143.me/country: {{ .Values.country | lower | replace " " "-" | quote }}
      annotations:
        reloader.stakater.com/auto: "true"
        vpn.2143.me/rotate-mullvad: {{ .Values.mullvadRotationNonce | quote }}
    spec:
      serviceAccountName: vpn-endpoint-{{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # No forwarded-packet sysctls are declared: a live probe shows every pod
        # netns in this cluster already has net.ipv4.ip_forward=1, and requesting
        # them anyway pins the endpoint to nodes whose kubelet allowlists them
        # (arch/closet/nas reject the pod outright as SysctlForbidden).
      # Gluetun's DNS answers the cluster search-path variants slowly (~4s each),
      # so ndots:1 makes names like net.john2143.com resolve absolute-first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - arch
                      - big
                      - closet
                      - nas
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values:
                      - vpn-endpoints
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: enroll
          image: {{ .Values.images.vpnEnroll }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec /bin/sh /etc/vpn-endpoint/enroll.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vpn-endpoint
              readOnly: true
            - name: account-secret
              mountPath: /etc/mullvad-account
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/secrets
            - name: vpn-endpoint-state
              mountPath: /var/lib/vpn-endpoint
            - name: enroll-api-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: gluetun
          image: {{ .Values.images.gluetun }}
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: {{ .Values.country | quote }}
            - name: WIREGUARD_PRIVATE_KEY_SECRETFILE
              value: /run/secrets/wireguard_private_key
            - name: WIREGUARD_ADDRESSES_SECRETFILE
              value: /run/secrets/wireguard_addresses
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: tailscale
          image: {{ .Values.images.tailscale }}
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 127.0.0.1:9002
            - name: TS_BOOT_TIMEOUT
              value: 180s
            - name: TS_HOSTNAME
              value: {{ .Values.hostname | quote }}
            - name: TS_AUTHKEY
              value: file:/etc/tailscale/auth_key
            - name: TS_EXTRA_ARGS
              value: --login-server=https://net.john2143.com --advertise-exit-node --accept-routes=false
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:9002/healthz
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-auth-secret
              mountPath: /etc/tailscale
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}
            defaultMode: 0444
        - name: account-secret
          secret:
            secretName: mullvad-account
        - name: tailscale-auth-secret
          secret:
            secretName: tailscale-bootstrap
        - name: runtime-secrets
          emptyDir:
            medium: Memory
        - name: enroll-api-credentials
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: vpn-endpoint-state
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
