apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: vpn-endpoints
    vpn.2143.me/endpoint: {{ .Values.name }}
    vpn.2143.me/country: {{ .Values.country | lower | replace " " "-" | quote }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
      app.kubernetes.io/part-of: vpn-endpoints
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: vpn-endpoints
        vpn.2143.me/endpoint: {{ .Values.name }}
        vpn.2143.me/country: {{ .Values.country | lower | replace " " "-" | quote }}
      annotations:
        reloader.stakater.com/auto: "true"
        vpn.2143.me/rotate-mullvad: {{ .Values.mullvadRotationNonce | quote }}
    spec:
      serviceAccountName: vpn-endpoint-{{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # No forwarded-packet sysctls are declared: a live probe shows every pod
        # netns in this cluster already has net.ipv4.ip_forward=1, and requesting
        # them anyway pins the endpoint to nodes whose kubelet allowlists them
        # (arch/closet/nas reject the pod outright as SysctlForbidden).
      # Gluetun's DNS answers the cluster search-path variants slowly (~4s each),
      # so ndots:1 makes names like net.john2143.com resolve absolute-first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - arch
                      - big
                      - closet
                      - nas
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values:
                      - vpn-endpoints
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: enroll
          image: {{ .Values.images.vpnEnroll }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec /bin/sh /etc/vpn-endpoint/enroll.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vpn-endpoint
              readOnly: true
            - name: account-secret
              mountPath: /etc/mullvad-account
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/secrets
            - name: vpn-endpoint-state
              mountPath: /var/lib/vpn-endpoint
            - name: enroll-api-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: gluetun
          image: {{ .Values.images.gluetun }}
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          # Gluetun reads exactly one server database, /gluetun/servers.json, and
          # the pinned image ships it hardcoded and dated 2025-10-03. Mullvad has
          # since renumbered Estonia's relays (ee-tll-wg-001/002/003 ->
          # ee-tll-wg-101/102/103), so ee-mullvad dialed retired addresses
          # forever: Gluetun picks a server at random, WireGuard fails silently,
          # and the healthcheck restarts the VPN in a loop. Its own updater cannot
          # repair that at startup (UPDATER_PERIOD=0 never runs, and any other
          # value first fires a whole period later, once a tunnel already exists),
          # so refresh the list here, before Gluetun starts. Best effort: a failed
          # refresh leaves the existing file behind, i.e. the previous behaviour.
          # -minratio is required because the default guard demands 0.8 of the
          # loaded count (675 Mullvad servers) while Mullvad publishes 534.
          command:
            - /bin/sh
            - -ec
            - |
              /gluetun-entrypoint update -enduser -minratio 0.5 -providers mullvad ||
                echo "server list refresh failed; keeping the existing list"
              exec /gluetun-entrypoint
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: {{ .Values.country | quote }}
            - name: WIREGUARD_PRIVATE_KEY_SECRETFILE
              value: /run/secrets/wireguard_private_key
            - name: WIREGUARD_ADDRESSES_SECRETFILE
              value: /run/secrets/wireguard_addresses
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: tailscale
          image: {{ .Values.images.tailscale }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              # Four fixes are required for this pod to work as a Tailscale exit
              # node behind Gluetun, all verified live with an isolated tailnet
              # client (egress through the endpoint reported mullvad_exit_ip=true).
              #
              # 1. The pinned tailscale image symlinks iptables/ip6tables to the
              #    *legacy* backend. This kernel has no legacy tables ("can't
              #    initialize iptables table `filter'"), so tailscaled failed to
              #    install ts-forward/ts-postrouting and forwarded nothing. Point
              #    the tools at the nft backend the same image ships.
              ln -sf /usr/sbin/iptables-nft /usr/sbin/iptables
              ln -sf /usr/sbin/ip6tables-nft /usr/sbin/ip6tables
              # 2. Gluetun routes every unmarked packet through its fwmark table,
              #    whose default route points back into the tunnel. Replies to a
              #    forwarded flow were therefore routed into tun0 and dropped by
              #    FORWARD's default-drop policy, so nothing ever came back. Pin
              #    tailnet destinations to Tailscale's table first. Bounded wait
              #    for Gluetun's routing keeps this independent of start order.
              i=0
              while [ "$i" -lt 90 ] && ! ip rule show | grep -q '0xca6c'; do
                i=$((i + 1))
                sleep 2
              done
              ip rule add to 100.64.0.0/10 lookup 52 priority 97 2>/dev/null || true
              ip -6 rule add to fd7a:115c:a1e0::/48 lookup 52 priority 97 2>/dev/null || true
              # 3. The path is VPN-in-VPN (1280 inside 1320), so large TCP segments
              #    black-holed: ICMP and handshakes worked, transfers stalled.
              iptables -t mangle -C FORWARD -p tcp --tcp-flags SYN,RST SYN \
                -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null ||
                iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN \
                  -j TCPMSS --clamp-mss-to-pmtu
              # 4. Enroll publishes the tailnet identity derived from the endpoint
              #    country and Mullvad-assigned device name into the pod runtime
              #    volume, so it overrides the static slug before registration.
              if [ -s /run/secrets/tailnet-node-name ]; then
                TS_HOSTNAME="$(cat /run/secrets/tailnet-node-name)"
                export TS_HOSTNAME
              fi
              exec /usr/local/bin/containerboot
          env:
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 127.0.0.1:9002
            - name: TS_BOOT_TIMEOUT
              value: 180s
            - name: TS_HOSTNAME
              value: {{ .Values.hostname | quote }}
            - name: TS_AUTHKEY
              value: file:/etc/tailscale/auth_key
            - name: TS_EXTRA_ARGS
              value: --login-server=https://net.john2143.com --advertise-exit-node --accept-routes=false
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:9002/healthz
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-auth-secret
              mountPath: /etc/tailscale
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}
            defaultMode: 0444
        - name: account-secret
          secret:
            secretName: mullvad-account
        - name: tailscale-auth-secret
          secret:
            secretName: tailscale-bootstrap
        - name: runtime-secrets
          emptyDir:
            medium: Memory
        - name: enroll-api-credentials
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: vpn-endpoint-state
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
