apiVersion: apps/v1
kind: Deployment
metadata:
  name: john2143-com
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: john2143-com
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: john2143-com
        servicegroup: "mine"
    spec:
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: john2143-com-files
      - name: upload-fish
        configMap:
          name: upload-fish
          defaultMode: 0555
          items:
            - key: upload.fish
              path: upload.fish
            - key: prune.fish
              path: prune.fish
            - key: shared.fish
              path: shared.fish

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - general
      containers:
      - name: john2143-com
        image: ghcr.io/john2143/john2143.com:213
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: &port 3000
        volumeMounts:
        - mountPath: /app/juushFiles
          name: data-volume
        - mountPath: /app/upload-fish
          name: upload-fish
          readOnly: true
        env:
        - name: DB
          valueFrom:
            secretKeyRef:
              name: mongo-creds
              key: worker-uri
        - name: PORT
          value: "3000"
        - name: IP
          value: "0.0.0.0"
        - name: NODE_ENV
          value: production
        - name: S3_ENDPOINT_URL
          value: "https://nyc3.digitaloceanspaces.com"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: S3_SECRET_KEY
        - name: MINIO_ENDPOINT_URL
          value: "http://seaweedfs-s3.default.svc.cluster.local:8333"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: S3_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: S3_SECRET_KEY
        - name: BUCKET
          value: "imagehost-files"
        - name: FOLDER
          value: "public-prod"
        - name: AUTH_CALLBACK_BASE
          value: "https://2143.me"
        - name: POCKETID_ISSUER
          value: "https://au.2143.me"
        - name: POCKETID_ADMIN_GROUP
          value: "admin"
        - name: POCKETID_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-creds
              key: POCKETID_CLIENT_ID
        - name: POCKETID_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-creds
              key: POCKETID_CLIENT_SECRET
        - name: DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-creds
              key: DISCORD_CLIENT_ID
        - name: DISCORD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-creds
              key: DISCORD_CLIENT_SECRET
        - name: DISCORD_ADMIN_IDS
          value: ""
        - name: TEMPORAL_ADDRESS
          value: "temporal-frontend.default.svc.cluster.local:7233"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health
            port: *port
          initialDelaySeconds: 1
          periodSeconds: 10
          failureThreshold: 25
          timeoutSeconds: 5

        readinessProbe:
          httpGet:
            path: /health
            port: *port
          initialDelaySeconds: 1
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
