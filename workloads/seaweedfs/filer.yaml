apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-filer
  labels: {app: seaweedfs-filer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs-filer}}
  template:
    metadata: {labels: {app: seaweedfs-filer}}
    spec:
      tolerations:
        - key: wifi
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
      - name: filer
        image: chrislusf/seaweedfs:4.46
        env:
        # viper maps the key filer.options.max_file_name_length to this env var.
        # 0 disables the 255-byte entry-name cap: litellm's spend-log object names
        # (built from Responses-API ids) exceed it, and the filer's body-less 414
        # rejection was failing every such upload.
        - name: WEED_FILER_OPTIONS_MAX_FILE_NAME_LENGTH
          value: "0"
        args:
        - "filer"
        - "-master=seaweedfs-master:9333"
        - "-port=8888"
        - "-s3"
        - "-s3.port=8333"
        - "-s3.config=/etc/seaweedfs/s3.json"
        ports:
        - {containerPort: 8888, name: filer}
        - {containerPort: 8333, name: s3}
        resources:
          requests: {memory: "2Gi", cpu: "200m"}
          limits: {memory: "2Gi", cpu: "500m"}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-filer-data
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-config
