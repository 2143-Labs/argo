# Rendered into namespace default as Secret/tem-smtp from OpenBao
# consumers/data/john2143-com/stalwart/scaleway-tem-smtp.
#
# The same vault entry backs Secret/tem-smtp in namespace stalwart. A Secret is
# namespace-scoped and cannot be referenced across namespaces, so the credential
# is extracted twice rather than copied - one source of truth, two renderings.
# Rotating the vault entry therefore reaches both the Stalwart relay and
# asciinema.
#
# Scaleway's SMTP credential mapping is opaque: TEM_USERNAME is the SMTP
# username and API_SECRET_KEY is the SMTP password. TEM_SMTP_SERVER and
# API_ACCESS_KEY_ID are not consumed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tem-smtp
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tem-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/scaleway-tem-smtp
