# Rendered into namespace vpn-endpoints as Secret/mullvad-account from OpenBao
# consumers/data/john2143-com/vpn-endpoints/mullvad-account. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mullvad-account
  namespace: vpn-endpoints
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mullvad-account
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/vpn-endpoints/mullvad-account
