# Rendered into namespace default as Secret/bulwark-session from OpenBao
# consumers/data/john2143-com/default/bulwark-session. dataFrom.extract takes
# every key in that entry, so all three Bulwark settings live in one secret:
# SESSION_SECRET, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-session
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: bulwark-session
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/bulwark-session
