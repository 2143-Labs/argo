# Alert rules for cluster health, loaded by the grafana-sc-alerts sidecar
# (kiwigrid/k8s-sidecar, LABEL=grafana_alert) into
# /etc/grafana/provisioning/alerting.
#
# Written after 2026-11-02, when a node reboot left 20 Longhorn volumes degraded,
# one Home Assistant ext4 corrupted, and pods stuck in ContainerCreating for
# hours with nothing telling anyone. The signals below are the ones that were
# missing; every threshold is deliberately loose so normal churn stays quiet.
#
# Mimir holds three clusters: this one (series carry no `cluster` label), `doks`
# and `nonprod`. Every rule relabels the empty cluster to `home`, groups by it and
# names it in the summary, and skips `nonprod` (the np1-np3 lab would only add
# noise). Shape: label_replace(<metric>{cluster!="nonprod"} == 1, "cluster", "home", "cluster", "").
#
# The ntfy contact point is NOT here: its URL is a capability link, so it lives in
# Secret/grafana-alert-contactpoint (ExternalSecret from OpenBao) with the same
# grafana_alert label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: ntfy
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: cluster-health
        folder: Cluster
        interval: 1m
        rules:
          # A degraded volume still serves; a faulted one does not. This is the
          # signal that was silent through the whole 2026-11-02 incident.
          - uid: lh-volume-degraded
            title: Longhorn volume degraded or faulted
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  refId: A
                  editorMode: code
                  expr: sum by (cluster, pvc_namespace, pvc, state) (label_replace(longhorn_volume_robustness{state=~"degraded|faulted",cluster!="nonprod"} == 1, "cluster", "home", "cluster", ""))
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
                      operator: {type: and}
                      query: {params: [C]}
                      reducer: {type: last, params: []}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: warning, area: storage}
            annotations:
              summary: "[{{ $labels.cluster }}] {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is {{ $labels.state }}"
              description: "A Longhorn volume lost a replica. If this is faulted the workload is down; check `kubectl -n longhorn-system get volumes.longhorn.io` and whether a node is out."

          # arch sat at 92% of 443 GiB and kept evicting longhorn-manager,
          # csi-plugin and engine-images while nobody noticed.
          - uid: node-disk-pressure
            title: Node has DiskPressure
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  refId: A
                  editorMode: code
                  expr: max by (cluster, node) (label_replace(kube_node_status_condition{condition="DiskPressure",status="true",cluster!="nonprod"} == 1, "cluster", "home", "cluster", ""))
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
                      operator: {type: and}
                      query: {params: [C]}
                      reducer: {type: last, params: []}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: warning, area: node}
            annotations:
              summary: "[{{ $labels.cluster }}] {{ $labels.node }} has DiskPressure"
              description: "kubelet is evicting. Free space on that node; storage pods and anything with an emptyDir is at risk."

          # Covers today's Home Assistant: unschedulable, or failing over and over.
          - uid: pod-pending-stuck
            title: Pod stuck Pending
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 1200, to: 0}
                datasourceUid: mimir
                model:
                  refId: A
                  editorMode: code
                  expr: sum by (cluster, namespace, pod) (label_replace(kube_pod_status_phase{phase="Pending",cluster!="nonprod"} == 1, "cluster", "home", "cluster", ""))
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
                      operator: {type: and}
                      query: {params: [C]}
                      reducer: {type: last, params: []}
            noDataState: OK
            execErrState: Error
            for: 15m
            labels: {severity: warning, area: workload}
            annotations:
              summary: "[{{ $labels.cluster }}] {{ $labels.namespace }}/{{ $labels.pod }} is Pending"
              description: "kubectl describe pod: check for unschedulable taints, unbound volumes or a full filesystem."

          - uid: pod-container-waiting
            title: Container cannot start (config or image error)
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 1200, to: 0}
                datasourceUid: mimir
                model:
                  refId: A
                  editorMode: code
                  expr: sum by (cluster, namespace, pod, reason) (label_replace(kube_pod_container_status_waiting_reason{reason=~"CreateContainerConfigError|CreateContainerError|ErrImagePull|ImagePullBackOff|CrashLoopBackOff",cluster!="nonprod"} == 1, "cluster", "home", "cluster", ""))
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
                      operator: {type: and}
                      query: {params: [C]}
                      reducer: {type: last, params: []}
            noDataState: OK
            execErrState: Error
            for: 15m
            labels: {severity: warning, area: workload}
            annotations:
              summary: "[{{ $labels.cluster }}] {{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.reason }}"
              description: "A missing secret or config is the usual cause for CreateContainerConfigError; kubectl describe pod names it."

          # Running but never Ready. Added after big's 2026-11-02 reboot left
          # openbao-2 sealed and unable to rejoin the raft for hours: the pod was
          # Running, so none of the rules above saw it, and OpenBao sat at 2/3.
          - uid: pod-not-ready
            title: Pod running but not Ready
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 1200, to: 0}
                datasourceUid: mimir
                model:
                  refId: A
                  editorMode: code
                  expr: sum by (cluster, namespace, pod) (label_replace(kube_pod_status_ready{condition="false",cluster!="nonprod"} == 1, "cluster", "home", "cluster", "")) and on (cluster, namespace, pod) sum by (cluster, namespace, pod) (label_replace(kube_pod_status_phase{phase="Running",cluster!="nonprod"} == 1, "cluster", "home", "cluster", ""))
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
                      operator: {type: and}
                      query: {params: [C]}
                      reducer: {type: last, params: []}
            noDataState: OK
            execErrState: Error
            for: 30m
            labels: {severity: warning, area: workload}
            annotations:
              summary: "[{{ $labels.cluster }}] {{ $labels.namespace }}/{{ $labels.pod }} is Running but not Ready"
              description: "A readiness probe has failed for 30 minutes. For a quorum member (openbao, etcd, CNPG) this means the set is one failure from losing quorum; read the pod's logs."
