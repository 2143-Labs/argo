# Rendered into namespace default as Secret/ses-smtp from OpenBao
# consumers/data/john2143-com/stalwart/ses-smtp.
#
# The same vault entry backs Secret/ses-smtp in namespace stalwart. A Secret is
# namespace-scoped and cannot be referenced across namespaces, so the credential
# is extracted twice rather than copied - one source of truth, two renderings.
# Rotating the vault entry therefore reaches both the Stalwart relay and
# asciinema.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ses-smtp
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ses-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/ses-smtp
