# The desec-webhook chart's own Role names only desec-io-dns. Give the webhook a
# second name-scoped read for the aross.studio token. Kept separate from the
# chart's desec-webhook:secret-reader so a chart upgrade cannot drop this grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desec-webhook:aross-secret-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["desec-aross-studio-token"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:aross-secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desec-webhook:aross-secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
