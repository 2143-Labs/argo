# Rendered into namespace aross-files as Secret/seafile-secret from OpenBao
# consumers/data/john2143-com/aross-files/seafile-secret. Consumed by workloads
# unchanged - target.name must keep matching the name the StatefulSet already
# references (INIT_SEAFILE_MYSQL_ROOT_PASSWORD, SEAFILE_MYSQL_DB_PASSWORD).
# Without this the mariadb container sits in CreateContainerConfigError with
# `secret "seafile-secret" not found`, because aross-files-base only references
# the Secret and nothing creates it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-secret
  namespace: aross-files
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/aross-files/seafile-secret
