# Rendered into namespace default as Secret/listen-brick-secret from OpenBao
# consumers/data/john2143-com/default/listen-brick-secret. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: listen-brick-secret
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: listen-brick-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/listen-brick-secret
