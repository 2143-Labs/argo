# Rendered into namespace default as Secret/seafile-secret from OpenBao
# consumers/data/john2143-com/default/seafile-secret. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/seafile-secret
