# Rendered into namespace steam-lobby as Secret/steam-lobby-turn from OpenBao
# consumers/data/john2143-com/steam-lobby/steam-lobby-turn. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: steam-lobby-turn
  namespace: steam-lobby
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: steam-lobby-turn
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/steam-lobby/steam-lobby-turn
