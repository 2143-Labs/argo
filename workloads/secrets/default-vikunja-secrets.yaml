# Rendered into namespace default as Secret/vikunja-secrets from OpenBao
# consumers/data/john2143-com/default/vikunja-secrets. Consumed by the vikunja
# Deployment via envFrom - every KV field becomes a VIKUNJA_* env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-secrets
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: vikunja-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/vikunja-secrets
