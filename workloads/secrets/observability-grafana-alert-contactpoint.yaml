# The ntfy contact point for Grafana alerting, loaded by the grafana-sc-alerts
# sidecar (LABEL=grafana_alert) into /etc/grafana/provisioning/alerting.
#
# The ntfy topic URL is a capability link: anyone holding it can post to the
# topic, so it never goes in git. It is read from the OpenBao entry the ddns
# CronJob already uses (key `ntfy_url`), and ESO renders it into the provisioning
# file. If a dedicated entry is ever seeded, change only the `key` below.
#
# Grafana's webhook contact point posts its JSON payload as the message body, so
# the push reads as an alert JSON blob rather than a sentence. The title header
# carries the rule name, which is what the notification preview shows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alert-contactpoint
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-alert-contactpoint
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_alert: "1"
      data:
        contactpoints.yaml: |
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: ntfy
              receivers:
                - uid: ntfy
                  type: webhook
                  disableResolveMessage: false
                  settings:
                    url: {{ .url | quote }}
                    httpMethod: POST
  data:
    - secretKey: url
      remoteRef:
        key: john2143-com/ddns/desec-ddns
        property: ntfy_url
