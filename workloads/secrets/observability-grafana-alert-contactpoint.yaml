# The ntfy contact point for Grafana alerting, loaded by the grafana-sc-alerts
# sidecar (LABEL=grafana_alert) into /etc/grafana/provisioning/alerting.
#
# The ntfy topic URL is a capability link: anyone holding it can post to the
# topic, so it never goes in git. It is read from the OpenBao entry the ddns
# CronJob already uses (key `ntfy_url`), and ESO renders it into the provisioning
# file. If a dedicated entry is ever seeded, change only the `key` below.
#
# Grafana's webhook posts its alert JSON as the request body, and ntfy would show
# that raw body. `?template=grafana` makes ntfy parse it instead: the push title
# becomes "🚨 <title>" / "✅ <title>" and the body "<message>" cut at 2000 chars.
# `title` and `message` below build those two fields: one "• [cluster] ns/pod is …"
# line per alert, so a 14-alert group stays readable. The {{ backtick-quoted }}
# raw strings keep ESO from evaluating Grafana's template syntax.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alert-contactpoint
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-alert-contactpoint
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_alert: "1"
      data:
        contactpoints.yaml: |
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: ntfy
              receivers:
                - uid: ntfy
                  type: webhook
                  disableResolveMessage: false
                  settings:
                    url: {{ printf "%s%stemplate=grafana" .url (ternary "&" "?" (contains "?" .url)) | quote }}
                    httpMethod: POST
                    title: {{ `'{{ .CommonLabels.alertname }}{{ if gt (len .Alerts.Firing) 1 }} ×{{ len .Alerts.Firing }}{{ end }}'` }}
                    message: {{ `'{{ range .Alerts.Firing }}• {{ or .Annotations.summary .Labels.alertname }}{{ "\n" }}{{ end }}{{ if .Alerts.Firing }}{{ with .CommonAnnotations.description }}{{ "\n" }}{{ . }}{{ end }}{{ end }}{{ if .Alerts.Resolved }}Resolved:{{ "\n" }}{{ range .Alerts.Resolved }}• {{ or .Annotations.summary .Labels.alertname }}{{ "\n" }}{{ end }}{{ end }}'` }}
  data:
    - secretKey: url
      remoteRef:
        key: john2143-com/ddns/desec-ddns
        property: ntfy_url
