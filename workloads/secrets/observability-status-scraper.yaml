# Scrape token Alloy sends to status-1's /metrics (Caddy basic_auth, user "scraper").
# The bcrypt hash of the same token is committed in status/deploy/Caddyfile.
# The plaintext is written by the owner to consumers/john2143-com/observability/status-scraper.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: status-scraper
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: status-scraper
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/observability/status-scraper
