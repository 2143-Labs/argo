# Rendered into namespace crowdsec as Secret/crowdsec-lapi-secrets from OpenBao
# consumers/data/john2143-com/crowdsec/crowdsec-lapi-secrets. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi-secrets
  namespace: crowdsec
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: crowdsec-lapi-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/crowdsec/crowdsec-lapi-secrets
