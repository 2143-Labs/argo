# Rendered into namespace default as Secret/frigate-genai-worker-creds from OpenBao
# consumers/data/john2143-com/default/frigate-genai-worker-creds. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-genai-worker-creds
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: frigate-genai-worker-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/frigate-genai-worker-creds
