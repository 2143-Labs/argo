# Rendered into namespace renovate as Secret/renovate-token from OpenBao
# consumers/data/john2143-com/renovate/renovate-token (vault key `token`).
#
# Fine-grained PAT owned by John2143, scoped to 2143-Labs/argo: Contents and
# Pull requests read-write, Issues read-write (the Dependency Dashboard is an
# issue), Metadata read. No other repository, no org scope.
#
# Rotation: put the new token into the vault entry, delete the rendered Secret
# (`kubectl -n renovate delete secret renovate-token`) so ESO re-creates it,
# then revoke the old token and prove the new one with
# `kubectl -n renovate create job --from=cronjob/renovate renovate-rotate`.
# A stale token surfaces as 401s in that Job's log, not as a Degraded app: the
# CronJob object stays healthy either way.
#
# Expires: <PAT expiry date, filled in when the token is created>. GitHub
# fine-grained tokens expire (one year at most), and an expired token is only
# visible as a 401 in a weekly Job log, so keep this line current.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-token
  namespace: renovate
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: renovate-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/renovate/renovate-token
