# Rendered into namespace vpn-endpoints as Secret/tailscale-bootstrap from OpenBao
# consumers/data/john2143-com/vpn-endpoints/tailscale-bootstrap. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-bootstrap
  namespace: vpn-endpoints
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tailscale-bootstrap
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/vpn-endpoints/tailscale-bootstrap
