# Rendered into namespace matrix as Secret/tuwunel-turn from OpenBao
# consumers/data/john2143-com/matrix/tuwunel-turn. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-turn
  namespace: matrix
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tuwunel-turn
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/matrix/tuwunel-turn
