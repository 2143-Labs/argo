# Scrape key Alloy presents to the llm-proxy /metrics endpoint. The value is a
# LiteLLM virtual key: it lives in the proxy's Postgres, is created out of band
# (nothing in this repo generates virtual keys), and the owner writes the
# plaintext to consumers/john2143-com/observability/litellm-metrics as `api_key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-metrics
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: litellm-metrics
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/observability/litellm-metrics
