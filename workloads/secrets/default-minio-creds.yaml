# Rendered into namespace default as Secret/minio-creds from OpenBao
# consumers/data/john2143-com/default/minio-creds. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-creds
  namespace: default
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/minio-creds
