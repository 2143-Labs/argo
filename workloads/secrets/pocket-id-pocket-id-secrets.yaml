# Rendered into namespace pocket-id as Secret/pocket-id-secrets from OpenBao
# consumers/data/john2143-com/pocket-id/pocket-id-secrets. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pocket-id-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/pocket-id/pocket-id-secrets
