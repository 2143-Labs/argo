# Rendered into namespace default as Secret/litellm-s3-creds from OpenBao
# consumers/data/john2143-com/default/litellm-s3-creds. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-s3-creds
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: litellm-s3-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/litellm-s3-creds
