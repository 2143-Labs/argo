# Rendered into namespace default as Secret/seaweedfs-credentials from OpenBao
# consumers/data/john2143-com/default/seaweedfs-credentials. SeaweedFS S3 identity (SEAWEEDFS_ACCESS_KEY/SEAWEEDFS_SECRET_KEY);
# written by scripts/seaweedfs-rotate.py propagate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-credentials
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/seaweedfs-credentials
