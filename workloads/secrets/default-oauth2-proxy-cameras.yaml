# Rendered into namespace default as Secret/oauth2-proxy-cameras from OpenBao
# consumers/data/john2143-com/default/oauth2-proxy-cameras. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cameras
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-cameras
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/oauth2-proxy-cameras
