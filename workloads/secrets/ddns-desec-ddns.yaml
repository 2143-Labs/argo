# Rendered into namespace ddns as Secret/desec-ddns from OpenBao
# consumers/data/john2143-com/ddns/desec-ddns (vault keys `token`, `ntfy_url`).
#
# The token is a deSEC API token named k3s-ddns with rights on john2143.com,
# 2143.me, dsstar.us and balabusta.homes. It replaced home-pi's token so the
# updater no longer depends on a WAN-exposed host. The CronJob mounts the whole
# Secret at /secret and reads /secret/token and /secret/ntfy_url.
#
# Rotation: rewrite `token` in the vault entry, force-sync this ExternalSecret,
# run the FORCE=1 job from docs/fleet-patching.md, then revoke the old token in
# deSEC. Do not revoke until the forced run reports UPDATED for all four domains.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desec-ddns
  namespace: ddns
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: desec-ddns
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/ddns/desec-ddns
