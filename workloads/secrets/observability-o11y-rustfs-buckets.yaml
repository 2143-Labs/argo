# Rendered into namespace observability as Secret/o11y-rustfs-buckets from OpenBao
# consumers/data/john2143-com/observability/o11y-rustfs-buckets. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: o11y-rustfs-buckets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: o11y-rustfs-buckets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/observability/o11y-rustfs-buckets
