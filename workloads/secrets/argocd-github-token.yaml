# Rendered into namespace argocd as Secret/github-token from OpenBao
# consumers/data/john2143-com/argocd/github-token (vault key `token`).
#
# A fine-grained GitHub PAT owned by 2143-Labs. The pullRequest generators of the
# PR-preview ApplicationSets read it through
# tokenRef {secretName: github-token, key: token}: apps/how-poe-sale-preview.yaml,
# apps/moss-and-wool-preview.yaml, apps/rots-web-preview.yaml,
# apps/status-design-preview.yaml and apps/steam-lobby-preview.yaml.
# 2143-Labs/Moss-And-Wool is private: the token must keep Pull requests: Read on
# it, or moss-preview fails with 404 on /pulls. The other repos are public; for
# them the token only lifts the API rate limit.
#
# Rotation: put the new token into the vault entry, force-sync this
# ExternalSecret, check the five ApplicationSets, then revoke the old token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: argocd
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/argocd/github-token
