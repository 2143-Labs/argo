# Rendered into namespace argocd as Secret/github-token from OpenBao
# consumers/data/john2143-com/argocd/github-token (vault key `token`).
#
# A fine-grained GitHub PAT, read-only on public repositories. The pullRequest
# generators of the PR-preview ApplicationSets read it through
# tokenRef {secretName: github-token, key: token}: apps/how-poe-sale-preview.yaml,
# apps/rots-web-preview.yaml, apps/status-design-preview.yaml and
# apps/steam-lobby-preview.yaml. Every repo they watch is public, so the token
# needs no repository permissions; it only lifts the API rate limit.
#
# Rotation: put the new token into the vault entry, force-sync this
# ExternalSecret, check the four ApplicationSets, then revoke the old token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: argocd
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/argocd/github-token
