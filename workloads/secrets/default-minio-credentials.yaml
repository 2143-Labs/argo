# Rendered into namespace default as Secret/minio-credentials from OpenBao
# consumers/data/john2143-com/default/minio-credentials. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/minio-credentials
