# Rendered into namespace matrix as Secret/heorot-voice-relay from OpenBao
# consumers/data/john2143-com/matrix/heorot-voice-relay. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: heorot-voice-relay
  namespace: matrix
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: heorot-voice-relay
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/matrix/heorot-voice-relay
