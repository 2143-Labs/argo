# Rendered into namespace stalwart as Secret/ses-smtp from OpenBao
# consumers/data/john2143-com/stalwart/ses-smtp. Read by the Stalwart Deployment's
# SES_SMTP_USER / SES_SMTP_PASS environment variables and referenced by the `ses`
# MtaRoute relay (authSecret: EnvironmentVariable SES_SMTP_PASS).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ses-smtp
  namespace: stalwart
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ses-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/ses-smtp
