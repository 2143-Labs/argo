# Rendered into namespace default as Secret/headscale-oidc from OpenBao
# consumers/data/john2143-com/default/headscale-oidc. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: headscale-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/headscale-oidc
