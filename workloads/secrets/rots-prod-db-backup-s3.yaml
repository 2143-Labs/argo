# Rendered into namespace rots-prod as Secret/db-backup-s3 from OpenBao
# consumers/data/john2143-com/default/db-backup-s3. It holds the Backblaze B2 writer
# key plus the shared SSE-C customer key and the region. Backblaze offers no
# capability-restricted key: even the narrowest console key carries deleteFiles and
# bypassGovernance, so this key could *ask* to delete. What protects history is the
# bucket's COMPLIANCE retention, which refuses deletes even from the account admin
# key. db-backup-bucket-check and db-backup-config-drift exist to notice if that
# stops being true. Consumed by
# ObjectStore rots-db-offsite. docs/db-backups.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-backup-s3
  namespace: rots-prod
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-backup-s3
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/db-backup-s3
