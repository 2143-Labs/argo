# Rendered into namespace rots-prod as Secret/db-backup-s3 from OpenBao
# consumers/data/john2143-com/default/db-backup-s3. It holds the write-only Backblaze
# B2 key (no deleteFiles capability, so it cannot delete a backup or a locked
# version) plus the shared SSE-C customer key and the region. Consumed by
# ObjectStore rots-db-offsite. docs/db-backups.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-backup-s3
  namespace: rots-prod
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-backup-s3
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/db-backup-s3
