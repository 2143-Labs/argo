# Rendered into namespace matrix as Secret/seaweedfs-s3-creds from OpenBao
# consumers/data/john2143-com/matrix/seaweedfs-s3-creds. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-creds
  namespace: matrix
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/matrix/seaweedfs-s3-creds
