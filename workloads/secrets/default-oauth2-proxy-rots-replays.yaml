# Rendered into namespace default as Secret/oauth2-proxy-rots-replays from OpenBao
# consumers/data/john2143-com/default/oauth2-proxy-rots-replays. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment references.
#
# The Pocket ID client (callback https://rots-replays.ts.2143.me/oauth2/callback, restricted to
# group `admin`) and these three properties - client-id, client-secret, cookie-secret (32 random
# bytes, base64) - are created by hand; until they exist the proxy pod sits in
# CreateContainerConfigError, which is expected and harmless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-rots-replays
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-rots-replays
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/oauth2-proxy-rots-replays
