# Rendered into namespace matrix as Secret/livekit-keys from OpenBao
# consumers/data/john2143-com/matrix/livekit-keys. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-keys
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: livekit-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/matrix/livekit-keys
