# Rendered into namespace default as Secret/mongo-creds from OpenBao
# consumers/data/john2143-com/default/mongo-creds. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-creds
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mongo-creds
    creationPolicy: Owner
    # worker-uri is composed here instead of being taken from OpenBao verbatim:
    # it has to point at the DigitalOcean cluster's NodePort through the WireGuard
    # tunnel (10.99.0.2), not at the public mongo.john2143.com:32040, which stops
    # answering once the DO cloud firewall rule for 32040 is removed. The password
    # still comes from OpenBao, so nothing secret lives in this public repo. If the
    # tunnel address ever changes, change it here.
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        server-uri: '{{ index . "server-uri" }}'
        worker-uri: 'mongodb://{{ .username }}:{{ .password }}@10.99.0.2:32040/'
  dataFrom:
    - extract:
        key: john2143-com/default/mongo-creds
