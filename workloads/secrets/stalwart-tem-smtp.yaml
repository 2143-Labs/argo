# Rendered into namespace stalwart as Secret/tem-smtp from OpenBao
# consumers/data/john2143-com/stalwart/scaleway-tem-smtp. Read by the Stalwart
# Deployment's TEM_SMTP_USER / TEM_SMTP_PASS environment variables and
# referenced by the `tem` MtaRoute relay
# (authSecret: EnvironmentVariable TEM_SMTP_PASS).
#
# The vault entry's four keys are TEM_SMTP_SERVER (hostname), TEM_USERNAME,
# API_ACCESS_KEY_ID and API_SECRET_KEY. Scaleway's SMTP credential mapping is
# opaque: TEM_USERNAME is the SMTP username and API_SECRET_KEY is the SMTP
# password. TEM_SMTP_SERVER and API_ACCESS_KEY_ID are not consumed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tem-smtp
  namespace: stalwart
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tem-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/stalwart/scaleway-tem-smtp
