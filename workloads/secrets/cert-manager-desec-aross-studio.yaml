# deSEC API token for aross.studio. ClusterIssuer solvers read their token from
# the cluster resource namespace (cert-manager), not the Certificate namespace.
# aross.studio lives in a separate deSEC account, so it cannot share desec-io-dns;
# letsencrypt-prod's second dns01 entry (selector dnsZones [aross.studio]) names
# this Secret. Rendered from OpenBao consumers/data/john2143-com/ddns/desec-aross-studio
# (vault key `token`). The webhook reads it via desec-webhook:aross-secret-reader.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desec-aross-studio-token
  namespace: cert-manager
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: desec-aross-studio-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/ddns/desec-aross-studio
