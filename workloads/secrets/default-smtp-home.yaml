# Rendered into namespace default as Secret/smtp-home from OpenBao
# consumers/data/john2143-com/default/smtp-home. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-home
  namespace: default
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: smtp-home
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/smtp-home
