# Merges ONE key - webhook.github.secret - into the existing Secret/argocd/argocd-secret,
# from OpenBao consumers/data/john2143-com/argocd/webhook-github (vault key `secret`).
# This is the shared secret GitHub signs webhook deliveries with, for hook 662488712 on
# 2143-Labs/argo (argocd-server, /api/webhook) and hook 663721590 on 2143-Labs/steam-lobby
# (applicationset-controller). Both components read this same key. Runbook:
# docs/2026-09-29-argocd-github-webhook.md
#
# Unlike every other file in this directory, this one is NOT creationPolicy: Owner.
# argocd-core (bootstrap/argocd/install.yaml) creates argocd-secret, and it holds Argo CD's
# own generated keys: admin password, server.secretkey, the TLS pair, and the OIDC client
# secret. Owner would replace the whole Secret and destroy them. Merge only adds the
# key below and never creates the Secret.
#
# target.template is set, with no data templates, for one reason: it stops ESO from copying
# this ExternalSecret's own annotations onto argocd-secret. Without a template ESO copies them
# (look at any Owner-rendered Secret here: it carries the ExternalSecret's tracking-id), and
# that would overwrite argocd-core's argocd.argoproj.io/tracking-id on argocd-secret.
#
# `data` (one named property) instead of `dataFrom.extract`, so that nothing else later added
# to the vault entry can ever be merged into argocd-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-github
  namespace: argocd
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: john2143-com/argocd/webhook-github
        property: secret
