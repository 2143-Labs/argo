# Rendered into namespace default as Secret/seaweedfs-s3-config from OpenBao
# consumers/data/john2143-com/default/seaweedfs-s3-config. Consumed by workloads unchanged -
# target.name must keep matching the name the Deployment already references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: default
spec:
  refreshInterval: 2m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: john2143-com/default/seaweedfs-s3-config
