name: Validate route gates

on:
  pull_request:
    paths:
      - apps/**
      - workloads/**
      - helm_modules/**
      - scripts/lib/**
      - scripts/validate-route-gates.sh
      - scripts/validate-game-edge.sh
      - scripts/route-gate-exemptions.txt
      - .github/workflows/validate-route-gates.yml
  push:
    paths:
      - apps/**
      - workloads/**
      - helm_modules/**
      - scripts/lib/**
      - scripts/validate-route-gates.sh
      - scripts/validate-game-edge.sh
      - scripts/route-gate-exemptions.txt
      - .github/workflows/validate-route-gates.yml

permissions:
  contents: read

concurrency:
  group: validate-route-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Every HTTPRoute rule carries an edge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate route gates
        run: nix develop --fallback -c ./scripts/validate-route-gates.sh

  game-edge:
    name: Every game app is tagged and uses the game-edge library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate game edge
        run: nix develop --fallback -c ./scripts/validate-game-edge.sh
