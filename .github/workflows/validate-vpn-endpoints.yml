name: Validate VPN endpoints

on:
  pull_request:
    paths:
      - apps/vpn-endpoints.yaml
      - workloads/vpn-endpoints/**
      - workloads/secrets/vpn-endpoints-mullvad-account.yaml
      - workloads/secrets/vpn-endpoints-tailscale-bootstrap.yaml
      - scripts/lib/**
      - scripts/validate-vpn-endpoints.sh
      - scripts/vpn-endpoints-expected.json
      - .github/workflows/vpn-enroll-image.yml
      - flake.nix
      - flake.lock
      - .github/workflows/validate-vpn-endpoints.yml
  push:
    paths:
      - apps/vpn-endpoints.yaml
      - workloads/vpn-endpoints/**
      - workloads/secrets/vpn-endpoints-mullvad-account.yaml
      - workloads/secrets/vpn-endpoints-tailscale-bootstrap.yaml
      - scripts/lib/**
      - scripts/validate-vpn-endpoints.sh
      - scripts/vpn-endpoints-expected.json
      - .github/workflows/vpn-enroll-image.yml
      - flake.nix
      - flake.lock
      - .github/workflows/validate-vpn-endpoints.yml

permissions:
  contents: read

concurrency:
  group: validate-vpn-endpoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate VPN endpoints
        run: nix develop --fallback -c ./scripts/validate-vpn-endpoints.sh
