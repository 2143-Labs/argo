name: Validate policies

on:
  pull_request:
    paths:
      - apps/**
      - workloads/**
      - policies/**
      - scripts/lib/**
      - scripts/validations/**
      - scripts/validate-policies.sh
      - .github/workflows/validate-policies.yml
  push:
    paths:
      - apps/**
      - workloads/**
      - policies/**
      - scripts/lib/**
      - scripts/validations/**
      - scripts/validate-policies.sh
      - .github/workflows/validate-policies.yml

permissions:
  contents: read

concurrency:
  group: validate-policies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Declared edge policy holds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate policies
        run: nix develop --fallback -c ./scripts/validate-policies.sh
