name: Validate doc links

# No paths filter: a rename anywhere in the repo can break a path a guide names.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validate-doc-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, anchors and guide paths resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate doc links
        run: nix develop --fallback -c ./scripts/validate-doc-links.sh
