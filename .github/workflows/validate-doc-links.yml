name: Validate doc links

# No paths filter: a rename anywhere in the repo can break a path a guide names.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validate-doc-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, anchors and guide paths resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Validate doc links
        run: nix develop -c ./scripts/validate-doc-links.sh
