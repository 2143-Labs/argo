apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuwunel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/magikid/modern-conduwuit-helm
    chart: conduwuit
    targetRevision: 2.1.0
    helm:
      releaseName: tuwunel
      values: |
        image:
          repository: ghcr.io/matrix-construct/tuwunel
          tag: v1.9.1
          pullPolicy: IfNotPresent
        server_name: "matrix.2143.me"
        database_path: "/var/lib/tuwunel"

        config:
          global:
            server_name: "matrix.2143.me"
            database_path: "/var/lib/tuwunel"
            allow_registration: false
            allow_federation: false
            allow_encryption: true
            allow_room_creation: true

            turn_uris:
              - "turn:192.168.6.21:3478?transport=udp"
              - "turn:192.168.6.21:3478?transport=tcp"
            turn_secret_file: "/etc/tuwunel/secrets/turn/turn_secret"

            well_known:
              client: "https://matrix.2143.me"
              livekit_url: "https://livekit.john2143.com"

            identity_provider:
              - brand: "PocketID"
                client_id: "dee01da6-5f13-4f11-9626-3dfef252c385"
                client_secret_file: "/etc/tuwunel/secrets/client_secret"
                issuer_url: "https://au.2143.me"
                callback_url: "https://matrix.2143.me/_matrix/client/unstable/login/sso/callback/dee01da6-5f13-4f11-9626-3dfef252c385"
                default: true
                registration: true

        persistence:
          data:
            storageClass: "longhorn-3"
            size: "4Gi"
            accessMode: ReadWriteOnce

        service:
          type: ClusterIP
          port: 8008

        ingress:
          enabled: false

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2"
  destination:
    server: https://kubernetes.default.svc
    namespace: matrix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/spec/volumes
        - /spec/template/spec/containers/0/volumeMounts
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
