# Converted from apps/alloy.yaml (bigp nonprod plan, Step 6.0); spec verbatim.
# One Application per cluster labelled env=prod|nonprod: `alloy` on prod
# (name unchanged, re-adopts via tracking-id) and `alloy-nonprod`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [prod, nonprod]
  template:
    metadata:
      name: 'alloy{{ if ne (index .metadata.labels "env") "prod" }}-{{ index .metadata.labels "env" }}{{ end }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: default
      sources:
        - chart: alloy
          repoURL: https://grafana.github.io/helm-charts
          targetRevision: 1.12.1
          helm:
            releaseName: alloy
            valueFiles:
              - '$values/workloads/alloy/values-{{ index .metadata.labels "env" }}.yaml'
        - repoURL: https://github.com/2143-Labs/argo.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
