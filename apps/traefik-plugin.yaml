apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-plugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/argo.git
    targetRevision: HEAD
    path: workloads/traefik-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply stores the whole manifest in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which is
      # capped at 256 KiB; this ConfigMap is ~505 KB of base64. SSA does not
      # write that annotation.
      - ServerSideApply=true
