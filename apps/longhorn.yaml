apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: 1.13.0
    helm:
      releaseName: longhorn
      values: |
        # The pre-upgrade-checker is a helm pre-upgrade hook Job. Argo
        # applies hooks in a PreSync wave BEFORE the chart's ServiceAccount
        # exists, so the Job fails to create with "serviceaccount
        # longhorn-service-account not found". Upstream's values.yaml
        # comment literally tells GitOps users to disable it. We keep
        # upgradeVersionCheck enabled — that runs in the manager Pod after
        # the SA exists, so it's not affected by the same race.
        preUpgradeChecker:
          jobEnabled: false
          upgradeVersionCheck: true
        defaultSettings:
          # Default disk path on labeled nodes. Both closet and arch have
          # /mnt/longhorn pre-prepared (see arch-hardware-configuration.nix
          # for arch's mount; closet uses the existing /mnt/sda1).
          # Nas uses /var/lib/longhorn (ext4 on /dev/sda6) — set via
          # Longhorn node CRD after boot.
          defaultDataPath: /mnt/longhorn
          defaultReplicaCount: 3
          # Automatically force-delete Deployment pods on a down node so
          # RWO PVCs release and volumes reattach to replacement pods on
          # healthy nodes. Without this, pods stay Terminating indefinitely
          # and services are stuck until the node returns (or manual cleanup).
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          # 3600, not 1800. Longhorn waits at most this long for a failed replica
          # to return before creating a new one in its place, and a new replica
          # starts empty: the 2026-11-26 42-minute outage produced three
          # recreated replicas and a mandatory 37.3 GiB / 300 s copy on nas.
          # One hour keeps a reboot, and any outage a person sits through, on the
          # incremental path. The cost is that a permanently dead node now leaves
          # its volumes one replica short for up to an hour before Longhorn
          # replaces the replica.
          replicaReplenishmentWaitInterval: 3600
          # Cap simultaneous replica rebuilds per node (built-in default 5;
          # this cluster had been hand-set to 10 through the UI). Only affects
          # replicated volumes — longhorn-cnpg runs one copy and never rebuilds.
          concurrentReplicaRebuildPerNodeLimit: 5
          # Hash snapshot files every day after the nightly backup, instead of
          # weekly. nightly-backup (03:00 local = 08:00Z EST / 07:00Z EDT) folds
          # each volume into one new snapshot file, and a new file has no
          # checksum; without one on both sides a rebooted node's replicas are
          # compared block by block instead of skipped (fast replica rebuild).
          # 2026-11-23: closet took 630 s from uncordon to all-healthy and read
          # 218 GB doing it. The schedule is UTC. It fires every 10 min for four
          # hours because one firing only retries for ~17 min and hashing runs
          # one file at a time per node (~570 GB, 1.5-3 h for everything); a
          # firing that finds a file already hashed skips it. All Longhorn data
          # disks are SSDs; the cost is that read load, daily, 04:00-08:00 EST.
          snapshotDataIntegrityCronjob:
            v1: "*/10 9-12 * * *"
            v2: "*/10 9-12 * * *"
          # Backup target — NFS to the NAS. If unreachable, only new backup
          # uploads are affected; live volumes are untouched.
          backupTarget: nfs://nas.ts.2143.me:/tank/longhorn-backups
          backupTargetCredentialSecret: ""
          # Longhorn tolerates seated/wifi/pi with operator Equal "true". Only `pi`
          # is live today. Wifi-only nodes are tainted wifi=no-network-storage, which
          # these tolerations deliberately do NOT match, so Longhorn never runs on a
          # wifi node (see workloads/wifi-node-policy). Never tolerate `wifi` with
          # operator Exists here. Changing this setting is refused while any volume
          # is attached, so it is intentionally left as-is.
          taintToleration: "seated=true:NoSchedule; wifi=true:NoSchedule; pi=true:NoSchedule"
        longhornManager:
          tolerations:
            - key: seated
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: wifi
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: pi
              operator: Equal
              value: "true"
              effect: NoSchedule
        longhornDriver:
          tolerations:
            - key: seated
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: wifi
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: pi
              operator: Equal
              value: "true"
              effect: NoSchedule
        longhornUI:
          tolerations:
            - key: seated
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: wifi
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: pi
              operator: Equal
              value: "true"
              effect: NoSchedule
        persistence:
          # We ship our own StorageClass in workloads/storage/.
          defaultClass: false
          defaultClassReplicaCount: 3
        ingress:
          enabled: false
        # 1.12.1 renders internal NetworkPolicies by default. k3s enforces
        # NetworkPolicy (kube-router), and a mis-scoped policy here can fault
        # volumes mid-upgrade. Keep the new restriction off; revisit separately.
        networkPolicies:
          restrictInternalTraffic: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
