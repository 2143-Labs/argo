apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 18.13.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SimpleScalable
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 2
          ingester:
            autoforget_unhealthy: true
          memberlistConfig:
            join_members:
              - dns+loki-memberlist.observability.svc.cluster.local:7946
            abort_if_cluster_join_fails: false
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  period: 24h
                  prefix: index_
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
              admin: loki-admin
            s3:
              endpoint: files.john2143.com
              s3ForcePathStyle: true
              insecure: false
              access_key_id: ${S3_ACCESS_KEY}
              secret_access_key: ${S3_SECRET_KEY}
          limits_config:
            retention_period: 2160h
          compactor:
            retention_enabled: true
            delete_request_store: s3
        write:
          podAnnotations:
            reloader.stakater.com/auto: "true"
          replicas: 2
          # Request matches the 14-day p95 (517 Mi). The limit contains a
          # repeat of the 2026-10-06 S3 outage, where write peaked at 11.6 Gi,
          # so the pod is killed instead of the node running out.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 8Gi
          persistence:
            storageClass: longhorn-1
            size: 20Gi
          extraArgs:
            - "-config.expand-env=true"
          extraEnv:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_SECRET_KEY
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["arch"]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: write
                  app.kubernetes.io/instance: loki
        read:
          podAnnotations:
            reloader.stakater.com/auto: "true"
          replicas: 2
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          extraArgs:
            - "-config.expand-env=true"
          extraEnv:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_SECRET_KEY
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["arch"]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: read
                  app.kubernetes.io/instance: loki
        backend:
          podAnnotations:
            reloader.stakater.com/auto: "true"
          replicas: 2
          # backend held 7.6 Gi for 32 h on 2026-10-03..05 (compaction-era
          # plateau); p50 is 182 Mi.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 8Gi
          persistence:
            storageClass: longhorn
            size: 10Gi
          extraArgs:
            - "-config.expand-env=true"
          extraEnv:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-rustfs-buckets
                  key: S3_SECRET_KEY
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["arch"]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: backend
                  app.kubernetes.io/instance: loki
        gateway:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
        chunksCache:
          # Chart default; set explicitly because 4096 used to sit here under
          # the wrong key and was silently ignored.
          allocatedMemory: 8192
          # Required, not preferred: as preferred they drifted onto closet
          # during the 2026-10-14 big reboot and stayed. While big is down
          # these pods stay Pending; Loki is expected to fall back to direct
          # S3 reads (slower) — that fallback is unverified, so the gate below
          # requires a working query.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
        resultsCache:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["big"]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].spec.storageClassName
