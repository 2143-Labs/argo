apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: crowdsec
    repoURL: https://crowdsecurity.github.io/helm-charts
    targetRevision: 0.24.0
    helm:
      releaseName: crowdsec
      values: |
        agent:
          enabled: false
          hostVarLog: true
          container_runtime: containerd
          acquisition:
            - namespace: kube-system
              podName: "traefik-*"
              program: traefik
        appsec:
          enabled: true
          acquisitions:
            - source: appsec
              listen_addr: "0.0.0.0:7422"
              path: /
              appsec_config: crowdsecurity/crs-vpatch
              labels:
                type: appsec
          configs:
            crs-vpatch.yaml: |
              name: crowdsecurity/crs-vpatch
              default_remediation: ban
              #log_level: debug
              outofband_rules:
                - crowdsecurity/crs
              inband_rules:
                - crowdsecurity/base-config
                - crowdsecurity/vpatch-*
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs"
        lapi:
          replicas: 1
          persistentVolume:
            data:
              storageClassName: longhorn-2
            config:
              storageClassName: longhorn-2
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
