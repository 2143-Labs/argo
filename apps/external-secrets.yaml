apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      values: |
        # Reuse one OpenBao token across reconciles. Without this ESO logs in
        # to `auth/kubernetes/login` roughly 1.6x per reconcile, which triples
        # the audit-log volume: every login and every read is audited, and the
        # audit device has no filtering (see docs/2026-09-13-secrets-inventory.md).
        extraArgs:
          enable-vault-token-cache: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true