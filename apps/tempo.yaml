apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 2.4.0
    helm:
      releaseName: tempo
      values: |
        podAnnotations:
          reloader.stakater.com/auto: "true"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["big"]
        tempo:
          storage:
            trace:
              backend: s3
              s3:
                endpoint: files.john2143.com
                bucket: tempo-blocks
                insecure: false
                forcepathstyle: true
                access_key: ${S3_ACCESS_KEY}
                secret_key: ${S3_SECRET_KEY}
          retention: 168h
          # TraceQL metrics / Traces Drilldown. Without storage.path Tempo runs the
          # generator as an idle no-op and its ring stays empty ("empty ring").
          # Only local-blocks is enabled, so nothing is remote-written; the chart
          # always renders remote_write, hence remoteWriteUrl.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://mimir.observability.svc:8080/api/v1/push
            storage:
              path: /tmp/tempo
            traces_storage:
              path: /tmp/traces
            processor:
              local_blocks:
                flush_to_storage: true
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - local-blocks
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
          extraArgs:
            config.expand-env: "true"
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
