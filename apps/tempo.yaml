apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 3.2.1
    helm:
      releaseName: tempo
      values: |
        podAnnotations:
          reloader.stakater.com/auto: "true"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["big"]
        tempo:
          # Liveness must not probe /ready. Tempo returns 503 there while a cold
          # start is still settling (WAL replay, block reload, the 5-minute
          # blocklist poll), and liveness turns that into a kill loop: on
          # 2026-11-16T21:40Z the pod was evicted with node big's reboot, never
          # became Ready again, restarted 722 times in 48 h, the Service had no
          # endpoints and Alloy dropped every span ("sending queue is full").
          # Chart 2.4.0 templates no startupProbe value, so probe the port Tempo
          # binds within seconds instead; /ready stays the readiness gate, so an
          # unready pod is kept out of the Service without being killed.
          livenessProbe:
            # The chart's default httpGet survives a values deep-merge, and a
            # probe with both httpGet and tcpSocket is rejected, so it must be
            # nulled explicitly rather than merely superseded.
            httpGet: null
            tcpSocket:
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          storage:
            trace:
              backend: s3
              s3:
                endpoint: seaweedfs-s3.default.svc:8333
                bucket: tempo-blocks
                insecure: true
                forcepathstyle: true
                access_key: ${S3_ACCESS_KEY}
                secret_key: ${S3_SECRET_KEY}
          retention: 168h
          # Span metrics (RED per service/operation, remote-written to Mimir) and
          # TraceQL metrics / Traces Drilldown. Without storage.path Tempo runs the
          # generator as an idle no-op and its ring stays empty ("empty ring").
          # Tempo 3 builds blocks in the live-store, so the local_blocks processor
          # and traces_storage of Tempo 2 are gone: passing either makes the binary
          # refuse to start ("field local_blocks not found in ProcessorConfig").
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://mimir.observability.svc:8080/api/v1/push
            storage:
              path: /tmp/tempo
            processor:
              # traces_spanmetrics_{calls,latency,duration,size}_* in Mimir, grouped by
              # service/span_name/span_kind/status_code (the defaults - no resource
              # attributes, which would be one series set per instance). The 60 s top
              # bucket is for `k8s.provision`, which creates a StatefulSet and a PVC.
              # Only spans the app SDKs emit: Beyla reports the same requests as
              # http_*/rpc_* metrics, and its spans were 97% of these series
              # (2026-11-12). The second rule drops library-internal spans (h2
              # framing, Temporal SDK polling). Policies are ANDed; the regex is
              # unanchored, hence the ^.
              span_metrics:
                histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
                filter_policies:
                  - exclude:
                      match_type: strict
                      attributes:
                        - key: resource.telemetry.sdk.name
                          value: beyla
                  - exclude:
                      match_type: regex
                      attributes:
                        - key: span.code.module.name
                          value: '^(h2|temporalio_sdk)'
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - span-metrics
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
          extraArgs:
            config.expand-env: "true"
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
