apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 2.4.0
    helm:
      releaseName: tempo
      values: |
        podAnnotations:
          reloader.stakater.com/auto: "true"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["big"]
        tempo:
          storage:
            trace:
              backend: s3
              s3:
                endpoint: seaweedfs-s3.default.svc:8333
                bucket: tempo-blocks
                insecure: true
                forcepathstyle: true
                access_key: ${S3_ACCESS_KEY}
                secret_key: ${S3_SECRET_KEY}
          retention: 168h
          # Span metrics (RED per service/operation, remote-written to Mimir) and
          # TraceQL metrics / Traces Drilldown. Without storage.path Tempo runs the
          # generator as an idle no-op and its ring stays empty ("empty ring").
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://mimir.observability.svc:8080/api/v1/push
            storage:
              path: /tmp/tempo
            traces_storage:
              path: /tmp/traces
            processor:
              local_blocks:
                flush_to_storage: true
              # traces_spanmetrics_{calls,latency,duration,size}_* in Mimir, grouped by
              # service/span_name/span_kind/status_code (the defaults - no resource
              # attributes, which would be one series set per instance). The 60 s top
              # bucket is for `k8s.provision`, which creates a StatefulSet and a PVC.
              span_metrics:
                histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - local-blocks
                  - span-metrics
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
          extraArgs:
            config.expand-env: "true"
          extraEnvFrom:
            - secretRef:
                name: o11y-rustfs-buckets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
