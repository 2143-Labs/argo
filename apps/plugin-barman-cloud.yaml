# Out-of-tree CloudNativePG backup plugin (Barman Cloud). The in-tree
# spec.backup.barmanObjectStore cannot send an SSE-C customer key, and every
# offsite backup object is SSE-C encrypted, so offsite backups need this plugin.
# It must live in cnpg-system next to the operator and needs cert-manager for its
# serving certificate. Backs the ObjectStores that docs/db-backups.md describes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-barman-cloud
  namespace: argocd
  annotations:
    # after cert-manager, before the Clusters that reference the plugin
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: plugin-barman-cloud
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.9.0
    helm:
      releaseName: plugin-barman-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
