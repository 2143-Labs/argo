# Converted from apps/crowdsec.yaml (bigp nonprod plan, Step 6.0); spec verbatim.
# One Application per cluster labelled env=prod|nonprod: `crowdsec` on prod
# (name unchanged, re-adopts via tracking-id) and `crowdsec-nonprod`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-crowdsec
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [prod, nonprod]
  # nonprod renders crowdsec-lapi-secrets from the chart, whose values come
  # from randAscii/randAlphaNum (its `lookup` fallback is empty under Argo).
  # Without this, every refresh produces new data, selfHeal re-applies it,
  # reloader restarts LAPI/appsec, forever. Keep the first-created data.
  # Prod uses the ExternalSecret and is unaffected (spec unchanged).
  templatePatch: |
    {{- if ne (index .metadata.labels "env") "prod" }}
    spec:
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: crowdsec-lapi-secrets
          jsonPointers:
            - /data
        # the chart also stamps a checksum of that random secret on the pod
        # template, which would roll LAPI on every sync.
        - group: apps
          kind: Deployment
          name: crowdsec-lapi
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1lapi-secret
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
    {{- end }}
  template:
    metadata:
      name: 'crowdsec{{ if ne (index .metadata.labels "env") "prod" }}-{{ index .metadata.labels "env" }}{{ end }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: default
      sources:
        - chart: crowdsec
          repoURL: https://crowdsecurity.github.io/helm-charts
          targetRevision: 0.24.2
          helm:
            releaseName: crowdsec
            valueFiles:
              - '$values/workloads/crowdsec/values-{{ index .metadata.labels "env" }}.yaml'
        - repoURL: https://github.com/2143-Labs/argo.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: crowdsec
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
