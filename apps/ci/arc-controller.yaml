# GitHub Actions Runner Controller — cluster-scoped controller.
# Manages listener pods and runner scale sets.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ARC publishes its charts as OCI artifacts. The git repoURL previously used
    # here has no Helm index: upstream keeps the charts under charts/ and there
    # is no <repoURL>/index.yaml, so this source never resolved.
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.1
    helm:
      values: |
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
