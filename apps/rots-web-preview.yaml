# One Application per open PR in 2143-Labs/rots4 (private), served at
# https://rots-{N}.john2143.com: web client, rots-authserver + a 1-instance CNPG
# database, and one game server (wss /ws/0, native UDP
# 192.168.6.33:31000+4*(N%1000), i.e. 31000-34999; PR numbers equal mod 1000 collide, accepted),
# provisioned by the authserver per instance (gameserver.provisioner: kubernetes)
# from PodTemplate rots-gameserver, so there is no StatefulSet in this render.
#
# The chart lives here (workloads/rots-web), not in rots4: the AppProject does
# not allow that repo as a source. The images are CI's per-commit tags
# <component>-pr-<N>-<head sha> (webserver-wasm, gameserver, authserver) on
# registry.ts.2143.me/2143-labs/rots4 (rots4 build_nix.yml, same-repo PRs only), so a PR
# has no image for a new head until that head's CI publishes.
# The pullRequest generator's github-token must be able to read the private repo. Closing the PR prunes the namespace (database
# included) and routes. Pattern copied from status-design-preview.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rots-web-preview
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: 2143-Labs
          repo: rots4
          tokenRef: { secretName: github-token, key: token }
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'rots-pr-{{.number}}'
      labels:
        2143.me/tracker: game
        edge.2143.me/class: game
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/2143-Labs/argo.git
        targetRevision: HEAD
        path: workloads/rots-web
        helm:
          parameters:
            - { name: namespace, value: 'rots-pr-{{.number}}' }
            - { name: host, value: 'rots-{{.number}}.john2143.com' }
            - { name: routeName, value: 'rots-pr-{{.number}}' }
            - { name: publicUrl, value: 'https://rots-{{.number}}.john2143.com' }
            - { name: image.tag, value: 'webserver-wasm-pr-{{.number}}-{{.head_sha}}' }
            - { name: authserver.secretKey, value: john2143-com/rots-preview/rots-authserver-secret }
            - { name: authserver.disabledProviders, value: discord }
            - { name: authserver.image, value: 'registry.ts.2143.me/2143-labs/rots4:authserver-pr-{{.number}}-{{.head_sha}}' }
            - { name: gameserver.tag, value: 'gameserver-pr-{{.number}}-{{.head_sha}}' }
            - { name: gameserver.replicas, value: '1' }
            # Managed mode: the authserver spawns one instance per new player.
            - { name: gameserver.provisioner, value: kubernetes }
            - { name: gameserver.capacityPerServer, value: '2' }
            # .number is a string in the pullRequest generator, hence atoi.
            - { name: gameserver.udpPortBase, value: '{{ add 31000 (mul 4 (mod (atoi .number) 1000)) }}' }
            - { name: gameserver.lbIP, value: 192.168.6.33 }
            - { name: gameserver.lbIPv6, value: 'fd00:6::33' }
            - { name: gameserver.shareKey, value: rots-preview }
            - { name: temporal.namespace, value: rots-preview }
            - { name: temporal.taskQueue, value: 'rots-pr-{{.number}}' }
            - { name: authserver.sessionExecutionTimeoutSecs, value: '7200' }
            - { name: temporal.cleanupOnDelete, value: 'true' }
      destination:
        server: https://kubernetes.default.svc
        namespace: 'rots-pr-{{.number}}'
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          # Gateway API defaulting (see status-design.yaml).
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
