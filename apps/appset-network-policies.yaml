# Converted from apps/network-policies.yaml (bigp nonprod plan, Step 6.0).
# One Application per cluster labelled env=prod|nonprod: `network-policies`
# on prod (name unchanged, re-adopts via tracking-id), `network-policies-nonprod`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-network-policies
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [prod, nonprod]
  # nonprod has no keda namespace (keda is prod-only), so skip its policies
  # there. templatePatch keeps the prod Application spec unchanged.
  templatePatch: |
    {{- if ne (index .metadata.labels "env") "prod" }}
    spec:
      source:
        directory:
          exclude: keda.yaml
    {{- end }}
  template:
    metadata:
      name: 'network-policies{{ if ne (index .metadata.labels "env") "prod" }}-{{ index .metadata.labels "env" }}{{ end }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/2143-Labs/argo.git
        targetRevision: HEAD
        path: workloads/network-policies
      destination:
        server: '{{ .server }}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
