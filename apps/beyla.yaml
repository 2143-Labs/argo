apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beyla
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: beyla
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.16.11
    helm:
      releaseName: beyla
      values: |
        nodeSelector:
          beyla.enabled: "true"
        image:
          tag: "3.35.0"
        config:
          create: true
          data:
            otel_traces_export:
              endpoint: http://alloy.observability.svc:4318
            otel_metrics_export:
              endpoint: http://alloy.observability.svc:4318
            attributes:
              kubernetes:
                enable: true
            # Setting discovery here suppresses the chart's default
            # instrument: [{k8s_namespace: "*"}], so it is restated. These
            # namespaces are control planes: Longhorn alone was half of all
            # Beyla series, keyed by short-lived rebuild ports, and
            # Mimir/Loki/Tempo/Grafana export native metrics. Entries are ORed
            # and add to Beyla's built-in exclusions (kube-system etc.).
            discovery:
              instrument:
                - k8s_namespace: "*"
              exclude_instrument:
                - k8s_namespace: longhorn-system
                - k8s_namespace: metallb-system
                - k8s_namespace: argocd
                - k8s_namespace: cnpg-system
                - k8s_namespace: keda
                - k8s_namespace: keda-add-ons-http
                - k8s_namespace: kured
                - k8s_namespace: kube-state-metrics
                - k8s_namespace: kube-state-metrics-fast
                - k8s_namespace: observability
            filter:
              network:
                k8s_dst_owner_name:
                  not_match: '{kube*,*jaeger-agent*,*prometheus*,*promtail*,*grafana-agent*}'
                k8s_src_owner_name:
                  not_match: '{kube*,*jaeger-agent*,*prometheus*,*promtail*,*grafana-agent*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
