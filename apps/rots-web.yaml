# ROTS (bevy2025) production at https://rots.john2143.com, namespace rots-prod:
# web client (CI's webserver-wasm-latest, scale-to-zero via KEDA HTTP),
# rots-authserver + its CNPG database, and 4 game servers (wss /ws/<i>, native
# UDP 192.168.6.32:35000-35003). Previews are separate (see rots-web-preview.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rots-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/argo.git
    targetRevision: HEAD
    path: workloads/rots-web
    helm:
      parameters:
        - { name: namespace, value: rots-prod }
        - { name: host, value: rots.john2143.com }
        - { name: routeName, value: rots-web }
        - { name: publicUrl, value: 'https://rots.john2143.com' }
        - { name: image.tag, value: webserver-wasm-latest }
        - { name: authserver.secretKey, value: john2143-com/rots-prod/rots-authserver-secret }
        - { name: db.instances, value: '2' }
        - { name: db.protect, value: 'true' }
        - { name: gameserver.tag, value: gameserver-latest }
        - { name: gameserver.replicas, value: '4' }
        - { name: gameserver.udpPortBase, value: '35000' }
        - { name: gameserver.lbIP, value: 192.168.6.32 }
        - { name: gameserver.lbIPv6, value: 'fd00:6::32' }
        - { name: gameserver.shareKey, value: rots-prod }
  destination:
    server: https://kubernetes.default.svc
    namespace: rots-prod
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Gateway API defaulting (see status-design.yaml).
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
