# ROTS (rots4) production at https://rots.john2143.com, namespace rots-prod:
# web client (the rots4 build that CI last deployed, always warm: KEDA min 1, so a
# page view never waits on a cold start),
# rots-authserver + its CNPG database, and game servers provisioned just in time
# by the authserver (gameserver.provisioner: kubernetes): one instance per new
# player, destroyed when idle, up to 64 at once (wss /ws/<k>, native UDP
# 192.168.6.32:36000-36063; the router forwards 36000-36400). One instance is
# kept warm (booted in pre-game, paused) so a new player is placed on it in ~1 s
# instead of waiting ~15 s for a pod and its volume. Because a warm pod keeps a
# KEDA trigger lit, the authserver never drops below one replica (scale 1-3).
# Previews are separate (see rots-web-preview.yaml).
#
# The PriorityClass is cluster-scoped and shared by every preview, so prod is the
# only app that may create it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rots-web
  labels:
    2143.me/tracker: game
    edge.2143.me/class: game
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/argo.git
    targetRevision: HEAD
    path: workloads/rots-web
    helm:
      parameters:
        - { name: namespace, value: rots-prod }
        - { name: host, value: rots.john2143.com }
        - { name: routeName, value: rots-web }
        - { name: publicUrl, value: 'https://rots.john2143.com' }
        # rots4 CI (build_nix.yml job deploy, scripts/ci-argo-bump.sh) rewrites image.tag,
        # authserver.image and gameserver.tag to one commit's <sha7> tags after every green
        # main build; keep each on one line in this "- { name: …, value: … }" form.
        - { name: image.tag, value: webserver-wasm-795daef }
        # Serve the wasm bundle warm: one rots-web pod is always up (KEDA min 1)
        # instead of cold-starting behind the interceptor on the first page view.
        - { name: web.minReplicas, value: '1' }
        - { name: authserver.secretKey, value: john2143-com/rots-prod/rots-authserver-secret }
        - { name: authserver.image, value: 'registry.ts.2143.me/2143-labs/rots4:authserver-795daef' }
        - { name: db.instances, value: '2' }
        - { name: db.protect, value: 'true' }
        - { name: gameserver.tag, value: gameserver-795daef }
        # Managed mode: no standing servers; the authserver spawns one instance per
        # new player (friends join by code) and destroys it when idle. slots caps
        # concurrent instances: UDP 36000-36063, /ws/0-63 (4 HTTPRoutes of 16).
        - { name: gameserver.provisioner, value: kubernetes }
        - { name: gameserver.slots, value: '64' }
        - { name: gameserver.warmInstances, value: '1' }
        - { name: gameserver.udpPortBase, value: '36000' }
        - { name: gameserver.lbIP, value: 192.168.6.32 }
        - { name: gameserver.lbIPv6, value: 'fd00:6::32' }
        - { name: gameserver.shareKey, value: rots-prod }
        - { name: gameserver.priorityClass.create, value: 'true' }
        - { name: gameserver.quota.cpu, value: '32' }
        - { name: gameserver.quota.memory, value: 40Gi }
        - { name: temporal.namespace, value: rots }
        - { name: temporal.taskQueue, value: rots-prod }
        - { name: authserver.scaleToZero.minReplicas, value: '1' }
        - { name: authserver.scaleToZero.maxReplicas, value: '3' }
  destination:
    server: https://kubernetes.default.svc
    namespace: rots-prod
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Gateway API defaulting (see status-design.yaml).
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
