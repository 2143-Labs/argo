# ROTS (rots4) production at https://rots.john2143.com, namespace rots-prod:
# web client (the rots4 build that CI last deployed, always warm: KEDA min 1, so a
# page view never waits on a cold start),
# rots-authserver + its CNPG database, and game servers provisioned just in time
# by the authserver (gameserver.provisioner: kubernetes): one instance per new
# player, destroyed when idle, out of 1000 slots (wss /ws/0-999 in 63 routes of
# 16, native UDP 192.168.6.32:36000-37999 - the range Verizon and the MikroTik
# forward, so slots are headroom the WAN already covers). Live instances are capped
# by `gameserver.quota`, not by the slot count.
# Placement is spread over 8 coordinator shards of 250 slots; changing slots or
# shards is a re-shard and needs the stop-the-world cutover. One instance is
# kept warm (booted in pre-game, paused) so a new player is placed on it in ~1 s
# instead of waiting ~15 s for a pod. Because a warm pod keeps a
# KEDA trigger lit, the authserver never drops below one replica (scale 1-3).
# Previews are separate (see rots-web-preview.yaml).
#
# The PriorityClass is cluster-scoped and shared by every preview, so prod is the
# only app that may create it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rots-web
  labels:
    2143.me/tracker: game
    edge.2143.me/class: game
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/argo.git
    targetRevision: HEAD
    path: workloads/rots-web
    helm:
      parameters:
        - { name: namespace, value: rots-prod }
        - { name: host, value: rots.john2143.com }
        - { name: routeName, value: rots-web }
        - { name: publicUrl, value: 'https://rots.john2143.com' }
        # rots4 CI (build_nix.yml job deploy, scripts/ci-argo-bump.sh) rewrites image.tag,
        # authserver.image and gameserver.tag to one commit's <sha7> tags after every green
        # main build; keep each on one line in this "- { name: …, value: … }" form.
        - { name: image.tag, value: webserver-wasm-df6062e }
        # Serve the wasm bundle warm: one rots-web pod is always up (KEDA min 1)
        # instead of cold-starting behind the interceptor on the first page view.
        - { name: web.minReplicas, value: '1' }
        - { name: authserver.secretKey, value: john2143-com/rots-prod/rots-authserver-secret }
        - { name: authserver.image, value: 'registry.ts.2143.me/2143-labs/rots4:authserver-df6062e' }
        - { name: db.instances, value: '2' }
        - { name: db.protect, value: 'true' }
        - { name: db.offsiteBackup, value: 'true' }
        - { name: db.size, value: 8Gi }
        - { name: db.walSize, value: 4Gi }
        - { name: db.maxSlotWalKeepSize, value: 2GB }
        - { name: db.resources.requests.cpu, value: 250m }
        - { name: db.resources.requests.memory, value: 512Mi }
        - { name: db.resources.limits.cpu, value: '2' }
        - { name: db.resources.limits.memory, value: 2Gi }
        # The one central account-settings store (templates/settings.yaml, settings-db.yaml):
        # every preview's authserver proxies to it, so players' controls follow them across
        # environments. Enabling it only here is what keeps a single copy of the truth.
        - { name: settings.enabled, value: 'true' }
        - { name: settings.url, value: http://rots-settings:8100 }
        - { name: sync.replicas, value: '2' }
        - { name: gameserver.tag, value: gameserver-df6062e }
        # Managed mode: no standing servers; the authserver spawns one instance per
        # new player (friends join by code) and destroys it when idle. slots is the
        # address space (UDP 36000-37999, /ws/0-999 in 63 HTTPRoutes of 16); live
        # instances are capped by gameserver.quota. 1000 slots over 8 shards = 125 each.
        - { name: gameserver.provisioner, value: kubernetes }
        - { name: gameserver.slots, value: '1000' }
        - { name: gameserver.warmInstances, value: '1' }
        - { name: gameserver.shards, value: '8' }
        - { name: gameserver.udpPortBase, value: '36000' }
        - { name: gameserver.lbIP, value: 192.168.6.32 }
        - { name: gameserver.lbIPv6, value: 'fd00:6::32' }
        - { name: gameserver.shareKey, value: rots-prod }
        - { name: gameserver.priorityClass.create, value: 'true' }
        # requests of 126 game servers at 200m/256Mi: free node capacity (big, closet, nas, arch,
        # office) measured 2026-11-10 23:40Z + running game pods - 10. Re-measure when nodes change.
        - { name: gameserver.quota.cpu, value: 25200m }
        - { name: gameserver.quota.memory, value: 32256Mi }
        - { name: temporal.namespace, value: rots }
        - { name: temporal.taskQueue, value: rots-prod }
        - { name: authserver.scaleToZero.minReplicas, value: '1' }
        - { name: authserver.scaleToZero.maxReplicas, value: '3' }
  destination:
    server: https://kubernetes.default.svc
    namespace: rots-prod
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Gateway API defaulting (see status-design.yaml).
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
