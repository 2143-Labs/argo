# Default AppProject
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Default project
  sourceRepos:
    - https://github.com/2143-Labs/argo.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://argoproj.github.io/argo-helm
    - https://cloudnative-pg.github.io/charts
    - https://crowdsecurity.github.io/helm-charts
    - https://github.com/2143-Labs/cert-manager-webhook-desec
    - ghcr.io/magikid/modern-conduwuit-helm
    - https://github.com/actions/actions-runner-controller
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://haiwen.github.io/seafile-helm-chart/repo
    - https://charts.jetstack.io
    - https://charts.longhorn.io
    - https://go.temporal.io/helm-charts
    - https://kedacore.github.io/charts
    - https://spiffe.github.io/helm-charts-hardened/
    - https://charts.bitnami.com/bitnami
    - https://stakater.github.io/stakater-charts
    - https://metallb.github.io/metallb
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: rbac.authorization.k8s.io
      kind: '*'
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: spire.spiffe.io
      kind: '*'
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: gateway.networking.k8s.io
      kind: '*'
    - group: storage.k8s.io
      kind: CSIDriver
    - group: storage.k8s.io
      kind: StorageClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: longhorn.io
      kind: '*'
    - group: admissionregistration.k8s.io
      kind: '*'
    - group: apiregistration.k8s.io
      kind: '*'
    - group: scheduling.k8s.io
      kind: '*'
