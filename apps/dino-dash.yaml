# Dino-Dash production at https://dino.dsstar.us, namespace dino-prod, from the game
# repo's `master` branch, which only moves on dsstar's sign-off (2143-Labs/Dino-Dash:
# a Vite client served by darkhttpd and scaled to zero via KEDA HTTP, plus one
# always-on world server on /ws). dev is dino-dash-dev.yaml; previews are
# label-gated in dino-dash-preview.yaml.
# The game repo's .github/workflows/deploy.yml rewrites the image.tag line below on
# every master build; that line's exact format is load-bearing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dino-prod
  labels:
    2143.me/tracker: game
    edge.2143.me/class: game
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/argo.git
    targetRevision: HEAD
    path: workloads/dino-dash
    helm:
      parameters:
        - { name: namespace, value: dino-prod }
        - { name: host, value: dino.dsstar.us }
        - { name: routeName, value: dino-dash }
        # Until master's first build (dsstar's next sign-off) this pins the image prod
        # already served: the 2026-11-02 build of dev 2ec7fbd.
        - { name: image.tag, value: sha-d10a04f41f101a5b491102bf97187ee442206c5b }
        - { name: gameserver.replicas, value: '1' }
  destination:
    server: https://kubernetes.default.svc
    namespace: dino-prod
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Gateway API defaulting (see status-design.yaml).
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
