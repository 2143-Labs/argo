apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.16.1
    helm:
      releaseName: metallb
      values: |
        speaker:
          tolerations:
            - key: pi
              operator: Exists
              effect: NoSchedule
        # Subchart values nest under "frr-k8s:" (hyphen), NOT "frrk8s:" —
        # the parent chart only accepts enabled/external/namespace there.
        frr-k8s:
          frrk8s:
            tolerations:
              - key: pi
                operator: Exists
                effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
