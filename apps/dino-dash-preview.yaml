# One Application per open same-repo PR in 2143-Labs/Dino-Dash, served at
# https://dino-{N}.dsstar.us (namespace dino-pr-{N}), with its own world server that
# scales to zero when nobody is playing.
#
# There is no opt-in gate: gameserver.scaleToZero is on, so the web client and the
# world server both idle at 0 replicas, and TLS is the edge wildcard, so an open PR
# costs a namespace, a route and this Application and nothing else. Closing the PR
# prunes the whole environment on the next requeue.
# The chart lives here (workloads/dino-dash), not in the game repo: the AppProject
# does not allow that repo as a source. The image is the game repo's deploy.yml PR
# build (web-sha-<PR head> / server-sha-<PR head>), so a PR has no working
# environment until its CI finishes, and each new push rolls once its build lands.
# Pattern copied from rots-web-preview and moss-and-wool-preview.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dino-preview
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: 2143-Labs
          repo: Dino-Dash
          tokenRef: { secretName: github-token, key: token }
          # Every open PR, no label gate. There is also no fork filter available:
          # `filters` only knows branchMatch/targetBranchMatch/titleMatch, and an
          # unknown key is silently dropped. A fork PR therefore gets an Application
          # whose image never appears (the game repo only builds same-repo PRs); it
          # sits at 0 replicas and inert until the PR is closed.
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'dino-pr-{{.number}}'
      labels:
        2143.me/tracker: game
        edge.2143.me/class: game
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/2143-Labs/argo.git
        targetRevision: HEAD
        path: workloads/dino-dash
        helm:
          parameters:
            - { name: namespace, value: 'dino-pr-{{.number}}' }
            - { name: host, value: 'dino-{{.number}}.dsstar.us' }
            - { name: routeName, value: 'dino-pr-{{.number}}' }
            - { name: image.tag, value: 'sha-{{.head_sha}}' }
            - { name: gameserver.replicas, value: '1' }
            - { name: gameserver.debug, value: 'true' }
      destination:
        server: https://kubernetes.default.svc
        namespace: 'dino-pr-{{.number}}'
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          # Gateway API defaulting (see status-design.yaml).
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
