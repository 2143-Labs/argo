# Converted from apps/pocket-id.yaml (bigp nonprod plan, Step 6.0); spec verbatim.
# One Application per cluster labelled env=prod|nonprod: `pocket-id` on prod
# (name unchanged, re-adopts via tracking-id) and `pocket-id-nonprod`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-pocket-id
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [prod, nonprod]
  template:
    metadata:
      name: 'pocket-id{{ if ne (index .metadata.labels "env") "prod" }}-{{ index .metadata.labels "env" }}{{ end }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/2143-Labs/argo.git
        targetRevision: HEAD
        path: workloads/pocket-id
        helm:
          valueFiles:
            - 'values-{{ index .metadata.labels "env" }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: pocket-id
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        - group: ""
          kind: PersistentVolume
          jqPathExpressions:
            - .metadata.annotations
            - .status
            - .spec.claimRef
