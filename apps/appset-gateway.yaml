# Converted from apps/gateway.yaml (bigp nonprod plan, Step 6.0); spec verbatim.
# One Application per cluster labelled env=prod|nonprod: `gateway` on prod
# (name unchanged, re-adopts via tracking-id) and `gateway-nonprod`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [prod, nonprod]
  template:
    metadata:
      name: 'gateway{{ if ne (index .metadata.labels "env") "prod" }}-{{ index .metadata.labels "env" }}{{ end }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      source:
        repoURL: https://github.com/2143-Labs/argo.git
        targetRevision: HEAD
        path: workloads/gateway
        helm:
          valueFiles:
            - 'values-{{ index .metadata.labels "env" }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: Gateway
          # API-server defaulting on Gateway API CRDs: certificateRefs items gain
          # a defaulted group:"" field not present in the manifests.
          jqPathExpressions:
            - .spec.listeners[].tls.certificateRefs[].group
            - .metadata.annotations."traefik.ingress.kubernetes.io/router.tls"
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          # API-server defaulting on Gateway API CRDs: parentRefs gain group/kind
          # defaults, rules[].matches defaults to a / prefix, backendRefs gain
          # group/kind/weight defaults - none present in the manifests.
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].matches
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
