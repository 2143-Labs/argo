# Shared store for application secrets.
#
# OpenBao is reached over the in-cluster plaintext listener on 8202, published
# only by the openbao-eso Service in the openbao namespace. That listener exists
# because OpenBao's serving certificate carries a single SAN
# (openbao.ts.2143.me), ESO offers no TLS server-name override, Let's Encrypt
# cannot issue for .svc names, and openbao.ts.2143.me is not resolvable from
# inside the cluster. The 8202 path is ClusterIP-only and gated by the
# openbao-server-ingress NetworkPolicy.
#
# Authentication is Kubernetes-native: ESO presents its own ServiceAccount token
# by default. The OpenBao side is the `external-secrets` auth role bound to
# ServiceAccount external-secrets/external-secrets with the read-only `eso-read`
# policy. Both were created one-time by the operator; neither is GitOps-managed,
# because writing them requires OpenBao administrative access that does not
# exist in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    openBao:
      server: http://openbao-eso.openbao.svc:8202
      path: secret
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
