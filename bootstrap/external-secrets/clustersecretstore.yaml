# Shared store for application secrets.
#
# OpenBao is reached over the in-cluster plaintext listener on 8210, published
# only by the openbao-eso Service in the openbao namespace. That listener exists
# because OpenBao's serving certificate carries a single SAN
# (openbao.ts.2143.me), ESO offers no TLS server-name override, Let's Encrypt
# cannot issue for .svc names, and openbao.ts.2143.me is not resolvable from
# inside the cluster. The 8210 path is ClusterIP-only and gated by the
# openbao-server-ingress NetworkPolicy.
#
# 8210 rather than 8202: the OpenBao chart declares 8202 as its replication port
# (`https-rep`) while this listener is plaintext, so the two must not share a
# port. 8210 is declared honestly through the chart's `server.extraPorts`.
#
# Authentication is Kubernetes-native: ESO presents its own ServiceAccount token
# by default. The OpenBao side is the `external-secrets` auth role bound to
# ServiceAccount external-secrets/external-secrets with the read-only `eso-read`
# policy. Both are created one-time by the operator; neither is GitOps-managed,
# because writing them requires OpenBao administrative access that does not
# exist in the cluster.
#
# `eso-read` must grant read on `sys/mounts` and `sys/mounts/*` in addition to
# the data/metadata paths: ESO validates a store by calling
# GET /v1/sys/mounts/<path>, which returns 403 without it and leaves the store
# Ready=False with reason InvalidProviderConfig.
#
# The KV v2 mount is `consumers`, not `secret`. OpenBao's own audit stream shows
# consumers/data/... traffic and no requests to a `secret/` mount at all. Keys
# therefore live at consumers/data/<scope>/<name>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    openBao:
      server: http://openbao-eso.openbao.svc:8210
      path: consumers
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
