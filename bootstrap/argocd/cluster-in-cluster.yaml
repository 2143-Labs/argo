# Explicit Argo cluster entry for prod, so ApplicationSet cluster generators
# can select it by label (the implicit in-cluster entry has no labels).
# Applied by hand once: kubectl --context closet-as-admin apply -f bootstrap/argocd/cluster-in-cluster.yaml
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: prod
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
